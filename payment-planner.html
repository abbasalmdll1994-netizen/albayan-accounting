<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14528c"><title>مواعيد التسديد</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#14283d;font-family:Tahoma,Arial,sans-serif}.top{background:linear-gradient(135deg,#174f86,#0d3c70);color:#fff;padding:17px}.head{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}.title{text-align:center}.title h1{margin:0;font-size:25px}.title p{margin:5px 0 0;color:#dceaf7}.office,.date{font-size:13px;line-height:1.7}main{max-width:1100px;margin:auto;padding:14px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:9px}.day{border:1px solid #d7e1eb;background:#fff;border-radius:13px;padding:12px 6px;min-height:83px;font-weight:700;font-size:16px}.day span{display:block;margin:8px auto 0;width:34px;height:34px;line-height:34px;border-radius:12px;background:#e9f1fa}.day.active{background:#1670df;color:#fff;border-color:#1670df}.day.active span{background:#d7e9ff;color:#154b7d}.layout{display:grid;grid-template-columns:1.15fr .95fr;gap:14px;margin-top:14px}.card{background:#fff;border:1px solid #d8e2ec;border-radius:14px;overflow:hidden}.cardhead{background:linear-gradient(135deg,#195c99,#174d83);color:#fff;padding:15px;font-size:20px;font-weight:700}.body{padding:13px}.field{width:100%;height:50px;border:1px solid #cbd8e4;border-radius:10px;padding:10px 12px;font:inherit;margin-bottom:9px;background:#fff}.daypick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.pick{border:1px solid #bcd0e3;border-radius:9px;background:#eef6ff;padding:10px 4px;font-weight:700}.pick.on{background:#176ed0;color:#fff}.hint{font-size:12px;color:#718397;margin:5px 2px 10px}.suggest{border-top:1px solid #e1e8ef;margin-top:10px}.suggest button{display:block;width:100%;border:0;border-bottom:1px solid #edf1f5;background:#fff;text-align:right;padding:11px;font:inherit}.list{padding:8px 12px 18px}.customer{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#f8fafc;border:1px solid #dfe7ee;border-radius:11px;padding:12px;margin:8px 0}.customer b{display:block;font-size:16px}.customer small{display:block;color:#728397;margin-top:4px}.del{border:0;background:#fff0f0;color:#b42c2c;border-radius:9px;padding:9px}.empty{text-align:center;color:#738598;padding:28px 8px}.foot{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.foot button{height:48px;border:0;border-radius:11px;font:700 15px Tahoma}.all{background:#ffc638}.manage{background:#687b91;color:#fff}@media(max-width:760px){.office{display:none}.date{font-size:12px}.title h1{font-size:21px}.days{grid-template-columns:repeat(4,1fr)}.layout{grid-template-columns:1fr}.daypick{grid-template-columns:repeat(4,1fr)}}@media(max-width:430px){main{padding:9px}.days{gap:5px}.day{font-size:13px;min-height:69px;padding:8px 2px}.day span{width:28px;height:28px;line-height:28px}.head{justify-content:center}.date{display:none}.cardhead{font-size:18px}}</style></head><body><header class="top"><div class="head"><div class="office">👥 مكتب القرية<br>واسط - السوق الكبير</div><div class="title"><h1>مواعيد التسديد</h1><p>تابع مواعيد زبائنك بسهولة</p></div><div class="date" id="date"></div></div></header><main><div class="days" id="days"></div><div class="layout"><section class="card"><div class="cardhead" id="listTitle">زبائن اليوم</div><div class="list" id="list"></div></section><section class="card"><div class="cardhead">👤 إضافة زبون</div><div class="body"><input class="field" id="name" list="names" autocomplete="off" placeholder="اسم الزبون — اكتب أول الأحرف"><datalist id="names"></datalist><div class="hint">اختار اليوم فقط؛ ينضاف الزبون مباشرة بدون رسالة تأكيد.</div><div class="daypick" id="daypick"></div><div class="suggest" id="suggest"></div></div></section></div><div class="foot"><button class="all" onclick="showAll()">📅 عرض الكل</button><button class="manage" onclick="manageNames()">👥 الزبائن المحفوظين</button></div></main><script>const KEY='qaryaPaymentPlannerV1',NKEY='qaryaPaymentNamesV1',DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];let selected=today();function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function save(a){localStorage.setItem(KEY,JSON.stringify(a))}function names(){try{return JSON.parse(localStorage.getItem(NKEY)||'[]')}catch{return[]}}function saveNames(a){localStorage.setItem(NKEY,JSON.stringify([...new Set(a.filter(Boolean))]))}function today(){const n=new Date().getDay();return ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][n]}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function count(d){return load().filter(x=>x.day===d).length}function renderDays(){days.innerHTML=DAYS.map(d=>`<button class="day ${selected===d?'active':''}" onclick="selectDay('${d}')">${d}<span>${count(d)}</span></button>`).join('')}function renderPicks(){daypick.innerHTML=DAYS.map(d=>`<button class="pick ${selected===d?'on':''}" onclick="quickAdd('${d}')">${d}</button>`).join('')}function selectDay(d){selected=d;renderDays();renderPicks();renderList()}function renderList(){const a=load().filter(x=>x.day===selected);listTitle.textContent='زبائن يوم '+selected+' — '+a.length;list.innerHTML=a.length?a.map((x,i)=>`<div class="customer"><div><b>${i+1}. ${esc(x.name)}</b><small>موعد التسديد: ${x.day}</small></div><button class="del" onclick="del('${x.id}')">حذف الموعد</button></div>`).join(''):'<div class="empty">لا يوجد زبائن بهذا اليوم</div>'}function quickAdd(d){const n=name.value.trim();selected=d;if(!n){name.focus();renderDays();renderPicks();return}const a=load();a.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),name:n,day:d});save(a);saveNames([...names(),n]);name.value='';renderAll();name.focus()}function del(id){save(load().filter(x=>x.id!==id));renderAll()}function renderNames(){const a=names();document.getElementById('names').innerHTML=a.map(n=>`<option value="${esc(n)}"></option>`).join('');suggest.innerHTML=a.slice(-5).reverse().map(n=>`<button onclick="choose('${encodeURIComponent(n)}')">👥 ${esc(n)}</button>`).join('')}function choose(v){name.value=decodeURIComponent(v);name.focus()}function showAll(){const a=load();listTitle.textContent='كل مواعيد التسديد — '+a.length;list.innerHTML=a.length?a.map((x,i)=>`<div class="customer"><div><b>${i+1}. ${esc(x.name)}</b><small>${x.day}</small></div><button class="del" onclick="del('${x.id}')">حذف الموعد</button></div>`).join(''):'<div class="empty">لا توجد مواعيد</div>'}function manageNames(){const a=names();if(!a.length){alert('لا توجد أسماء محفوظة');return}const n=prompt('لحذف زبون نهائياً من الاقتراحات، اكتب اسمه بالضبط:\n\n'+a.join(' — '));if(n&&a.includes(n)){saveNames(a.filter(x=>x!==n));renderNames()}}function renderAll(){renderDays();renderPicks();renderList();renderNames()}document.getElementById('date').textContent=new Intl.DateTimeFormat('ar-IQ',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(new Date());name.addEventListener('input',()=>{const q=name.value.trim().toLowerCase();const a=names().filter(n=>!q||n.toLowerCase().includes(q)).slice(0,5);suggest.innerHTML=a.map(n=>`<button onclick="choose('${encodeURIComponent(n)}')">👥 ${esc(n)}</button>`).join('')});renderAll();</script></body></html>
