<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b63"><title>برنامج مواعيد التسديد</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172b40;font-family:Tahoma,Arial,sans-serif}.top{background:#123b63;color:#fff;padding:18px 16px}.top h1{margin:0;font-size:22px}.top p{margin:5px 0 0;color:#dbe8f3;font-size:13px}main{max-width:760px;margin:auto;padding:14px}.days{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.day{border:1px solid #d5e0ea;background:#fff;border-radius:14px;padding:16px;text-align:right;color:#123b63;font:700 17px Tahoma;min-height:82px}.day small{display:block;color:#687b8d;font-weight:400;margin-top:7px}.day.today{border:2px solid #1769aa;background:#eef6ff}.panel{background:#fff;border:1px solid #d5e0ea;border-radius:14px;padding:14px;margin-top:14px}.panel h2{font-size:19px;margin:0 0 12px}.row{display:grid;grid-template-columns:1fr 150px;gap:8px}input,select,button{font:inherit;min-height:46px;border-radius:10px;border:1px solid #b9c9d8;padding:9px 11px;background:#fff}.primary{background:#123b63;color:#fff;border-color:#123b63}.list{margin-top:12px}.customer{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid #e2e9ef;padding:12px 2px}.customer b{display:block}.customer small{color:#687b8d}.customer button{min-height:38px;padding:5px 10px;color:#a12727}.empty{text-align:center;color:#687b8d;padding:20px}.back{display:none;margin-bottom:10px}@media(max-width:520px){.row{grid-template-columns:1fr}.days{grid-template-columns:1fr 1fr}.day{padding:13px;font-size:16px}}</style></head><body><header class="top"><h1>📅 برنامج مواعيد التسديد</h1><p>مستقل — ترتيب الزبائن حسب أيام الأسبوع</p></header><main><section id="home"><div class="days" id="days"></div><div class="panel"><h2>إضافة موعد زبون</h2><div class="row"><input id="name" placeholder="اسم الزبون" maxlength="120"><select id="day"><option>السبت</option><option>الأحد</option><option>الاثنين</option><option>الثلاثاء</option><option>الأربعاء</option><option>الخميس</option><option>الجمعة</option></select></div><button class="primary" id="add" style="width:100%;margin-top:9px">حفظ الموعد</button></div></section><section id="view" hidden><button class="back" id="back">← رجوع للأيام</button><div class="panel"><h2 id="title"></h2><div class="list" id="list"></div></div></section></main><script>const KEY='qaryaPaymentPlannerV1',DAYS=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];let selected='';function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function save(v){localStorage.setItem(KEY,JSON.stringify(v))}function todayName(){return new Intl.DateTimeFormat('ar-IQ',{weekday:'long'}).format(new Date()).replace('ال','ال')}function count(day){return load().filter(x=>x.day===day).length}function renderDays(){const t=todayName();document.getElementById('days').innerHTML=DAYS.map(d=>`<button class="day ${t===d?'today':''}" onclick="openDay('${d}')">${d}<small>${count(d)} زبون</small></button>`).join('')}function openDay(d){selected=d;document.getElementById('home').hidden=true;document.getElementById('view').hidden=false;document.getElementById('back').style.display='inline-block';document.getElementById('title').textContent='مواعيد يوم '+d;renderList()}function renderList(){const a=load().filter(x=>x.day===selected),el=document.getElementById('list');el.innerHTML=a.length?a.map(x=>`<div class="customer"><div><b>${esc(x.name)}</b><small>موعد التسديد: ${x.day}</small></div><button onclick="del('${x.id}')">حذف</button></div>`).join(''):'<div class="empty">لا يوجد زبائن مسجلين بهذا اليوم</div>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function del(id){save(load().filter(x=>x.id!==id));renderList();renderDays()}document.getElementById('add').onclick=()=>{const n=document.getElementById('name').value.trim(),d=document.getElementById('day').value;if(!n){alert('اكتب اسم الزبون');return}const a=load();a.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),name:n,day:d});save(a);document.getElementById('name').value='';renderDays();alert('تم حفظ موعد '+n+' يوم '+d)};document.getElementById('back').onclick=()=>{document.getElementById('view').hidden=true;document.getElementById('home').hidden=false;renderDays()};renderDays();</script></body></html>
