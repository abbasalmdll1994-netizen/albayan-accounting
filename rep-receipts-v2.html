<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b63"><title>سندات القبض | البيان</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#172b40;font-family:Tahoma,Arial}.top{background:#123b63;color:#fff;padding:15px}.wrap{max-width:760px;margin:auto;padding:12px}.back{border:0;border-radius:9px;padding:9px 12px}.card{background:#fff;border:1px solid #d9e3ed;border-radius:13px;padding:13px;margin:10px 0}.line{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{font-size:12px;color:#68798a}.amount{font-weight:bold;color:#17834a}.cancelled{opacity:.65}.badge{font-size:11px;border-radius:20px;padding:4px 8px;background:#e9f6ee;color:#177244}.badge.bad{background:#fff0f0;color:#b83232}.danger{border:0;background:#fff0f0;color:#b83232;border-radius:9px;padding:8px 11px;font-weight:bold}.empty{text-align:center;color:#778899;padding:30px}</style></head><body><header class="top"><b>سندات القبض</b></header><main class="wrap"><button class="back" onclick="location.href='representative.html?v=20260911-receipts'">رجوع للجولة</button><div id="list"></div></main><script>const WORK='albayanWorkspaceV1',RECEIPTS='albayanPaymentReceiptsV2',LEGACY='albayanRepReceiptsV1';const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),fmt=n=>new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:2}).format(Number(n)||0)+' د.ع',esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function render(){const rs=load(RECEIPTS,[]).slice().sort((a,b)=>String(b.createdAt||b.date).localeCompare(String(a.createdAt||a.date)));list.innerHTML=rs.length?rs.map(r=>'<div class="card '+(r.status==='cancelled'?'cancelled':'')+'"><div class="line"><div><b>'+esc(r.customer)+'</b><div class="muted">'+esc(r.number)+' · '+esc(r.date)+'</div></div><b class="amount">'+fmt(r.amount)+'</b></div><div class="line" style="margin-top:10px"><span class="badge '+(r.status==='cancelled'?'bad':'')+'">'+(r.status==='cancelled'?'ملغي':'مؤكد')+'</span>'+(r.status==='cancelled'?'':'<button class="danger" onclick="reverse(\''+encodeURIComponent(r.id)+'\')">إلغاء السند</button>')+'</div></div>').join(''):'<div class="empty">ماكو سندات قبض محفوظة.</div>'}function reverse(encoded){const id=decodeURIComponent(encoded),rs=load(RECEIPTS,[]),r=rs.find(x=>String(x.id)===String(id));if(!r||r.status==='cancelled')return;if(!confirm('إلغاء سند '+r.number+' وإرجاع المبلغ إلى نفس الفواتير؟'))return;const w=load(WORK,{accounts:[],invoices:[]});for(const a of(r.allocations||[])){const doc=a.documentId??a.id,amount=Number(a.amount??a.allocated??0);const v=(w.invoices||[]).find(x=>String(x.id||x.number)===String(doc));if(v)v.paid=Math.max(0,Number(v.paid||0)-amount)}w.accounts=w.accounts||[];const now=new Date(),date=now.toISOString().slice(0,10),revId=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36));w.accounts.push({id:revId,customer:r.customer,date,owedBy:Number(r.amount||0),owedTo:0,source:'payment-reversal',receiptId:r.number,note:'إلغاء/عكس سند قبض '+r.number,linkedPaymentId:r.id,allocations:r.allocations||[]});w.accounts.push({id:revId+'-cash',customer:'الصندوق',date,owedBy:0,owedTo:Number(r.amount||0),source:'payment-cash-reversal',receiptId:r.number,note:'عكس قبض '+r.customer+' · سند '+r.number,linkedPaymentId:r.id});save(WORK,w);r.status='cancelled';r.cancelledAt=now.toISOString();r.reversalId=revId;r.syncStatus='pending';save(RECEIPTS,rs);const legacy=load(LEGACY,[]),lr=legacy.find(x=>String(x.id)===String(r.id));if(lr){lr.status='cancelled';lr.cancelledAt=r.cancelledAt;lr.syncStatus='pending'}save(LEGACY,legacy);render()}render();</script></body></html>
