<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b63"><title>لوحة المندوب | مكتب القرية</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Tahoma,Arial,sans-serif;background:#f3f6fa;color:#172b40}.top{height:60px;background:#123b63;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 13px;gap:10px}.top .who{min-width:0}.top h1{font-size:19px;margin:0}.top small{display:block;color:#d8e6f2;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top a{color:#fff;text-decoration:none;border:1px solid #ffffff55;border-radius:9px;padding:8px 11px}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:8px;background:#f3f6fa;border-bottom:1px solid #d9e3ed}.sum{background:#fff;border:1px solid #d9e3ed;border-radius:10px;padding:8px 10px}.sum span{display:block;color:#627387;font-size:10px}.sum b{display:block;color:#123b63;font-size:16px;margin-top:3px}.sum.collect b{color:#18864b}.sum.custody b{color:#a15c00}.sum.wait b{color:#b83232}.day-status{margin:0;padding:8px 12px;background:#eef5fb;border-bottom:1px solid #d9e3ed;color:#123b63;font-size:12px;font-weight:bold}.day-status.ok{background:#eaf7ef;color:#14663d}.day-status.warn{background:#fff7e8;color:#8a5a00}.quick{display:flex;gap:7px;overflow:auto;padding:8px;background:#f7f9fb;border-bottom:1px solid #d9e3ed}.quick button{white-space:nowrap;border:1px solid #c9d8e6;background:#fff;color:#123b63;border-radius:9px;min-height:39px;padding:7px 11px;font:inherit;font-weight:bold}.quick .green{background:#edf8f0;color:#16643c;border-color:#c5e4cc}.quick .orange{background:#fff7e8;color:#8a5a00;border-color:#edd49e}.tabs{display:flex;gap:7px;overflow:auto;padding:8px;background:#fff;border-bottom:1px solid #d9e3ed}.tab{border:1px solid #d9e3ed;background:#fff;color:#123b63;border-radius:9px;min-height:40px;padding:7px 12px;font:inherit;font-weight:bold;white-space:nowrap}.tab.on{background:#123b63;color:#fff;border-color:#123b63}.frame{width:100%;height:calc(100% - 258px);border:0;background:#fff;display:none}.frame.on{display:block}@media(max-width:760px){.top{height:56px}.top h1{font-size:17px}.summary{grid-template-columns:repeat(3,1fr)}.sum b{font-size:14px}.frame{height:calc(100% - 300px)}}@media(max-width:480px){.summary{grid-template-columns:1fr 1fr}.frame{height:calc(100% - 353px)}}</style></head><body><header class="top"><div class="who"><h1>لوحة المندوب</h1><small id="repLabel">المندوب</small></div><a href="start.html">رجوع</a></header><div class="summary"><div class="sum"><span>بيع اليوم</span><b id="sales">0 د.ع</b></div><div class="sum collect"><span>تحصيل اليوم</span><b id="collected">0 د.ع</b></div><div class="sum custody"><span>بذمة المندوب</span><b id="custody">0 د.ع</b></div><div class="sum wait"><span>فواتير انتظار</span><b id="pendingInvoices">0</b></div><div class="sum wait"><span>تسليم ينتظر المحاسب</span><b id="pendingHandovers">0</b></div></div><div id="dayStatus" class="day-status">جاري تحديث حالة اليوم...</div><div class="quick"><button data-open="repFrame">🚚 فتح الجولة الحالية</button><button data-open="repFrame">👥 قائمة الزبائن</button><button data-open="closeFrame" class="orange">📊 ملخص وإغلاق اليوم</button><button data-open="cashFrame" class="green">💵 تسليم التحصيل للمحاسب</button></div><nav class="tabs"><button class="tab on" data-frame="repFrame">🚚 الجولة والمبيعات</button><button class="tab" data-frame="closeFrame">📊 إغلاق اليوم</button><button class="tab" data-frame="cashFrame">💵 تسليم التحصيل</button></nav><iframe id="repFrame" class="frame on" src="representative.html?v=20260902-2345" title="نظام المندوب"></iframe><iframe id="closeFrame" class="frame" src="rep-daily-close.html?v=20260902-2345" title="إغلاق يوم المندوب"></iframe><iframe id="cashFrame" class="frame" src="cash-handover.html?mode=rep&v=20260902-2345" title="تسليم التحصيل"></iframe><script>const WORK='albayanWorkspaceV1',PENDING='albayanPendingInvoicesV1',HAND='albayanCashHandoversV1',PROFILE='albayanRepProfileV1';function load(k,f){try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}}function profile(){const p=load(PROFILE,{id:'rep-1',name:'عباس'});return{id:String(p.id||'rep-1'),name:String(p.name||'عباس')}}function today(){const d=new Date();return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function money(n){return new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:2}).format(Number(n)||0)}function invoiceTotal(v){return(v.lines||[]).reduce((s,l)=>s+Number(l.quantity||0)*Number(l.unit==='carton'?l.cartonPrice:l.unit==='dozen'?l.dozenPrice:l.piecePrice),Number(v.loading)||0)}function belongs(obj,p){const rid=obj?.repId||obj?.invoice?.repId||'';if(rid)return String(rid)===p.id;const rn=obj?.repName||obj?.invoice?.repName||'';if(rn)return String(rn)===p.name;return true}function refresh(){const rp=profile(),w=load(WORK,{accounts:[],invoices:[]}),p=load(PENDING,[]),h=load(HAND,[]);document.getElementById('repLabel').textContent='المندوب: '+rp.name;const posted=(w.invoices||[]).filter(v=>!v.cancelled&&v.date===today()&&String(v.note||'').includes('المندوب')&&belongs(v,rp)),pend=(Array.isArray(p)?p:[]).filter(x=>x.source==='representative'&&x.invoice&&x.invoice.date===today()&&belongs(x,rp)),sales=posted.reduce((s,v)=>s+invoiceTotal(v),0)+pend.reduce((s,x)=>s+invoiceTotal(x.invoice||{}),0),collected=(w.accounts||[]).filter(a=>a.date===today()&&(a.repId||a.receiptId||String(a.note||'').includes('المندوب'))&&belongs(a,rp)).reduce((s,a)=>s+Number(a.owedTo||0),0),todayHand=(Array.isArray(h)?h:[]).filter(x=>x.date===today()&&(x.status==='pending'||x.status==='received')&&belongs(x,rp)),submitted=todayHand.reduce((s,x)=>s+Number(x.amount||0),0),custody=Math.max(0,collected-submitted),pendingHand=todayHand.filter(x=>x.status==='pending').length;document.getElementById('sales').textContent=money(sales)+' د.ع';document.getElementById('collected').textContent=money(collected)+' د.ع';document.getElementById('custody').textContent=money(custody)+' د.ع';document.getElementById('pendingInvoices').textContent=pend.length;document.getElementById('pendingHandovers').textContent=pendingHand;const s=document.getElementById('dayStatus');s.className='day-status';if(custody>0){s.classList.add('warn');s.textContent='⚠ باقي بذمة '+rp.name+' '+money(custody)+' د.ع — افتح «تسليم التحصيل» لإكمال التسليم.'}else if(pendingHand>0){s.classList.add('warn');s.textContent='⏳ تم تسجيل التسليم وبانتظار تأكيد استلام المحاسب.'}else if(collected>0){s.classList.add('ok');s.textContent='✓ تحصيل '+rp.name+' لليوم مسوّى بالكامل مع المحاسب.'}else{s.textContent='لا يوجد تحصيل مسجل اليوم لهذا المندوب حتى الآن.'}}function openFrame(id){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.frame===id));document.querySelectorAll('.frame').forEach(f=>f.classList.toggle('on',f.id===id));refresh()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>openFrame(b.dataset.frame));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openFrame(b.dataset.open));window.addEventListener('storage',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});setInterval(refresh,1500);refresh();</script></body></html>
