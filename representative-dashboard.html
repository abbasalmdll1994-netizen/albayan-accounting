adius:12px;min-height:58px;padding:8px 10px;font:inherit;font-weight:bold}.quick button small{display:block;font-size:10px;font-weight:normal;color:#627387;margin-top:4px}.quick .green{background:#edf8f0;color:#16643c;border-color:#c5e4cc}.quick .orange{background:#fff7e8;color:#8a5a00;border-color:#edd49e}.quick .purple{background:#f5effb;color:#6f2da8;border-color:#ddc9ee}.quick .blue{background:#eef6ff;color:#155a9a;border-color:#c8def3}.quick .sync{background:#eef5fb;color:#123b63;border-color:#bcd0e2}.tabs{display:flex;gap:7px;overflow:auto;padding:8px;background:#fff;border-bottom:1px solid #d9e3ed}.tab{border:1px solid #d9e3ed;background:#fff;color:#123b63;border-radius:9px;min-height:40px;padding:7px 12px;font:inherit;font-weight:bold;white-space:nowrap}.tab.on{background:#123b63;color:#fff;border-color:#123b63}.frame{width:100%;height:calc(100% - 282px);border:0;background:#fff;display:none}.frame.on{display:block}@media(max-width:1050px){.summary{grid-template-columns:repeat(4,1fr)}.quick{grid-template-columns:repeat(4,1fr)}}@media(max-width:760px){.top h1{font-size:17px}.summary{grid-template-columns:repeat(3,1fr)}.sum b{font-size:14px}.quick{grid-template-columns:1fr 1fr}.frame{height:calc(100% - 450px)}}@media(max-width:480px){.summary{grid-template-columns:1fr 1fr}.datebox{display:none}.frame{height:calc(100% - 495px)}}</style></head><body><header class="top"><div class="who"><h1>لوحة المندوب</h1><small id="repLabel">المندوب</small></div><div class="top-side"><div class="datebox"><b id="dayName">اليوم</b><span id="dateLabel"></span></div><a href="start.html?v=20260903-0730">رجوع</a></div></header><div class="summary"><div class="sum"><span>بيع اليوم</span><b id="sales">0 د.ع</b></div><div class="sum collect"><span>تحصيل اليوم</span><b id="collected">0 د.ع</b></div><div class="sum custody"><span>بذمة المندوب</span><b id="custody">0 د.ع</b></div><div class="sum wait"><span>قيد التسليم</span><b id="pendingHandovers">0 د.ع</b></div><div class="sum received"><span>تم استلامه</span><b id="receivedHandovers">0 د.ع</b></div><div class="sum wait"><span>فواتير انتظار</span><b id="pendingInvoices">0</b></div><div class="sum reject"><span>تسليم مرفوض</span><b id="rejectedHandovers">0</b></div><div id="closeCard" class="sum"><span>حالة اليوم</span><b id="closeState">مفتوح</b></div></div><div id="dayStatus" class="day-status">جاري تحديث حالة اليوم...</div><div class="quick"><button data-open-section="daily">🚚 الجولة الحالية<small>زبائن وزيارات اليوم</small></button><button data-open-section="allTour">👥 كل الزبائن<small>فتح الجولة الكلية</small></button><button data-open-section="addCustomer" class="blue">➕ إضافة زبون<small>إضافة وربط تلقائي</small></button><button data-open-section="debts" class="purple">📒 المديونية<small>حسابات الزبائن</small></button><button data-open="closeFrame" class="orange">📊 إغلاق اليوم<small>ملخص حركة المندوب</small></button><button data-open="cashFrame" class="green">💵 تسليم التحصيل<small>تسليم النقد للمحاسب</small></button><button id="fullSyncBtn" class="sync">🔄 Full Sync<small id="syncHint">تجهيز المزامنة الكاملة</small></button></div><nav class="tabs"><button class="tab on" data-frame="repFrame">🚚 نظام المندوب</button><button class="tab" data-frame="closeFrame">📊 إغلاق اليوم</button><button class="tab" data-frame="cashFrame">💵 تسليم التحصيل</button></nav><iframe id="repFrame" class="frame on" src="representative.html?v=20260903-0730" title="نظام المندوب"></iframe><iframe id="closeFrame" class="frame" src="rep-daily-close.html?v=20260903-0730" title="إغلاق يوم المندوب"></iframe><iframe id="cashFrame" class="frame" src="cash-handover.html?mode=rep&v=20260903-0730" title="تسليم التحصيل"></iframe><script src="sync-core.js?v=20260903-0730"></script><script>const WORK='albayanWorkspaceV1',PENDING='albayanPendingInvoicesV1',HAND='albayanCashHandoversV1',VISITS='albayanRepVisitsV2',PROFILE='albayanRepProfileV1',CLOSE='albayanRepDailyCloseV1',SYNC='albayanFullSyncStateV1';function load(k,f){try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}}function profile(){const p=load(PROFILE,{id:'rep-1',name:'عباس'});return{id:String(p.id||'rep-1'),name:String(p.name||'عباس')}}function today(){const d=new Date();return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function money(n){return new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:2}).format(Number(n)||0)}function invoiceTotal(v){return(v.lines||[]).reduce((s,l)=>s+Number(l.quantity||0)*Number(l.unit==='carton'?l.cartonPrice:l.unit==='dozen'?l.dozenPrice:l.piecePrice),Number(v.loading)||0)}function belongs(obj,p){const rid=obj?.repId||obj?.invoice?.repId||'';if(rid)return String(rid)===p.id;const rn=obj?.repName||obj?.invoice?.repName||'';if(rn)return String(rn)===p.name;return true}function isRepSale(v,p){if(!v||v.cancelled)return false;if(v.repId)return belongs(v,p);if(v.source==='representative')return belongs(v,p);return String(v.note||'').includes('المندوب')&&belongs(v,p)}function round(n){return Math.round((Number(n)||0)*100)/100}function sameSnapshot(a,b){if(!a||!b)return false;return['salesTotal','salesCount','collectedTotal','collectionCount','pendingInvoiceCount','handoverCount','visitCount'].every(k=>Number(a[k]||0)===Number(b[k]||0))}function refreshSyncHint(){const hint=document.getElementById('syncHint'),m=window.AlbayanSync?.status?.()||{};hint.textContent=m.status==='waiting-backend'?'جاهز محلياً — ينتظر السيرفر':'تجهيز المزامنة الكاملة'}function refresh(){const rp=profile(),w=load(WORK,{accounts:[],invoices:[]}),p=load(PENDING,[]),h=load(HAND,[]),vis=load(VISITS,[]),now=new Date(),closed=load(CLOSE,{})[today()+'|'+rp.id];document.getElementById('repLabel').textContent='المندوب الحالي: '+rp.name;document.getElementById('dayName').textContent=now.toLocaleDateString('ar-IQ',{weekday:'long'});document.getElementById('dateLabel').textContent=now.toLocaleDateString('ar-IQ',{year:'numeric',month:'long',day:'numeric'});const posted=(w.invoices||[]).filter(v=>v.date===today()&&isRepSale(v,rp)),pend=(Array.isArray(p)?p:[]).filter(x=>(x.source==='representative'||x.invoice?.source==='representative'||x.repId||x.invoice?.repId)&&x.invoice&&x.invoice.date===today()&&belongs(x,rp)),sales=posted.reduce((s,v)=>s+invoiceTotal(v),0)+pend.reduce((s,x)=>s+invoiceTotal(x.invoice||{}),0),collectionRows=(w.accounts||[]).filter(a=>a.date===today()&&(a.repId||a.receiptId||String(a.note||'').includes('المندوب'))&&belongs(a,rp)),collected=collectionRows.reduce((s,a)=>s+Number(a.owedTo||0),0),todayHand=(Array.isArray(h)?h:[]).filter(x=>x.date===today()&&belongs(x,rp)),pendingList=todayHand.filter(x=>x.status==='pending'),receivedList=todayHand.filter(x=>x.status==='received'),pendingAmount=pendingList.reduce((s,x)=>s+Number(x.amount||0),0),receivedAmount=receivedList.reduce((s,x)=>s+Number(x.amount||0),0),submitted=pendingAmount+receivedAmount,custody=Math.max(0,collected-submitted),pendingHand=pendingList.length,rejectedHand=todayHand.filter(x=>x.status==='rejected').length,tv=(Array.isArray(vis)?vis:[]).filter(v=>v.date===today()&&belongs(v,rp)),snap={salesTotal:round(sales),salesCount:posted.length+pend.length,collectedTotal:round(collected),collectionCount:collectionRows.length,pendingInvoiceCount:pend.length,handoverCount:todayHand.length,visitCount:tv.length},legacy=!!closed&&!closed.snapshot,stale=!!closed&&!legacy&&!sameSnapshot(closed.snapshot,snap),validClosed=!!closed&&!legacy&&!stale;const closeCard=document.getElementById('closeCard'),closeState=document.getElementById('closeState');closeCard.className='sum'+(validClosed?' closed':closed?' stale':'');closeState.textContent=validClosed?'مغلق ✓':closed?'يحتاج إعادة إغلاق':'مفتوح';document.getElementById('sales').textContent=money(sales)+' د.ع';document.getElementById('collected').textContent=money(collected)+' د.ع';document.getElementById('custody').textContent=money(custody)+' د.ع';document.getElementById('pendingInvoices').textContent=pend.length;document.getElementById('pendingHandovers').textContent=money(pendingAmount)+' د.ع';document.getElementById('receivedHandovers').textContent=money(receivedAmount)+' د.ع';document.getElementById('rejectedHandovers').textContent=rejectedHand;const s=document.getElementById('dayStatus');s.className='day-status';if(stale){s.classList.add('warn');s.textContent='⚠ توجد حركة جديدة بعد الإغلاق السابق. افتح إغلاق اليوم وحدّث الإغلاق بعد تسوية التحصيل.'}else if(legacy){s.classList.add('warn');s.textContent='⚠ هذا إغلاق قديم ويحتاج تحديث لاعتماد الحركات الحالية.'}else if(validClosed){s.classList.add('ok');s.textContent='✓ اليوم مغلق حسب آخر الحركات. المبيعات والتسديدات تبقى مفتوحة، وأي حركة جديدة ستطلب إعادة الإغلاق.'}else if(rejectedHand>0&&custody>0){s.classList.add('danger');s.textContent='✕ يوجد '+rejectedHand+' سند تسليم مرفوض، والمبلغ رجع لذمة '+rp.name+' بمقدار '+money(custody)+' د.ع.'}else if(custody>0){s.classList.add('warn');s.textContent='⚠ باقي بذمة '+rp.name+' '+money(custody)+' د.ع — يحتاج تسليم للمحاسب.'}else if(pendingHand>0){s.classList.add('warn');s.textContent='⏳ قيد التسليم للمحاسب '+money(pendingAmount)+' د.ع وبانتظار تأكيد الاستلام.'}else if(collected>0){s.classList.add('ok');s.textContent='✓ تحصيل اليوم مسلّم بالكامل للمحاسب. افتح إغلاق اليوم لإنهاء العمل.'}else{s.textContent='اليوم مفتوح — لا يوجد تحصيل مسجل حتى الآن.'}refreshSyncHint()}function installRepSafety(){const f=document.getElementById('repFrame');try{const d=f.contentDocument||f.contentWindow.document;if(!d||d.getElementById('repSafetyScript'))return;const s=d.createElement('script');s.id='repSafetyScript';s.src='rep-safety.js?v=20260903-0730';d.head.appendChild(s)}catch(e){console.error(e)}}function openFrame(id){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.frame===id));document.querySelectorAll('.frame').forEach(f=>f.classList.toggle('on',f.id===id));refresh();if(id==='repFrame')setTimeout(installRepSafety,100)}function openRepSection(section){openFrame('repFrame');const f=document.getElementById('repFrame');const activate=()=>{try{installRepSafety();const d=f.contentDocument||f.contentWindow.document;const b=d.querySelector('[data-section="'+section+'"]');if(b)b.click()}catch(e){console.error(e)}};if(f.contentDocument&&f.contentDocument.readyState==='complete')setTimeout(activate,50);else f.addEventListener('load',()=>setTimeout(activate,100),{once:true})}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>openFrame(b.dataset.frame));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openFrame(b.dataset.open));document.querySelectorAll('[data-open-section]').forEach(b=>b.onclick=()=>openRepSection(b.dataset.openSection));document.getElementById('fullSyncBtn').onclick=()=>{const rp=profile();if(!window.AlbayanSync){alert('تعذر تحميل تجهيز Full Sync. أعد فتح الصفحة وحاول مرة ثانية.');return}const meta=window.AlbayanSync.prepare(),state=load(SYNC,{});state[rp.id]={repId:rp.id,repName:rp.name,requestedAt:new Date().toISOString(),mode:meta.mode,status:meta.status,lastPreparedAt:meta.lastPreparedAt,counts:meta.counts};localStorage.setItem(SYNC,JSON.stringify(state));refreshSyncHint();alert('تم تجهيز بيانات Full Sync محلياً: '+meta.counts.accounts+' حساب، '+meta.counts.items+' صنف، '+meta.counts.invoices+' فاتورة. حالياً المزامنة بين الأجهزة تنتظر ربط قاعدة البيانات المركزية.')};const repFrame=document.getElementById('repFrame');repFrame.addEventListener('load',()=>setTimeout(installRepSafety,100));window.addEventListener('storage',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden){refresh();installRepSafety()}});setInterval(refresh,1500);refresh();</script></body></html>
