<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b63"><title>لوحة المندوب | مكتب القرية</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Tahoma,Arial,sans-serif;background:#f3f6fa;color:#172b40}.top{height:60px;background:#123b63;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 13px;gap:10px}.top h1{font-size:19px;margin:0}.top a{color:#fff;text-decoration:none;border:1px solid #ffffff55;border-radius:9px;padding:8px 11px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:8px;background:#f3f6fa;border-bottom:1px solid #d9e3ed}.sum{background:#fff;border:1px solid #d9e3ed;border-radius:10px;padding:8px 10px}.sum span{display:block;color:#627387;font-size:10px}.sum b{display:block;color:#123b63;font-size:16px;margin-top:3px}.sum.collect b{color:#18864b}.sum.custody b{color:#a15c00}.tabs{display:flex;gap:7px;overflow:auto;padding:8px;background:#fff;border-bottom:1px solid #d9e3ed}.tab{border:1px solid #d9e3ed;background:#fff;color:#123b63;border-radius:9px;min-height:40px;padding:7px 12px;font:inherit;font-weight:bold;white-space:nowrap}.tab.on{background:#123b63;color:#fff;border-color:#123b63}.frame{width:100%;height:calc(100% - 177px);border:0;background:#fff;display:none}.frame.on{display:block}@media(max-width:600px){.top{height:56px}.top h1{font-size:17px}.summary{grid-template-columns:1fr 1fr 1fr}.sum b{font-size:14px}.frame{height:calc(100% - 173px)}}</style></head><body><header class="top"><h1>لوحة المندوب</h1><a href="start.html">رجوع</a></header><div class="summary"><div class="sum"><span>بيع اليوم</span><b id="sales">0 د.ع</b></div><div class="sum collect"><span>تحصيل اليوم</span><b id="collected">0 د.ع</b></div><div class="sum custody"><span>بذمة المندوب</span><b id="custody">0 د.ع</b></div></div><nav class="tabs"><button class="tab on" data-frame="repFrame">🚚 الجولة والمبيعات</button><button class="tab" data-frame="closeFrame">📊 إغلاق اليوم</button><button class="tab" data-frame="cashFrame">💵 تسليم التحصيل</button></nav><iframe id="repFrame" class="frame on" src="representative.html?v=20260902-2145" title="نظام المندوب"></iframe><iframe id="closeFrame" class="frame" src="rep-daily-close.html?v=20260902-2145" title="إغلاق يوم المندوب"></iframe><iframe id="cashFrame" class="frame" src="cash-handover.html?mode=rep&v=20260902-2145" title="تسليم التحصيل"></iframe><script>const WORK='albayanWorkspaceV1',PENDING='albayanPendingInvoicesV1',HAND='albayanCashHandoversV1';function load(k,f){try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}}function today(){const d=new Date();return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function money(n){return new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:2}).format(Number(n)||0)}function invoiceTotal(v){return(v.lines||[]).reduce((s,l)=>s+Number(l.quantity||0)*Number(l.unit==='carton'?l.cartonPrice:l.unit==='dozen'?l.dozenPrice:l.piecePrice),Number(v.loading)||0)}function refresh(){const w=load(WORK,{accounts:[],invoices:[]}),p=load(PENDING,[]),h=load(HAND,[]),posted=(w.invoices||[]).filter(v=>!v.cancelled&&v.date===today()&&String(v.note||'').includes('المندوب')),pend=(Array.isArray(p)?p:[]).filter(x=>x.source==='representative'&&x.invoice&&x.invoice.date===today()),sales=posted.reduce((s,v)=>s+invoiceTotal(v),0)+pend.reduce((s,x)=>s+invoiceTotal(x.invoice||{}),0),collected=(w.accounts||[]).filter(a=>a.date===today()&&(a.repId||a.receiptId||String(a.note||'').includes('المندوب'))).reduce((s,a)=>s+Number(a.owedTo||0),0),submitted=(Array.isArray(h)?h:[]).filter(x=>x.date===today()&&(x.status==='pending'||x.status==='received')).reduce((s,x)=>s+Number(x.amount||0),0);document.getElementById('sales').textContent=money(sales)+' د.ع';document.getElementById('collected').textContent=money(collected)+' د.ع';document.getElementById('custody').textContent=money(Math.max(0,collected-submitted))+' د.ع'}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.frame').forEach(f=>f.classList.toggle('on',f.id===b.dataset.frame));refresh()});window.addEventListener('storage',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});setInterval(refresh,1500);refresh();</script></body></html>
