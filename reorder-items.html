<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b63"><title>المواد المطلوب إعادة شرائها | مكتب القرية</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#17304d;font-family:Tahoma,Arial,sans-serif}.top{background:#123b63;color:#fff;padding:18px;text-align:center}.top h1{margin:0;font-size:24px}.wrap{max-width:900px;margin:auto;padding:20px 14px 35px}.back{display:inline-block;margin-bottom:15px;color:#123b63;text-decoration:none;font-weight:bold}.summary{background:#fff;border:1px solid #d9e3ed;border-radius:14px;padding:15px;margin-bottom:14px;font-weight:bold}.item{background:#fff;border:1px solid #efc6c6;border-right:5px solid #c84444;border-radius:14px;padding:16px;margin-bottom:11px}.head{display:flex;justify-content:space-between;gap:10px}.name{font-size:19px;font-weight:bold;color:#123b63}.code{color:#65788c;font-size:13px}.info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#f7f9fb;border-radius:10px;padding:9px;text-align:center}.stat b{display:block;font-size:18px}.actions{display:flex;gap:8px;margin-top:12px}.order{flex:1;text-align:center;text-decoration:none;background:#147343;color:#fff;padding:10px;border-radius:10px;font-weight:bold}.reject{border:1px solid #d7a7a7;background:#fff;color:#9a3030;border-radius:10px;padding:10px 15px;font:inherit;font-weight:bold}.empty{background:#fff;border:1px dashed #cbd8e5;border-radius:14px;padding:35px;text-align:center;color:#65788c}@media(max-width:560px){.info{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}}</style></head><body><header class="top"><h1>المواد المطلوب إعادة شرائها</h1></header><main class="wrap"><a class="back" href="purchases.html">‹ رجوع إلى المشتريات</a><div id="summary" class="summary"></div><div id="list"></div></main><script src="stock-orders.js"></script><script>const KEY='albayanWorkspaceV1';let data={items:[],purchaseOrders:[]};try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');if(x&&Array.isArray(x.items)){data=x;if(!Array.isArray(data.purchaseOrders))data.purchaseOrders=[]}}catch{}const rejected=new Set(JSON.parse(localStorage.getItem('albayanReorderRejectedV1')||'[]'));function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let lows=[];try{lows=window.StockOrders?StockOrders.lowStock(data):[]}catch{}lows=lows.filter(x=>!rejected.has(x.item.id));document.getElementById('summary').textContent='عدد المواد المطلوب إعادة شرائها: '+lows.length;const out=document.getElementById('list');if(!lows.length){out.innerHTML='<div class="empty">لا توجد مواد تحتاج إلى إعادة شراء حالياً</div>';return}out.innerHTML=lows.map(x=>{const cartons=x.item.packSize?Math.floor((Number(x.item.quantity)||0)/x.item.packSize):0;return '<article class="item"><div class="head"><div><div class="name">'+esc(x.item.name)+'</div><div class="code">الرقم المخزني: '+esc(x.item.code||'—')+'</div></div></div><div class="info"><div class="stat"><span>الرصيد الحالي</span><b>'+cartons+' كارتون</b></div><div class="stat"><span>حد التنبيه</span><b>'+x.minCartons+' كارتون</b></div><div class="stat"><span>المقترح</span><b>'+x.suggestedCartons+' كارتون</b></div></div><div class="actions"><a class="order" href="purchase-order.html?item='+encodeURIComponent(x.item.id)+'&qty='+x.suggestedCartons+'">إضافة إلى طلبية الشراء</a><button class="reject" data-reject="'+esc(x.item.id)+'">رفض</button></div></article>'}).join('');out.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>{rejected.add(b.dataset.reject);localStorage.setItem('albayanReorderRejectedV1',JSON.stringify([...rejected]));render()})}render();</script></body></html>
