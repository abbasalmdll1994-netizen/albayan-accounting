<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b63"><title>بيع المندوب</title><style>html,body{margin:0;height:100%;font-family:Tahoma,Arial,sans-serif;background:#f3f6fa}.bar{height:52px;background:#123b63;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:10px}.bar a{color:#fff;text-decoration:none;background:#ffffff1f;border:1px solid #ffffff38;border-radius:8px;padding:7px 11px}.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}iframe{width:100%;height:calc(100% - 52px);border:0;background:#fff}</style></head><body><div class="bar"><span id="name">فاتورة بيع للمندوب</span><a href="representative.html">رجوع للمندوب</a></div><iframe id="salesFrame" src="index.html" title="نظام المبيعات"></iframe><script>const customer=JSON.parse(localStorage.getItem('albayanRepActiveCustomer')||'null');const tierMap={'جملة الجملة':'bulk','جملة':'wholesale','ماركت':'market','مفرد':'retail'};if(customer)document.getElementById('name').textContent='فاتورة بيع · '+customer.name;document.getElementById('salesFrame').addEventListener('load',()=>{try{const w=document.getElementById('salesFrame').contentWindow,d=w.document;setTimeout(()=>{const salesBtn=d.querySelector('[data-page="sales"]');if(salesBtn)salesBtn.click();const c=d.getElementById('saleCustomer');if(c&&customer)c.value=customer.name||'';const t=d.getElementById('saleTier');if(t&&customer){t.value=tierMap[customer.type]||'retail';t.dispatchEvent(new Event('change',{bubbles:true}))}const a=d.getElementById('saleAddress');if(a&&customer&&!a.value)a.value=customer.area||'';const n=d.getElementById('saleNote');if(n&&customer&&!n.value)n.value='بيع عن طريق المندوب';},250)}catch(e){console.error(e)}});</script></body></html>
