<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b63"><title>بيع المندوب</title><style>html,body{margin:0;height:100%;font-family:Tahoma,Arial,sans-serif;background:#f3f6fa}.bar{height:58px;background:#123b63;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:10px}.bar a{color:#fff;text-decoration:none;background:#ffffff1f;border:1px solid #ffffff38;border-radius:8px;padding:7px 11px}.info{min-width:0}.info b,.info small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.info small{color:#d8e6f2;margin-top:2px}iframe{width:100%;height:calc(100% - 58px);border:0;background:#fff}.blocked{position:fixed;inset:58px 0 0;background:#f3f6fa;z-index:5;display:none;align-items:center;justify-content:center;padding:20px}.blocked.show{display:flex}.blocked div{max-width:520px;background:#fff;border:1px solid #e0c7c7;border-right:5px solid #b83232;border-radius:15px;padding:24px;text-align:center}.blocked h2{color:#b83232;margin-top:0}.blocked a{display:inline-block;margin-top:10px;text-decoration:none;background:#123b63;color:#fff;padding:11px 18px;border-radius:10px}</style></head><body><div class="bar"><div class="info"><b id="name">فاتورة بيع للمندوب</b><small id="approvalState">يتم فحص استحقاق الزبون عند حفظ الفاتورة</small></div><a href="representative.html?v=release-20260903-1">رجوع للمندوب</a></div><iframe id="salesFrame" src="index.html?v=release-20260903-1" title="نظام المبيعات"></iframe><div id="blocked" class="blocked"><div><h2>اختر الزبون أولاً</h2><p id="blockedText">لم يتم تحديد زبون من جولة المندوب.</p><a href="representative.html?v=release-20260903-1">الرجوع إلى لوحة المندوب</a></div></div><script>const WORK='albayanWorkspaceV1',PENDING='albayanPendingInvoicesV1',GRACE='albayanDebtGraceDays',PROFILE='albayanRepProfileV1',CLOSE='albayanRepDailyCloseV1',LATE='albayanRepLateActivityV1',SYNC_META='albayanSyncMetaV1';const customer=JSON.parse(localStorage.getItem('albayanRepActiveCustomer')||'null');const tierMap={'جملة الجملة':'bulk','جملة':'wholesale','ماركت':'market','مفرد':'retail'};const frame=document.getElementById('salesFrame'),stateMsg=document.getElementById('approvalState');function load(k,f){try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}}function today(){const d=new Date();return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function repProfile(){const p=load(PROFILE,{id:'rep-1',name:'عباس'});return{id:p.id||'rep-1',name:p.name||'عباس'}}function markSyncDirty(){const m=load(SYNC_META,{});if(m&&typeof m==='object'&&m.status==='waiting-backend'){m.status='local-changes';m.mode='local-ready';m.lastLocalChangeAt=new Date().toISOString();localStorage.setItem(SYNC_META,JSON.stringify(m))}}function reopenIfClosed(){const p=repProfile(),key=today()+'|'+String(p.id),all=load(CLOSE,{});if(all[key]){delete all[key];localStorage.setItem(CLOSE,JSON.stringify(all));localStorage.setItem(LATE,JSON.stringify({type:'sale',at:new Date().toISOString(),repId:p.id}))}markSyncDirty()}if(customer)document.getElementById('name').textContent='فاتورة بيع · '+customer.name;else{document.getElementById('blocked').classList.add('show');document.getElementById('blockedText').textContent='لم يتم تحديد زبون من جولة المندوب. ارجع للجولة واختر الزبون أولاً.'}function invoiceTotal(v){let t=Number(v.loading)||0;for(const l of v.lines||[]){const p=l.unit==='carton'?l.cartonPrice:l.unit==='dozen'?l.dozenPrice:l.piecePrice;t+=Number(l.quantity||0)*Number(p||0)}return Math.round(t*100)/100}function daysBetween(s){if(!s)return 0;return Math.max(0,Math.floor((new Date(today()+'T00:00:00')-new Date(s+'T00:00:00'))/86400000))}function debtInfo(name,w){const rows=[...(w.accounts||[]).filter(a=>a.customer===name)];for(const v of(w.invoices||[]).filter(v=>!v.cancelled&&v.customer===name)){const debt=Math.round((invoiceTotal(v)-Number(v.paid||0))*100)/100;if(debt>0)rows.push({date:v.date,owedBy:debt,owedTo:0})}rows.sort((a,b)=>String(a.date).localeCompare(String(b.date)));const tr=[];let credit=0;for(const r of rows){if(Number(r.owedBy)>0)tr.push({date:r.date,amount:Number(r.owedBy)});if(Number(r.owedTo)>0)credit+=Number(r.owedTo)}for(const t of tr){if(credit<=0)break;const u=Math.min(credit,t.amount);t.amount-=u;credit-=u}const open=tr.filter(t=>t.amount>.009),amount=open.reduce((s,t)=>s+t.amount,0),days=open.length?daysBetween(open[0].date):0,grace=Math.max(0,Number(localStorage.getItem(GRACE))||7);return{amount:Math.round(amount*100)/100,days,overdue:amount>0&&days>grace,grace}}function stockQty(l){return Number(l.quantity||0)*(l.unit==='carton'?Number(l.packSize||1):l.unit==='dozen'?12:1)}function tagInvoice(v){const p=repProfile(),stamp=new Date().toISOString();v.repId=p.id;v.repName=p.name;v.source='representative';v.customerId=v.customerId||customer?.id||null;v.updatedAt=stamp;v.createdAt=v.createdAt||stamp;v.syncState='local';if(!String(v.note||'').includes('المندوب'))v.note=(String(v.note||'').trim()?String(v.note).trim()+' · ':'')+'بيع عن طريق المندوب';return v}let before=load(WORK,{accounts:[],items:[],invoices:[]}),known=new Set((before.invoices||[]).map(v=>v.id)),debt=customer?debtInfo(customer.name,before):{amount:0,days:0,overdue:false,grace:7},processing=false;if(customer){if(debt.overdue)stateMsg.textContent='الزبون مستحق · '+debt.days+' يوم · الفاتورة ستنتظر موافقة الإدارة';else stateMsg.textContent='الزبون غير مستحق حالياً · الفاتورة تترحل مباشرة'}function interceptWorkspace(next){if(processing||!customer)return;const added=(next.invoices||[]).filter(v=>v.customer===customer.name&&!known.has(v.id));if(!added.length)return;reopenIfClosed();processing=true;if(!debt.overdue){for(const v of added){tagInvoice(v);known.add(v.id)}localStorage.setItem(WORK,JSON.stringify(next));stateMsg.textContent='تم ترحيل الفاتورة مباشرة باسم '+repProfile().name;setTimeout(()=>processing=false,100);return}const clean=JSON.parse(JSON.stringify(next)),pend=load(PENDING,[]),p=repProfile();for(const raw of added){const v=tagInvoice(raw);clean.invoices=clean.invoices.filter(x=>x.id!==v.id);for(const l of v.lines||[]){const item=(clean.items||[]).find(i=>i.id===l.itemId);if(item)item.quantity=Number(item.quantity||0)+stockQty(l)}const stamp=new Date().toISOString();pend.push({pendingId:'pending-'+Date.now()+'-'+Math.random().toString(36).slice(2),createdAt:stamp,updatedAt:stamp,syncState:'local',source:'representative',repId:p.id,repName:p.name,customerId:customer.id,customerName:customer.name,previousDebt:debt.amount,debtDays:debt.days,graceDays:debt.grace,invoice:{...v,pendingApproval:true,repId:p.id,repName:p.name,source:'representative',updatedAt:stamp,syncState:'local'}});known.add(v.id)}localStorage.setItem(PENDING,JSON.stringify(pend));localStorage.setItem(WORK,JSON.stringify(clean));stateMsg.textContent='تم نقل الفاتورة إلى قائمة انتظار الإدارة باسم '+p.name;setTimeout(()=>{alert('الزبون مستحق للتسديد. تم حفظ الفاتورة في قائمة الانتظار ولن تُرحّل إلا بعد موافقة الإدارة.');frame.src='index.html?v=release-20260903-1';processing=false},150)}window.addEventListener('storage',e=>{if(e.key===WORK&&e.newValue){try{interceptWorkspace(JSON.parse(e.newValue))}catch(err){console.error(err)}}});frame.addEventListener('load',()=>{if(!customer)return;try{const w=frame.contentWindow,d=w.document;setTimeout(()=>{const salesBtn=d.querySelector('[data-page="sales"]');if(salesBtn)salesBtn.click();const c=d.getElementById('saleCustomer');if(c&&customer)c.value=customer.name||'';const t=d.getElementById('saleTier');if(t&&customer){t.value=tierMap[customer.type]||'retail';t.dispatchEvent(new Event('change',{bubbles:true}))}const a=d.getElementById('saleAddress');if(a&&customer&&!a.value)a.value=customer.area||'';const n=d.getElementById('saleNote');if(n&&customer&&!n.value)n.value='بيع عن طريق المندوب';const due=d.getElementById('saleDue');if(due&&customer&&!due.value){const x=new Date();x.setDate(x.getDate()+debt.grace);due.value=[x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('-')}},250)}catch(e){console.error(e)}});</script><script src="cloud-sync.js?v=release-20260903-1"></script></body></html>
