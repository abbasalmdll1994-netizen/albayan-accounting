const WORK='albayanWorkspaceV1',PENDING='albayanPendingInvoicesV1',GRACE='albayanDebtGraceDays',PROFILE='albayanRepProfileV1',CLOSE='albayanRepDailyCloseV1',LATE='albayanRepLateActivityV1',SYNC_META='albayanSyncMetaV1';
function load(k,f){try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}}
const customer=load('albayanRepActiveCustomer',null),tierMap={'جملة الجملة':'bulk','جملة':'wholesale','ماركت':'market','مفرد':'retail'},frame=document.getElementById('salesFrame'),stateMsg=document.getElementById('approvalState');
function today(){const d=new Date();return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}

function markSyncDirty(){const m=load(SYNC_META,{});if(m&&typeof m==='object'){m.status='local-changes';m.mode='local-ready';m.lastLocalChangeAt=new Date().toISOString();localStorage.setItem(SYNC_META,JSON.stringify(m))}}
function reopenIfClosed(){const p=repProfile(),key=today()+'|'+String(p.id),all=load(CLOSE,{});if(all[key]){delete all[key];localStorage.setItem(CLOSE,JSON.stringify(all));localStorage.setItem(LATE,JSON.stringify({type:'sale',at:new Date().toISOString(),repId:p.id}))}markSyncDirty()}

function invoiceTotal(v){let t=Number(v.loading)||0;for(const l of v.lines||[]){const p=l.unit==='carton'?l.cartonPrice:l.unit==='dozen'?l.dozenPrice:l.piecePrice;t+=Number(l.quantity||0)*Number(p||0)}return Math.round(t*100)/100}
function daysBetween(s){if(!s)return 0;return Math.max(0,Math.floor((new Date(today()+'T00:00:00')-new Date(s+'T00:00:00'))/86400000))}
function debtInfo(name,w){const rows=[...(w.accounts||[]).filter(a=>a.customer===name)];for(const v of(w.invoices||[]).filter(v=>!v.cancelled&&v.customer===name)){const debt=Math.round((invoiceTotal(v)-Number(v.paid||0))*100)/100;if(debt>0)rows.push({date:v.date,owedBy:debt,owedTo:0})}rows.sort((a,b)=>String(a.date).localeCompare(String(b.date)));const tr=[];let credit=0;for(const r of rows){if(Number(r.owedBy)>0)tr.push({date:r.date,amount:Number(r.owedBy)});if(Number(r.owedTo)>0)credit+=Number(r.owedTo)}for(const t of tr){if(credit<=0)break;const u=Math.min(credit,t.amount);t.amount-=u;credit-=u}const open=tr.filter(t=>t.amount>.009),amount=open.reduce((s,t)=>s+t.amount,0),days=open.length?daysBetween(open[0].date):0,grace=Math.max(0,Number(localStorage.getItem(GRACE))||7);return{amount:Math.round(amount*100)/100,days,overdue:amount>0&&days>grace,grace}}

function checkWorkspace(){try{interceptWorkspace(load(WORK,{accounts:[],items:[],invoices:[]}))}catch(e){console.error(e)}}window.addEventListener('storage',e=>{if(e.key===WORK)checkWorkspace()});setInterval(checkWorkspace,700);
function compactSales(d){try{d.documentElement.classList.add('rep-sales-doc');d.body.classList.add('representative-sales-only');let style=d.getElementById('repCompactStyle');if(!style){style=d.createElement('style');style.id='repCompactStyle';style.textContent=`html.rep-sales-doc,html.rep-sales-doc body{background:#f3f6fa!important}body.representative-sales-only>header,body.representative-sales-only>.system-links,body.representative-sales-only>nav,body.representative-sales-only>main>section:not(#sales),body.representative-sales-only>#invoiceView{display:none!important}body.representative-sales-only>main{display:block!important;max-width:1100px!important;margin:0 auto!important;padding:8px 8px 30px!important}body.representative-sales-only #sales{display:block!important}body.representative-sales-only #sales>h2{display:none!important}body.representative-sales-only #sales .panel{padding:10px!important;margin:0!important;border-radius:12px!important}body.representative-sales-only #saleTitle{font-size:18px!important;margin:0 0 8px!important}body.representative-sales-only #saleForm>.grid{grid-template-columns:2fr 1fr 1fr!important;gap:7px!important}body.representative-sales-only #saleForm>.grid label{font-size:12px!important;gap:2px!important}body.representative-sales-only #saleCustomer,body.representative-sales-only #saleTier,body.representative-sales-only #saleDate{min-height:38px!important;padding:5px 8px!important}body.representative-sales-only label:has(#salePhone),body.representative-sales-only label:has(#saleAddress),body.representative-sales-only label:has(#saleDue),body.representative-sales-only label:has(#saleNote),body.representative-sales-only .remember-tier,body.representative-sales-only #tierHint,body.representative-sales-only #saleForm>p.muted,body.representative-sales-only #sales>.panel:nth-of-type(2){display:none!important}body.representative-sales-only #saleLines{display:table!important;width:100%!important;border-collapse:collapse!important;table-layout: function prepareInvoice(){if(!customer)return;try{const w=frame.contentWindow,d=w.document;compactSales(d);const c=d.getElementById('saleCustomer');if(c){c.value=customer.name||'';c.readOnly=true;c.dispatchEvent(new Event('input',{bubbles:true}));c.dispatchEvent(new Event('change',{bubbles:true}))}const t=d.getElementById('saleTier');if(t){t.value=tierMap[customer.type]||'retail';t.dispatchEvent(new Event('change',{bubbles:true}))}const a=d.getElementById('saleAddress');if(a)a.value=customer.area||'';const phone=d.getElementById('salePhone');if(phone)phone.value=customer.phone||'';const n=d.getElementById('saleNote');if(n&&!n.value)n.value='بيع عن طريق المندوب';const due=d.getElementById('saleDue');if(due&&!due.value){const x=new Date();x.setDate(x.getDate()+debt.grace);due.value=[x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('-')}stateMsg.textContent=debt.overdue?'الزبون مستحق · الفاتورة تحتاج موافقة الإدارة':'جاهزة للبيع · '+customer.name}catch(e){console.error(e);stateMsg.textContent='تعذر تجهيز الفاتورة، أعد فتحها'}}
