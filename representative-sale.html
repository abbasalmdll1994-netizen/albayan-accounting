<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b63"><title>بيع المندوب</title><style>html,body{margin:0;height:100%;font-family:Tahoma,Arial,sans-serif;background:#f3f6fa}.bar{height:58px;background:#123b63;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:10px}.bar a{color:#fff;text-decoration:none;background:#ffffff1f;border:1px solid #ffffff38;border-radius:8px;padding:7px 11px}.info{min-width:0}.info b,.info small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.info small{color:#d8e6f2;margin-top:2px}iframe{width:100%;height:calc(100% - 58px);border:0;background:#fff}</style></head><body><div class="bar"><div class="info"><b id="name">فاتورة بيع للمندوب</b><small id="approvalState">يتم فحص استحقاق الزبون عند حفظ الفاتورة</small></div><a href="representative.html">رجوع للمندوب</a></div><iframe id="salesFrame" src="index.html" title="نظام المبيعات"></iframe><script>const WORK='albayanWorkspaceV1',PENDING='albayanPendingInvoicesV1',GRACE='albayanDebtGraceDays';const customer=JSON.parse(localStorage.getItem('albayanRepActiveCustomer')||'null');const tierMap={'جملة الجملة':'bulk','جملة':'wholesale','ماركت':'market','مفرد':'retail'};const frame=document.getElementById('salesFrame'),stateMsg=document.getElementById('approvalState');if(customer)document.getElementById('name').textContent='فاتورة بيع · '+customer.name;function load(k,f){try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}}function invoiceTotal(v){let t=Number(v.loading)||0;for(const l of v.lines||[]){const p=l.unit==='carton'?l.cartonPrice:l.unit==='dozen'?l.dozenPrice:l.piecePrice;t+=Number(l.quantity||0)*Number(p||0)}return Math.round(t*100)/100}function today(){const d=new Date();return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function daysBetween(s){if(!s)return 0;return Math.max(0,Math.floor((new Date(today()+'T00:00:00')-new Date(s+'T00:00:00'))/86400000))}function debtInfo(name,w){const rows=[...(w.accounts||[]).filter(a=>a.customer===name)];for(const v of (w.invoices||[]).filter(v=>!v.cancelled&&v.customer===name)){const debt=Math.round((invoiceTotal(v)-Number(v.paid||0))*100)/100;if(debt>0)rows.push({date:v.date,owedBy:debt,owedTo:0})}rows.sort((a,b)=>String(a.date).localeCompare(String(b.date)));const tr=[];let credit=0;for(const r of rows){if(Number(r.owedBy)>0)tr.push({date:r.date,amount:Number(r.owedBy)});if(Number(r.owedTo)>0)credit+=Number(r.owedTo)}for(const t of tr){if(credit<=0)break;const u=Math.min(credit,t.amount);t.amount-=u;credit-=u}const open=tr.filter(t=>t.amount>.009),amount=open.reduce((s,t)=>s+t.amount,0),days=open.length?daysBetween(open[0].date):0,grace=Math.max(0,Number(localStorage.getItem(GRACE))||7);return{amount:Math.round(amount*100)/100,days,overdue:amount>0&&days>grace,grace}}function stockQty(l){return Number(l.quantity||0)*(l.unit==='carton'?Number(l.packSize||1):l.unit==='dozen'?12:1)}let before=load(WORK,{accounts:[],items:[],invoices:[]}),known=new Set((before.invoices||[]).map(v=>v.id)),debt=customer?debtInfo(customer.name,before):{amount:0,days:0,overdue:false,grace:7},processing=false;if(customer&&debt.overdue)stateMsg.textContent='الزبون مستحق · '+debt.days+' يوم · الفاتورة ستنتظر موافقة الإدارة';else stateMsg.textContent='الزبون غير مستحق حالياً · الفاتورة تترحل مباشرة';function interceptWorkspace(next){if(processing||!customer)return;const added=(next.invoices||[]).filter(v=>v.customer===customer.name&&!known.has(v.id));if(!added.length)return;if(!debt.overdue){added.forEach(v=>known.add(v.id));stateMsg.textContent='تم ترحيل الفاتورة مباشرة';return}processing=true;const clean=JSON.parse(JSON.stringify(next)),pend=load(PENDING,[]);for(const v of added){clean.invoices=clean.invoices.filter(x=>x.id!==v.id);for(const l of v.lines||[]){const item=(clean.items||[]).find(i=>i.id===l.itemId);if(item)item.quantity=Number(item.quantity||0)+stockQty(l)}pend.push({pendingId:'pending-'+Date.now()+'-'+Math.random().toString(36).slice(2),createdAt:new Date().toISOString(),source:'representative',customerId:customer.id,customerName:customer.name,previousDebt:debt.amount,debtDays:debt.days,graceDays:debt.grace,invoice:{...v,pendingApproval:true}});known.add(v.id)}localStorage.setItem(PENDING,JSON.stringify(pend));localStorage.setItem(WORK,JSON.stringify(clean));stateMsg.textContent='تم نقل الفاتورة إلى قائمة انتظار الإدارة';setTimeout(()=>{alert('الزبون مستحق للتسديد. تم حفظ الفاتورة في قائمة الانتظار ولن تُرحّل إلا بعد موافقة الإدارة.');frame.src='index.html';processing=false},150)}window.addEventListener('storage',e=>{if(e.key===WORK&&e.newValue){try{interceptWorkspace(JSON.parse(e.newValue))}catch(err){console.error(err)}}});frame.addEventListener('load',()=>{try{const w=frame.contentWindow,d=w.document;setTimeout(()=>{const salesBtn=d.querySelector('[data-page="sales"]');if(salesBtn)salesBtn.click();const c=d.getElementById('saleCustomer');if(c&&customer)c.value=customer.name||'';const t=d.getElementById('saleTier');if(t&&customer){t.value=tierMap[customer.type]||'retail';t.dispatchEvent(new Event('change',{bubbles:true}))}const a=d.getElementById('saleAddress');if(a&&customer&&!a.value)a.value=customer.area||'';const n=d.getElementById('saleNote');if(n&&customer&&!n.value)n.value='بيع عن طريق المندوب';const due=d.getElementById('saleDue');if(due&&customer&&!due.value){const x=new Date();x.setDate(x.getDate()+debt.grace);due.value=[x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('-')}},250)}catch(e){console.error(e)}});</script></body></html>
