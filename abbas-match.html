<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مطابقة كشف الحساب</title><style>body{font-family:system-ui;background:#f4f7fb;color:#17283e;max-width:640px;margin:3rem auto;padding:1rem}main{background:white;border-radius:18px;padding:24px;box-shadow:0 3px 20px #0001}button{font:inherit;background:#1264a3;color:white;padding:14px;border:0;border-radius:10px;width:100%;margin-top:12px}p{line-height:1.8}</style><main><h1>مطابقة كشف الحساب</h1><p id="status">جارِ فحص بيانات البرنامج على هذا الجهاز…</p><button id="apply" hidden>طبّق المطابقة</button><p><a href="./">العودة إلى برنامج البيان</a></p></main><script>const status=document.getElementById('status'),button=document.getElementById('apply'),key='albayanWorkspaceV1';let current,patch;function message(s){status.textContent=s}async function decodePatch(){const h=location.hash.slice(1);if(!h.startsWith('z'))throw Error('الرابط ناقص. افتحه كاملاً من الرسالة.');const b=h.slice(1).replace(/-/g,'+').replace(/_/g,'/');const bytes=Uint8Array.from(atob(b.padEnd(Math.ceil(b.length/4)*4,'=')),x=>x.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));const decoded=await new Response(stream).text();try{return JSON.parse(decoded)}catch(e){throw Error('فشل قراءة بيانات الرابط: '+e.message)}}async function run(){try{patch=await decodePatch();try{current=JSON.parse(localStorage.getItem(key)||'null')}catch(e){throw Error('فشل قراءة بيانات البرنامج: '+e.message)}if(!current||!Array.isArray(current.accounts))throw Error('ما لكيت بيانات البيان على هذا المتصفح. افتح الرابط من نفس موبايلك ونفس المتصفح المستخدم للبرنامج.');const rows=current.accounts,cor=rows.filter(x=>x.id===patch.correction),pay=rows.filter(x=>x.id===patch.payment),existing=rows.filter(x=>patch.rows.some(y=>y.id===x.id));if(existing.length===patch.rows.length){message('المطابقة موجودة مسبقاً. ما تغيّر أي شيء.');}else if(cor.length!==1||pay.length!==1||existing.length||cor[0].customer!==patch.customer||Number(cor[0].owedBy)!==patch.before||Number(pay[0].owedTo)!==patch.paid||pay[0].customer!==patch.customer||JSON.stringify(pay[0].allocations?.map(x=>x.documentId))!==JSON.stringify([patch.correction]))throw Error('البيانات الحالية تختلف عن النسخة التي طابقناها. ما غيّرت أي شيء؛ أرسل نسخة احتياطية حديثة.');else{message('لكيت رصيد عباس قبل التسديد '+patch.before.toLocaleString('ar-IQ')+' د.ع، وتسديد '+patch.paid.toLocaleString('ar-IQ')+' د.ع. راح أحوّل الرصيد إلى حركات الكشف بدون تغيير حسابات الزبائن الآخرين. اضغط الزر لتطبيق المطابقة.');button.hidden=false;button.onclick=()=>{try{const latest=localStorage.getItem(key);if(latest!==JSON.stringify(current))throw Error('تغيّرت البيانات بعد الفحص. حدّث الصفحة وحاول مرة ثانية.');const next=structuredClone(current),list=next.accounts,entry=list.find(x=>x.id===patch.payment);entry.allocations=patch.allocations;next.accounts=list.filter(x=>x.id!==patch.correction).concat(patch.rows);const balance=next.accounts.filter(x=>x.customer===patch.customer).reduce((n,x)=>n+Number(x.owedBy||0)-Number(x.owedTo||0),0);if(balance!==patch.balance)throw Error('الرصيد الناتج غير مطابق.');localStorage.setItem('albayanAbbasBeforeMatchV1',latest);localStorage.setItem(key,JSON.stringify(next));button.hidden=true;message('تمت المطابقة. الرصيد: '+balance.toLocaleString('ar-IQ')+' دينار عليه. افتح برنامج البيان من الرابط أدناه.');}catch(e){message(e.message)}}}}catch(e){message(e.message)}}run()</script></html>
