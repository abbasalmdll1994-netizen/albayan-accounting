<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b63"><title>تسليم التحصيل | مكتب القرية</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172b40;font-family:Tahoma,Arial,sans-serif}.top{background:#123b63;color:#fff;padding:18px}.wrap{max-width:760px;margin:auto}.top .wrap{display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:21px}.top a{color:#fff;text-decoration:none;border:1px solid #ffffff55;border-radius:9px;padding:8px 12px}.page{padding:14px}.panel,.card{background:#fff;border:1px solid #d9e3ed;border-radius:14px}.panel{padding:15px;margin-bottom:13px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px}.card{padding:13px}.card strong{display:block;font-size:21px;margin-top:6px}.muted{color:#627387;font-size:12px}.btn{width:100%;border:0;border-radius:11px;min-height:50px;padding:10px 14px;font:inherit;font-weight:bold;background:#123b63;color:#fff}.row{border-bottom:1px solid #e1e8ef;padding:13px 0}.row:last-child{border:0}.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:11px;background:#fff3d6;color:#8a5a00}.badge.ok{background:#e7f5ed;color:#18864b}.actions{display:flex;gap:8px;margin-top:9px}.actions .btn{min-height:42px}.empty{text-align:center;color:#627387;padding:22px}.notice{background:#eef5fb;border-right:4px solid #1769aa;padding:11px;border-radius:9px;margin-bottom:12px}@media(max-width:600px){.cards{grid-template-columns:1fr}.page{padding:10px}}</style></head><body><header class="top"><div class="wrap"><h1>تسليم التحصيل للمحاسب</h1><a href="start.html">رجوع</a></div></header><main class="page wrap"><div class="cards"><div class="card"><span class="muted">تحصيل اليوم</span><strong id="collected">0 د.ع</strong></div><div class="card"><span class="muted">تم تسليمه</span><strong id="submitted">0 د.ع</strong></div><div class="card"><span class="muted">بذمة المندوب</span><strong id="remaining">0 د.ع</strong></div></div><section class="panel"><h2>المندوب</h2><div class="notice">المبلغ المقترح للتسليم هو المبلغ المتبقي بذمة المندوب من تحصيل اليوم.</div><button id="handover" class="btn">💵 تسليم المبلغ للمحاسب</button></section><section class="panel"><h2>المحاسب / الإدارة</h2><p class="muted">طلبات التسليم تبقى بانتظار التأكيد إلى أن يستلم المحاسب النقد فعلياً.</p><div id="list"></div></section></main><script>const WORK='albayanWorkspaceV1',KEY='albayanCashHandoversV1',PROFILE='albayanRepProfileV1';const $=id=>document.getElementById(id);function load(k,f){try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function today(){const d=new Date();return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function money(n){return new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:2}).format(Number(n)||0)}function collected(){const w=load(WORK,{accounts:[]});return(w.accounts||[]).filter(a=>a.date===today()&&(a.repId||a.receiptId||String(a.note||'').includes('المندوب'))).reduce((s,a)=>s+Number(a.owedTo||0),0)}function rows(){const a=load(KEY,[]);return Array.isArray(a)?a:[]}function todayRows(){return rows().filter(r=>r.date===today())}function submitted(){return todayRows().filter(r=>r.status==='pending'||r.status==='received').reduce((s,r)=>s+Number(r.amount||0),0)}function render(){const c=collected(),s=submitted(),rem=Math.max(0,c-s);$('collected').textContent=money(c)+' د.ع';$('submitted').textContent=money(s)+' د.ع';$('remaining').textContent=money(rem)+' د.ع';$('handover').disabled=rem<=0;$('handover').textContent=rem>0?'💵 تسليم '+money(rem)+' د.ع للمحاسب':'✓ لا يوجد مبلغ متبقي للتسليم';const a=rows().slice().reverse();$('list').innerHTML=a.length?a.map(r=>'<div class="row"><b>سند تسليم '+r.number+'</b><div>'+money(r.amount)+' د.ع · '+r.repName+'</div><div class="muted">'+r.date+' · '+new Date(r.createdAt).toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'})+'</div><span class="badge '+(r.status==='received'?'ok':'')+'">'+(r.status==='received'?'تم استلام المحاسب':'بانتظار استلام المحاسب')+'</span>'+(r.status==='pending'?'<div class="actions"><button class="btn" data-receive="'+r.id+'">✓ تأكيد استلام المحاسب</button></div>':'')+'</div>').join(''):'<div class="empty">لا توجد عمليات تسليم بعد.</div>';document.querySelectorAll('[data-receive]').forEach(b=>b.onclick=()=>receive(b.dataset.receive))}function nextNo(a){const n=a.reduce((m,r)=>Math.max(m,Number(r.sequence)||0),0)+1;return{sequence:n,number:String(n).padStart(4,'0')}}function handover(){const c=collected(),s=submitted(),amount=Math.max(0,c-s);if(!(amount>0))return alert('لا يوجد مبلغ متبقي للتسليم');if(!confirm('تأكيد تسليم '+money(amount)+' د.ع للمحاسب؟'))return;const a=rows(),n=nextNo(a),p=load(PROFILE,{id:'rep-1',name:'عباس'});a.push({id:'handover-'+Date.now(),sequence:n.sequence,number:n.number,date:today(),amount,repId:p.id||'rep-1',repName:p.name||'عباس',status:'pending',createdAt:new Date().toISOString()});save(KEY,a);render();alert('تم تسجيل سند التسليم رقم '+n.number+' وبانتظار استلام المحاسب.')}function receive(id){const a=rows(),r=a.find(x=>x.id===id);if(!r)return;if(!confirm('تأكيد استلام مبلغ '+money(r.amount)+' د.ع من '+r.repName+'؟'))return;r.status='received';r.receivedAt=new Date().toISOString();r.receivedBy='المحاسب';save(KEY,a);render();alert('تم تأكيد استلام المبلغ.')}$('handover').onclick=handover;window.addEventListener('storage',render);render();</script></body></html>
