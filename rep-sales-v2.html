<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b63"><title>مبيعات المندوب | البيان</title><style>:root{--n:#123b63;--l:#d9e3ed;--m:#66788a;--g:#17834a;--r:#b83232;--bg:#f4f7fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172b40;font-family:Tahoma,Arial,sans-serif}button,input{font:inherit}.wrap{max-width:760px;margin:auto;padding:10px}.customer{background:#fff;border:1px solid var(--l);border-radius:14px;padding:12px;margin-bottom:9px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.customer b{display:block;font-size:20px}.balance{color:var(--n);font-weight:bold;margin-top:5px}.exit{border:1px solid var(--l);background:#fff;color:var(--n);border-radius:10px;padding:9px 12px;font-weight:bold}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;position:sticky;top:0;z-index:4;background:var(--bg);padding:5px 0}.tab{border:1px solid var(--l);background:#fff;color:var(--n);border-radius:11px;padding:10px 5px;font-weight:bold}.tab.on{background:var(--n);color:#fff}.search{width:100%;min-height:48px;border:1px solid #aebed0;border-radius:12px;padding:10px 13px;margin:8px 0;background:#fff}.page{display:none}.page.on{display:block}.item{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;background:#fff;border:1px solid var(--l);border-radius:13px;padding:12px;margin-bottom:8px}.item-name{font-weight:bold;font-size:15px}.meta{font-size:10px;color:var(--m);margin-top:5px;direction:ltr;text-align:right}.qty{width:100%;min-height:46px;border:1px solid #aebed0;border-radius:10px;text-align:center;font-size:18px}.picked-actions{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}.remove{border:1px solid #efbcbc;background:#fff1f1;color:var(--r);border-radius:9px;min-height:38px;padding:5px 9px;font-weight:bold}.free{border-right:5px solid var(--g);background:#f0faf4}.free .item-name{color:var(--g)}.empty{text-align:center;color:var(--m);padding:30px 10px}.offer{background:#fff;border:1px solid var(--l);border-radius:13px;padding:13px;margin-bottom:8px}.offer b{color:var(--n)}.offer small{display:block;color:var(--m);margin-top:5px}.bottom{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--l);padding:10px;display:flex;align-items:center;gap:10px}.bottom .total{flex:1}.save{border:0;border-radius:11px;background:var(--g);color:#fff;padding:12px 18px;font-weight:bold}.badge{display:inline-block;background:#e9f2fb;color:var(--n);border-radius:999px;padding:3px 8px;font-size:11px}.notice{display:none;background:#eaf7ef;color:#14663d;padding:10px;border-radius:10px;margin:8px 0}.notice.show{display:block}.notice.error{background:#fff0f0;color:#a32626}.modal{position:fixed;inset:0;background:#0008;z-index:99;display:none;place-items:center;padding:18px}.modal.show{display:grid}.dialog{width:min(420px,100%);background:#fff;border-radius:16px;padding:20px;text-align:center;box-shadow:0 20px 60px #0004}.dialog h2{margin:0 0 8px;color:var(--n);font-size:20px}.dialog p{margin:0 0 16px;color:var(--m);line-height:1.7}.dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.yes,.no{min-height:46px;border-radius:11px;font-weight:bold}.yes{border:0;background:var(--r);color:#fff}.no{border:1px solid var(--l);background:#fff;color:var(--n)}</style></head><body><main class="wrap"><section class="customer"><div><b id="customerName">الزبون</b><div class="balance" id="customerBalance">الرصيد: 0 د.ع</div></div><button id="exitCustomer" class="exit">خروج من الزبون</button></section><nav class="tabs"><button class="tab on" data-tab="all">المواد الكلية</button><button class="tab" data-tab="picked">المواد المطلوبة <span id="pickedCount" class="badge">0</span></button><button class="tab" data-tab="offers">عروض FTF</button></nav><div id="notice" class="notice"></div><section id="all" class="page on"><input id="search" class="search" type="search" placeholder="ابحث باسم المادة أو الرقم المخزني…" autocomplete="off"><div id="allList"></div></section><section id="picked" class="page"><div id="pickedList"></div></section><section id="offers" class="page"><div id="offerList"></div></section><footer class="bottom"><div class="total"><small>المجموع</small><b id="total" style="display:block">0 د.ع</b></div><button id="save" class="save">حفظ الطلب</button></footer></main><div id="exitModal" class="modal" role="dialog" aria-modal="true"><div class="dialog"><h2>تأكيد الخروج</h2><p id="exitMessage">هل تريد الخروج من الزبون؟</p><div class="dialog-actions"><button id="exitYes" class="yes">نعم</button><button id="exitNo" class="no">لا</button></div></div></div><script>const W='albayanWorkspaceV1',D='albayanRepSalesDraftV2',P='albayanPendingInvoicesV1';const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),money=n=>new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:2}).format(Number(n)||0);const w=load(W,{items:[],accounts:[],customers:[]});const q=new URLSearchParams(location.search);const active=load('albayanRepActiveCustomer',null);const cname=q.get('customer')||sessionStorage.getItem('albayanCurrentCustomer')||active?.name||'الزبون';document.getElementById('customerName').textContent=cname;function balance(){return(w.accounts||[]).filter(x=>x.customer===cname).reduce((s,x)=>s+Number(x.owedBy||0)-Number(x.owedTo||0),0)}document.getElementById('customerBalance').textContent='الرصيد: '+money(balance())+' د.ع';let draft=load(D,{});if(draft.customer!==cname)draft={customer:cname,qty:{}};const items=(w.items||[]).map((x,i)=>({id:String(x.id??x.code??i),code:String(x.code??''),name:x.name||('مادة '+(i+1)),stock:Number(x.quantity??0),price:Number(x.cartonPrice??0),agency:x.agency||'غير محدد',brand:x.brand||'',promo:x.promo||x.ftf||null}));function qty(i){return Number(draft.qty[i.id]||0)}function hasDraft(){return Object.values(draft.qty||{}).some(v=>Number(v)>0)}function freeQty(i){const p=i.promo;if(!p)return 0;const buy=Number(p.buy||p.required||0),free=Number(p.free||p.bonus||0);return buy>0?Math.floor(qty(i)/buy)*free:0}function reserved(i){return load(P,[]).filter(p=>p.syncStatus!=='error'&&p.syncStatus!=='cancelled').reduce((s,p)=>s+(p.invoice?.lines||[]).filter(l=>String(l.itemId)===i.id).reduce((z,l)=>z+Number(l.quantity||0)+Number(l.freeQuantity||0),0),0)}function available(i){return Math.max(0,i.stock-reserved(i))}function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function row(i,picked=false){const controls=picked?'<div class="picked-actions"><input class="qty" inputmode="decimal" type="number" min="0" step="1" value="'+(qty(i)||'')+'" data-id="'+i.id+'"><button class="remove" data-remove="'+i.id+'">حذف</button></div>':'<input class="qty" inputmode="decimal" type="number" min="0" step="1" value="'+(qty(i)||'')+'" placeholder="الكمية" data-id="'+i.id+'">';return '<div class="item"><div><div class="item-name">'+esc(i.name)+'</div><div class="meta">WH '+money(available(i))+'   P '+money(i.price)+'</div></div>'+controls+'</div>'}function renderAll(){const s=document.getElementById('search').value.trim().toLowerCase(),a=items.filter(i=>!s||i.name.toLowerCase().includes(s)||i.code.toLowerCase().includes(s));document.getElementById('allList').innerHTML=a.length?a.map(i=>row(i)).join(''):'<div class="empty">ماكو مادة مطابقة</div>';bind()}function renderPicked(){const a=items.filter(i=>qty(i)>0);document.getElementById('pickedCount').textContent=a.length;document.getElementById('pickedList').innerHTML=a.length?a.map(i=>row(i,true)+(freeQty(i)?'<div class="item free"><div><div class="item-name">'+esc(i.name)+' · FTF مجاني</div><div class="meta">P 0</div></div><b>'+freeQty(i)+'</b></div>':'')).join(''):'<div class="empty">بعدك ما اخترت مواد</div>';document.getElementById('total').textContent=money(a.reduce((s,i)=>s+qty(i)*i.price,0))+' د.ع';bind()}function renderOffers(){const a=items.filter(i=>i.promo);document.getElementById('offerList').innerHTML=a.length?a.map(i=>'<div class="offer"><b>'+esc(i.name)+'</b><small>كل '+Number(i.promo.buy||i.promo.required||0)+' تحصل '+Number(i.promo.free||i.promo.bonus||0)+' مجاني · يضاف تلقائياً</small></div>').join(''):'<div class="empty">لا توجد عروض FTF فعالة لهذا الزبون حالياً</div>'}function bind(){document.querySelectorAll('.qty').forEach(el=>el.oninput=()=>{draft.qty[el.dataset.id]=Math.max(0,Number(el.value)||0);save(D,draft);renderPicked()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{draft.qty[b.dataset.remove]=0;save(D,draft);renderPicked();renderAll();show('تم حذف المادة من الطلب')})}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===b.dataset.tab));if(b.dataset.tab==='picked')renderPicked();if(b.dataset.tab==='offers')renderOffers()});document.getElementById('search').oninput=renderAll;document.getElementById('save').onclick=()=>{};function show(t,error=false){const n=document.getElementById('notice');n.textContent=t;n.classList.toggle('error',error);n.classList.add('show');setTimeout(()=>{n.classList.remove('show');n.classList.remove('error')},3200)}const modal=document.getElementById('exitModal'),msg=document.getElementById('exitMessage');function askExit(){msg.textContent=hasDraft()?'عندك مواد مدخلة ولم تحفظ الطلب. هل تريد الخروج من الزبون؟':'هل تريد الخروج من الزبون؟';modal.classList.add('show')}function closeExit(){modal.classList.remove('show')}function leave(){localStorage.removeItem('albayanRepActiveCustomer');localStorage.removeItem('albayanRepActiveVisitV2');sessionStorage.removeItem('albayanCurrentCustomer');location.replace('representative.html?v=20260912-25')}document.getElementById('exitCustomer').onclick=askExit;document.getElementById('exitNo').onclick=closeExit;document.getElementById('exitYes').onclick=leave;modal.onclick=e=>{if(e.target===modal)closeExit()};history.pushState({customerLocked:true},'',location.href);window.addEventListener('popstate',()=>{history.pushState({customerLocked:true},'',location.href);askExit()});renderAll();renderPicked();renderOffers();</script><script src="rep-sales-unit-fix.js?v=20260912-5"></script><script defer src="offline.js?v=offline-20260912-25"></script></body></html>
