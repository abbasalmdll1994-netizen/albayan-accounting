<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b63"><title>إدارة المندوب | مكتب القرية</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172b40;font-family:Tahoma,Arial,sans-serif}.top{background:#123b63;color:#fff;padding:18px}.wrap{max-width:900px;margin:auto}.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{margin:0;font-size:22px}.top small{color:#d8e6f2}.back{color:#fff;text-decoration:none;border:1px solid #ffffff55;border-radius:9px;padding:8px 12px}.page{padding:14px}.panel,.customer{background:#fff;border:1px solid #d9e3ed;border-radius:14px}.panel{padding:15px;margin-bottom:12px}.field label{display:block;font-weight:bold;margin-bottom:6px}.field input{width:100%;min-height:45px;border:1px solid #afc0d0;border-radius:9px;padding:9px 11px;font:inherit;background:#fff}.btn{border:1px solid #d9e3ed;background:#fff;color:#123b63;border-radius:9px;min-height:44px;padding:8px 13px;font:inherit;font-weight:bold}.primary{background:#123b63;color:#fff;border-color:#123b63}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.customer{padding:13px;margin-bottom:9px}.customer-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{background:#eef5fb;color:#123b63;border-radius:999px;padding:4px 9px;font-size:11px}.muted{color:#627387;font-size:12px}.notice{background:#eef5fb;border-right:4px solid #1769aa;padding:11px;border-radius:9px;margin-bottom:12px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}.stat{background:#f8fafc;border:1px solid #e0e7ee;border-radius:10px;padding:10px}.stat b{display:block;font-size:20px;color:#123b63}.search{width:100%;min-height:44px;border:1px solid #afc0d0;border-radius:9px;padding:9px 11px;font:inherit;margin-bottom:10px}@media(max-width:600px){.page{padding:10px}.stats{grid-template-columns:1fr 1fr}}</style>

<meta name="application-name" content="مكتب القرية">
</head><body><header class="top"><div class="wrap"><div><h1>إدارة المندوب</h1><small>مكتب القرية · مندوب واحد حالياً</small></div><a class="back" href="admin-dashboard.html?v=release-20260903-1">رجوع</a></div></header><main class="page wrap"><section class="panel"><div class="notice">حالياً النظام يعمل على مندوب واحد فقط. كل الزبائن والجولات والمبيعات والتحصيلات ترتبط تلقائياً بهذا المندوب، وتجهيز تعدد المندوبين يبقى محفوظ للمستقبل بدون ما يعقد الاستخدام الحالي.</div><div class="field"><label>اسم المندوب الحالي</label><input id="name" placeholder="مثال: عباس"></div><div class="field" style="margin-top:10px"><label>الرقم الداخلي</label><input id="repId" readonly></div><div class="actions"><button id="saveRep" class="btn primary">حفظ اسم المندوب</button></div></section><section class="panel"><h2 style="margin:0 0 8px">زبائن المندوب</h2><div class="stats"><div class="stat"><span class="muted">عدد الزبائن</span><b id="customerCount">0</b></div><div class="stat"><span class="muted">مرتبطين بالمندوب</span><b id="assignedCount">0</b></div></div><input id="search" class="search" placeholder="بحث باسم الزبون أو المنطقة"><div id="customers"></div><div class="actions"><button id="assignAll" class="btn primary">ربط كل الزبائن بالمندوب الحالي</button></div></section></main><script>const KEY='albayanRepresentativesV1',PROFILE='albayanRepProfileV1',ROUTE='albayanRepresentativeRouteV1';const $=id=>document.getElementById(id);function load(k,f){try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}function profile(){const p=load(PROFILE,{id:'rep-1',name:'عباس',signature:''});if(!p.id)p.id='rep-1';return p}function ensureSingleRep(){const p=profile(),a=[{id:p.id||'rep-1',name:p.name||'عباس',username:'rep1',active:true,updatedAt:new Date().toISOString()}];save(KEY,a);return a[0]}function routeCustomers(){const a=load(ROUTE,[]);return Array.isArray(a)?a:[]}function renderCustomers(){const rep=ensureSingleRep(),all=routeCustomers(),q=$('search').value.trim().toLowerCase(),arr=all.filter(c=>(String(c.name)+' '+String(c.area||'')).toLowerCase().includes(q));$('customerCount').textContent=all.length;$('assignedCount').textContent=all.filter(c=>c.repId===rep.id).length;$('customers').innerHTML=arr.length?arr.map(c=>'<div class="customer"><div class="customer-head"><div><b>'+esc(c.name)+'</b><div class="muted">'+esc(c.area||'')+' · '+esc(c.type||'')+'</div></div><span class="badge">'+(c.repId===rep.id?'مرتبط':'غير مرتبط')+'</span></div></div>').join(''):'<div class="muted" style="text-align:center;padding:20px">لا توجد نتائج.</div>'}function render(){const p=profile();$('name').value=p.name||'';$('repId').value=p.id||'rep-1';ensureSingleRep();renderCustomers()}$('saveRep').onclick=()=>{const name=$('name').value.trim();if(!name)return alert('اكتب اسم المندوب');const p=profile();p.name=name;p.updatedAt=new Date().toISOString();save(PROFILE,p);ensureSingleRep();const all=routeCustomers();for(const c of all){if(!c.repId||c.repId===p.id){c.repId=p.id;c.repName=name;c.updatedAt=new Date().toISOString()}}save(ROUTE,all);render();alert('تم حفظ اسم المندوب وربط بياناته بالرقم الداخلي الثابت '+p.id)};$('assignAll').onclick=()=>{const p=profile(),all=routeCustomers();for(const c of all){c.repId=p.id||'rep-1';c.repName=p.name||'عباس';c.updatedAt=new Date().toISOString()}save(ROUTE,all);renderCustomers();alert('تم ربط كل الزبائن بالمندوب الحالي.')} ;$('search').oninput=renderCustomers;window.addEventListener('storage',render);render();</script><script src="cloud-sync.js?v=release-20260903-1"></script></body></html>
