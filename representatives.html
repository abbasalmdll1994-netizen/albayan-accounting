<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b63"><title>إدارة المندوبين | مكتب القرية</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172b40;font-family:Tahoma,Arial,sans-serif}.top{background:#123b63;color:#fff;padding:18px}.wrap{max-width:850px;margin:auto}.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{margin:0;font-size:22px}.top small{color:#d8e6f2}.back{color:#fff;text-decoration:none;border:1px solid #ffffff55;border-radius:9px;padding:8px 12px}.page{padding:14px}.panel,.rep{background:#fff;border:1px solid #d9e3ed;border-radius:14px}.panel{padding:15px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-weight:bold;margin-bottom:6px}.field input{width:100%;min-height:45px;border:1px solid #afc0d0;border-radius:9px;padding:9px 11px;font:inherit}.btn{border:1px solid #d9e3ed;background:#fff;color:#123b63;border-radius:9px;min-height:44px;padding:8px 13px;font:inherit;font-weight:bold}.primary{background:#123b63;color:#fff;border-color:#123b63}.danger{color:#a12727}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.rep{padding:13px;margin-bottom:9px}.rep-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{background:#eef5fb;color:#123b63;border-radius:999px;padding:4px 9px;font-size:11px}.muted{color:#627387;font-size:12px}.notice{background:#eef5fb;border-right:4px solid #1769aa;padding:11px;border-radius:9px;margin-bottom:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}.page{padding:10px}}</style></head><body><header class="top"><div class="wrap"><div><h1>إدارة المندوبين</h1><small>مكتب القرية · تجهيز تعدد المندوبين</small></div><a class="back" href="admin-dashboard.html">رجوع</a></div></header><main class="page wrap"><section class="panel"><div class="notice">كل مندوب يحصل على رقم داخلي ثابت. هذا الرقم راح نستخدمه لربط الزبائن والجولات والفواتير والتحصيلات بالمندوب الصحيح.</div><div class="grid"><div class="field"><label>اسم المندوب</label><input id="name" placeholder="مثال: عباس"></div><div class="field"><label>اسم المستخدم</label><input id="username" placeholder="مثال: abbas"></div></div><div class="actions"><button id="add" class="btn primary">+ إضافة مندوب</button></div></section><section class="panel"><h2 style="margin-top:0">المندوبون المسجلون</h2><div id="list"></div></section></main><script>const KEY='albayanRepresentativesV1',PROFILE='albayanRepProfileV1';const $=id=>document.getElementById(id);function load(k,f){try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function esc(v){return String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}function seed(){let a=load(KEY,[]);if(!Array.isArray(a))a=[];const p=load(PROFILE,{id:'rep-1',name:'عباس'});if(!a.length)a.push({id:p.id||'rep-1',name:p.name||'عباس',username:'rep1',active:true,createdAt:new Date().toISOString()});save(KEY,a);return a}function nextId(a){let n=1;while(a.some(x=>x.id==='rep-'+n))n++;return'rep-'+n}function render(){const a=seed();$('list').innerHTML=a.map(r=>'<div class="rep"><div class="rep-head"><div><b>'+esc(r.name)+'</b><div class="muted">اسم المستخدم: '+esc(r.username||'—')+'</div></div><span class="badge">'+esc(r.id)+'</span></div><div class="actions"><button class="btn" data-toggle="'+esc(r.id)+'">'+(r.active===false?'تفعيل':'إيقاف')+'</button>'+(r.id==='rep-1'?'':'<button class="btn danger" data-delete="'+esc(r.id)+'">حذف</button>')+'</div></div>').join('');document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const x=a.find(r=>r.id===b.dataset.toggle);if(x){x.active=x.active===false;save(KEY,a);render()}});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('حذف هذا المندوب؟'))return;save(KEY,a.filter(r=>r.id!==b.dataset.delete));render()})}$('add').onclick=()=>{const name=$('name').value.trim(),username=$('username').value.trim();if(!name)return alert('اكتب اسم المندوب');const a=seed();if(username&&a.some(x=>String(x.username).toLowerCase()===username.toLowerCase()))return alert('اسم المستخدم موجود مسبقاً');a.push({id:nextId(a),name,username:username||('rep'+(a.length+1)),active:true,createdAt:new Date().toISOString()});save(KEY,a);$('name').value='';$('username').value='';render();alert('تمت إضافة المندوب برقم داخلي ثابت.')} ;render();</script></body></html>
