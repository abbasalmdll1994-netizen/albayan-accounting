<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b63"><title>نظام المندوب | مكتب القرية</title><style>:root{--navy:#123b63;--blue:#1769aa;--line:#d9e3ed;--muted:#627387;--green:#18864b;--red:#b83232;--bg:#f3f6fa}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:#172b40}button,input,select{font:inherit}button{cursor:pointer}.top{background:var(--navy);color:#fff;padding:18px 20px}.wrap{max-width:900px;margin:auto}.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px}.top h1{font-size:22px;margin:0}.top p{margin:3px 0 0;color:#d9e7f3;font-size:13px}.page{padding:16px}.panel,.card,.customer{background:#fff;border:1px solid var(--line);border-radius:15px}.panel{padding:18px;margin-bottom:15px}.login{max-width:430px;margin:42px auto}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:13px}.field input,.field select{min-height:48px;border:1px solid #afc0d0;border-radius:10px;padding:10px 12px}.btn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;min-height:46px;padding:9px 14px}.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.wide{width:100%}.small{min-height:40px;padding:7px 11px}.muted{color:var(--muted);font-size:13px}.nav{display:flex;gap:7px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}.nav button{white-space:nowrap}.section{display:none}.section.active{display:block}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:15px}.card{padding:14px}.card strong{display:block;font-size:23px;margin-top:6px}.customer{padding:14px;margin-bottom:10px}.customer.done{border-right:5px solid var(--green)}.customer h3{margin:4px 0 5px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.badge{display:inline-block;padding:3px 9px;border-radius:999px;background:#edf3f8;color:var(--navy);font-size:12px}.badge.done{background:#e7f5ed;color:var(--green)}.customer-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.customer-actions button{min-height:68px;font-weight:bold}.balance{font-size:20px;font-weight:bold;color:var(--navy);margin:12px 0}.list-row{padding:10px 0;border-bottom:1px solid var(--line)}.list-row:last-child{border-bottom:0}.danger{color:var(--red)}@media(max-width:600px){.cards{grid-template-columns:1fr 1fr}.page{padding:11px}.customer-actions{grid-template-columns:1fr 1fr}}</style></head><body><header class="top"><div class="wrap"><div><h1>نظام المندوب</h1><p>مكتب القرية · الجولة اليومية</p></div><button id="logoutBtn" class="btn small" hidden>تسجيل خروج</button></div></header><div id="loginView" class="page"><div class="panel login"><h2 style="text-align:center">تسجيل الدخول</h2><p class="muted" style="text-align:center">اسم المستخدم محفوظ، أدخل كلمة المرور.</p><div class="field"><label>اسم المستخدم</label><input value="مندوب" readonly></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" inputmode="numeric"></div><button id="loginBtn" class="btn primary wide">دخول</button><p id="loginMsg" class="muted" style="text-align:center"></p></div></div><div id="appView" hidden><nav class="nav wrap"><button class="btn small" data-section="home">الرئيسية</button><button class="btn small primary" data-section="route">الجولة اليومية</button><button class="btn small" data-section="customers">الزبائن</button><button class="btn small" data-section="reports">التقارير</button><a href="index.html"><button class="btn small">نظام المبيعات</button></a></nav><main class="page wrap"><section id="home" class="section"><div class="cards"><div class="card"><span class="muted">زبائن الجولة</span><strong id="homeTotal">0</strong></div><div class="card"><span class="muted">تمت الزيارة</span><strong id="homeDone">0</strong></div><div class="card"><span class="muted">المتبقي</span><strong id="homeLeft">0</strong></div></div><div class="panel"><h2>اليوم</h2><p id="todayText"></p><button class="btn primary" data-section="route">فتح الجولة اليومية</button></div></section><section id="route" class="section active"><div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2 style="margin:0">الجولة اليومية</h2><p class="muted" id="routeDate"></p></div><button id="addCustomerBtn" class="btn primary small">+ إضافة زبون</button></div></div><div class="cards"><div class="card"><span class="muted">العدد</span><strong id="routeTotal">0</strong></div><div class="card"><span class="muted">تم</span><strong id="routeDone">0</strong></div><div class="card"><span class="muted">متبقي</span><strong id="routeLeft">0</strong></div></div><div id="routeList"></div></section><section id="customers" class="section"><div class="panel"><h2>الزبائن</h2><div class="field"><input id="customerSearch" placeholder="بحث باسم الزبون أو المنطقة"></div><div id="customerList"></div></div></section><section id="reports" class="section"><div class="panel"><h2>تقرير الجولة</h2><div class="cards"><div class="card"><span class="muted">تمت زيارتهم</span><strong id="reportDone">0</strong></div><div class="card"><span class="muted">متبقي</span><strong id="reportLeft">0</strong></div><div class="card"><span class="muted">باعوا اليوم</span><strong id="reportSold">0</strong></div></div><h3>زبائن الجولة بدون بيع اليوم</h3><div id="noSaleList" class="muted"></div></div></section><section id="customerView" class="section"><div class="panel"><button id="backRoute" class="btn small">رجوع للجولة</button><h2 id="cvName"></h2><p id="cvInfo" class="muted"></p><div id="cvBalance" class="balance"></div><div class="customer-actions"><button class="btn primary" id="newSale">🧾 بيع جديد</button><button class="btn" id="payment">💰 تسديد</button><button class="btn" id="statement">📒 كشف حساب</button><button class="btn" id="returns">↩ مرتجع</button></div><div class="row"><button id="markDone" class="btn">✓ تمت الزيارة</button><button id="markNoOrder" class="btn">لم يطلب</button><button id="markClosed" class="btn">مغلق</button></div></div></section><section id="statementView" class="section"><div class="panel"><button id="backCustomer" class="btn small">رجوع للزبون</button><h2 id="stName"></h2><div id="stBalance" class="balance"></div><div id="stRows"></div></div></section></main></div><script>const ROUTEKEY='albayanRepresentativeRouteV1',WORK='albayanWorkspaceV1',SESSION='albayanRepLoggedIn',PASS='albayanRepPassword',$=id=>document.getElementById(id);let route=JSON.parse(localStorage.getItem(ROUTEKEY)||'null')||[{id:1,name:'ماركت النور',area:'السوق الكبير',type:'ماركت',status:'pending'},{id:2,name:'أسواق السلام',area:'شارع المحافظة',type:'جملة',status:'pending'},{id:3,name:'مركز الرافدين',area:'حي المعلمين',type:'مفرد',status:'pending'}],current=null;const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),today=()=>{const d=new Date();return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')},money=n=>new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:2}).format(n||0);function workspace(){try{return JSON.parse(localStorage.getItem(WORK)||'null')||{version:3,accounts:[],items:[],invoices:[],customerTiers:[]}}catch{return{version:3,accounts:[],items:[],invoices:[],customerTiers:[]}}}function invoiceTotal(v){let t=Number(v.loading)||0;for(const l of v.lines||[]){const p=l.unit==='carton'?l.cartonPrice:l.unit==='dozen'?l.dozenPrice:l.piecePrice;t+=Number(l.quantity||0)*Number(p||0)}return Math.round(t*100)/100}function customerMovements(name){const w=workspace(),rows=[...(w.accounts||[]).filter(a=>a.customer===name)];for(const v of (w.invoices||[]).filter(v=>!v.cancelled&&v.customer===name)){const debt=Math.round((invoiceTotal(v)-Number(v.paid||0))*100)/100;if(debt)rows.push({date:v.date,customer:name,owedTo:0,owedBy:debt,note:'متبقي فاتورة بيع رقم '+v.number,invoiceId:v.id})}return rows.sort((a,b)=>String(b.date).localeCompare(String(a.date)))}function balance(name){const r=customerMovements(name);return Math.round((r.reduce((s,a)=>s+Number(a.owedBy||0),0)-r.reduce((s,a)=>s+Number(a.owedTo||0),0))*100)/100}function saveRoute(){localStorage.setItem(ROUTEKEY,JSON.stringify(route));render()}function statusText(s){return s==='done'?'تمت الزيارة':s==='no-order'?'لم يطلب':s==='closed'?'مغلق':'بانتظار الزيارة'}function stats(){const done=route.filter(x=>x.status!=='pending').length;return{total:route.length,done,left:route.length-done}}function renderReports(){const w=workspace(),sold=new Set((w.invoices||[]).filter(v=>!v.cancelled&&v.date===today()).map(v=>v.customer));$('reportSold').textContent=route.filter(c=>sold.has(c.name)).length;const no=route.filter(c=>!sold.has(c.name));$('noSaleList').innerHTML=no.length?no.map(c=>'<div class="list-row">'+esc(c.name)+' <span class="muted">· '+esc(c.area||'')+'</span></div>').join(''):'كل زبائن الجولة عندهم بيع اليوم.'}function render(){const s=stats();['homeTotal','routeTotal'].forEach(x=>$(x).textContent=s.total);['homeDone','routeDone','reportDone'].forEach(x=>$(x).textContent=s.done);['homeLeft','routeLeft','reportLeft'].forEach(x=>$(x).textContent=s.left);$('routeList').innerHTML=route.map((c,i)=>'<div class="customer '+(c.status!=='pending'?'done':'')+'"><span class="badge '+(c.status!=='pending'?'done':'')+'">'+statusText(c.status)+'</span><h3>'+(i+1)+'. '+esc(c.name)+'</h3><div class="muted">'+esc(c.area||'')+' · '+esc(c.type||'')+'</div><div class="row"><button class="btn small primary" onclick="openCustomer('+c.id+')">فتح الزبون</button></div></div>').join('')||'<div class="panel muted">لا يوجد زبائن.</div>';filterCustomers();renderReports()}function section(id){document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('[data-section]').forEach(b=>b.classList.toggle('primary',b.dataset.section===id));scrollTo(0,0)}function filterCustomers(){const q=($('customerSearch')?.value||'').trim().toLowerCase(),arr=route.filter(c=>(c.name+' '+c.area).toLowerCase().includes(q));$('customerList').innerHTML=arr.map(c=>'<div class="customer"><h3>'+esc(c.name)+'</h3><div class="muted">'+esc(c.area)+' · '+esc(c.type)+'</div><button class="btn small" onclick="openCustomer('+c.id+')">فتح</button></div>').join('')||'<p class="muted">لا توجد نتائج.</p>'}window.openCustomer=id=>{current=route.find(x=>x.id===id);if(!current)return;$('cvName').textContent=current.name;$('cvInfo').textContent=(current.area||'')+' · '+(current.type||'');const b=balance(current.name);$('cvBalance').textContent=b>0?'عليه لنا: '+money(b)+' د.ع':b<0?'له علينا: '+money(Math.abs(b))+' د.ع':'الرصيد متعادل';section('customerView')};function setStatus(s){if(!current)return;current.status=s;saveRoute();openCustomer(current.id)}function addPayment(){if(!current)return;const raw=prompt('مبلغ التسديد المستلم من '+current.name);if(raw===null)return;const amount=Number(raw);if(!Number.isFinite(amount)||amount<=0)return alert('أدخل مبلغ صحيح.');const w=workspace();w.version=3;w.accounts=Array.isArray(w.accounts)?w.accounts:[];w.items=Array.isArray(w.items)?w.items:[];w.invoices=Array.isArray(w.invoices)?w.invoices:[];w.customerTiers=Array.isArray(w.customerTiers)?w.customerTiers:[];w.accounts.push({id:'rep-'+Date.now()+'-'+Math.random().toString(36).slice(2),customer:current.name,date:today(),owedTo:amount,owedBy:0,note:'تسديد مستلم بواسطة المندوب'});localStorage.setItem(WORK,JSON.stringify(w));alert('تم تسجيل التسديد في حساب الزبون.');openCustomer(current.id)}function showStatement(){if(!current)return;const rows=customerMovements(current.name),b=balance(current.name);$('stName').textContent='كشف حساب · '+current.name;$('stBalance').textContent=b>0?'الرصيد عليه لنا: '+money(b)+' د.ع':b<0?'الرصيد له علينا: '+money(Math.abs(b))+' د.ع':'الرصيد متعادل';$('stRows').innerHTML=rows.length?rows.map(r=>'<div class="list-row"><b>'+esc(r.date)+'</b><div>'+esc(r.note||'حركة حساب')+'</div><div class="muted">مستحق له: '+money(r.owedTo)+' · مستحق لنا: '+money(r.owedBy)+'</div></div>').join(''):'<p class="muted">لا توجد حركات لهذا الزبون.</p>';section('statementView')}function login(){const saved=localStorage.getItem(PASS)||'1234';if($('password').value===saved){localStorage.setItem(SESSION,'1');showApp()}else $('loginMsg').textContent='كلمة المرور غير صحيحة'}function showApp(){$('loginView').hidden=true;$('appView').hidden=false;$('logoutBtn').hidden=false;render()}function logout(){localStorage.removeItem(SESSION);location.reload()}const ds=new Date().toLocaleDateString('ar-IQ',{weekday:'long',year:'numeric',month:'long',day:'numeric'});$('todayText').textContent=ds;$('routeDate').textContent=ds;$('loginBtn').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('logoutBtn').onclick=logout;document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>section(b.dataset.section));$('backRoute').onclick=()=>section('route');$('backCustomer').onclick=()=>section('customerView');$('customerSearch').oninput=filterCustomers;$('markDone').onclick=()=>setStatus('done');$('markNoOrder').onclick=()=>setStatus('no-order');$('markClosed').onclick=()=>setStatus('closed');$('addCustomerBtn').onclick=()=>{const name=prompt('اسم الزبون');if(!name)return;const area=prompt('المنطقة')||'',type=prompt('نوع الزبون: جملة الجملة / جملة / ماركت / مفرد')||'ماركت';route.push({id:Date.now(),name,area,type,status:'pending'});saveRoute()};$('newSale').onclick=()=>{if(!current)return;localStorage.setItem('albayanRepActiveCustomer',JSON.stringify(current));location.href='representative-sale.html'};$('payment').onclick=addPayment;$('statement').onclick=showStatement;$('returns').onclick=()=>alert('المرتجعات هي المرحلة التالية بعد إكمال ربط البيع والتسديد.');window.addEventListener('storage',e=>{if(e.key===WORK)render()});if(localStorage.getItem(SESSION)==='1')showApp();</script></body></html>
