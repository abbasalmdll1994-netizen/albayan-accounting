<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>القوائم المستحقة | مواعيد التسديد</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#17344e;font-family:Tahoma,Arial,sans-serif}header{background:#07579a;color:#fff;padding:17px}main{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #d5e1eb;border-radius:15px;padding:14px;margin-bottom:12px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.bucket{background:#eaf3fb;border:0;border-radius:10px;padding:10px 4px;color:#07579a;font-weight:bold}.bucket b{display:block;font-size:18px;margin:5px}.bucket.active{background:#07579a;color:white}input{width:100%;padding:13px;border:1px solid #afc3d5;border-radius:10px;font:inherit;margin:10px 0}.row{border-top:1px solid #e2e9ef;padding:12px 2px}.row:first-child{border:0}.line{display:flex;justify-content:space-between;gap:8px}.muted{color:#61778b;font-size:13px;line-height:1.7}.amount{font-weight:bold;white-space:nowrap}.back{color:white}small{display:block}@media(min-width:650px){.summary{grid-template-columns:repeat(6,1fr)}}</style></head><body><header><a class="back" href="payment-schedule.html">→ مواعيد التسديد</a><h2>كشف القوائم المستحقة</h2></header><main><div class="card"><div class="muted">الأيام تُحسب من تاريخ استحقاق القائمة إن وُجد؛ وإلا من تاريخ الفاتورة. الأرصدة المجمّعة بلا تاريخ فاتورة تظهر منفصلة.</div><div id="summary" class="summary"></div><input id="search" type="search" placeholder="ابحث عن زبون" aria-label="ابحث عن زبون"></div><div class="card"><b id="heading">الزبائن والقوائم</b><div id="results"></div></div></main><script>(function(){'use strict';var W='albayanWorkspaceV1',buckets=[['0–7 أيام',0,7],['8–14 يوم',8,14],['15–21 يوم',15,21],['22–30 يوم',22,30],['31–40 يوم',31,40],['أكثر من 40',41,Infinity]],selected=-1;function get(){try{return JSON.parse(localStorage.getItem(W)||'null')}catch{return null}}function clean(s){return String(s||'').trim().replace(/\s+/g,' ')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:2}).format(n)+' د.ع'}function age(d){if(!/^\d{4}-\d\d-\d\d$/.test(d||''))return null;var t=new Date(d+'T12:00:00'),now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12);return isNaN(t)?null:Math.max(0,Math.floor((today-t)/86400000))}function build(){var w=get();if(!w||!Array.isArray(w.accounts))return null;var groups=new Map(),add=(name,row)=>{name=clean(name);if(!name||name==='الصندوق')return;if(!groups.has(name))groups.set(name,[]);groups.get(name).push(row)};for(var a of w.accounts){if(a&&a.customer)add(a.customer,{id:a.id,date:a.due||a.dueDate||a.date||'',invoiceDate:a.date||'',by:Number(a.owedBy)||0,to:Number(a.owedTo)||0,number:a.externalDocumentNumber||a.invoiceNo||a.receiptNumber||'',note:a.note||a.notes||'',source:a.source||'',type:a.type||'',allocated:Array.isArray(a.allocations)?a.allocations:[]})}for(var v of w.invoices||[]){if(!v||v.cancelled)continue;var matches=(w.accounts||[]).some(a=>a.customer===v.customer&&(String(a.invoiceId||'')===String(v.id)||String(a.sourceInvoiceId||'')===String(v.id)));if(matches)continue;var total=Number(v.total??v.grandTotal);if(!Number.isFinite(total))total=(v.lines||[]).reduce((n,l)=>n+Number(l.quantity||0)*Number(l.price??l.cartonPrice??0),Number(v.loading||0));var debt=Math.max(0,total-Number(v.paid||0));if(debt)add(v.customer,{id:'invoice-'+v.id,date:v.due||v.date||'',invoiceDate:v.date||'',by:debt,to:0,number:v.number||'',note:'فاتورة بيع',source:'invoice',type:'',allocated:[]})}var all=[];for(var [name,rows] of groups){var docs=rows.filter(r=>r.by>0&&r.source!=='payment-reversal'),credits=rows.filter(r=>r.to>0).reduce((n,r)=>n+r.to,0);docs.sort((a,b)=>a.invoiceDate.localeCompare(b.invoiceDate)||String(a.id).localeCompare(String(b.id)));for(var doc of docs){var used=Math.min(credits,doc.by);doc.open=Math.max(0,doc.by-used);credits-=used}var open=docs.filter(r=>r.open>0.009).map(r=>({...r,days:(r.type==='balance-correction'||r.note.includes('تثبيت الرصيد من كشف العملاء'))?null:age(r.date)}));var total=open.reduce((n,r)=>n+r.open,0);if(total>0)all.push({name,open,total,oldest:Math.max(-1,...open.map(r=>r.days??-1))})}return all.sort((a,b)=>b.oldest-a.oldest||b.total-a.total||a.name.localeCompare(b.name,'ar'))}var data=build(),summary=document.getElementById('summary'),results=document.getElementById('results'),search=document.getElementById('search'),heading=document.getElementById('heading');function render(){if(!data){results.textContent='ماكو بيانات محفوظة هنا. افتح التقرير من مواعيد التسديد بنفس المتصفح.';return}summary.innerHTML=buckets.map((b,i)=>{var list=data.flatMap(x=>x.open).filter(r=>r.days!==null&&r.days>=b[1]&&r.days<=b[2]);return '<button class="bucket '+(i===selected?'active':'')+'" data-b="'+i+'">'+b[0]+'<b>'+money(list.reduce((n,r)=>n+r.open,0))+'</b><small>'+list.length+' قائمة</small></button>'}).join('');var q=clean(search.value),filtered=data.map(x=>({...x,open:x.open.filter(r=>(selected<0||r.days!==null&&r.days>=buckets[selected][1]&&r.days<=buckets[selected][2]))})).filter(x=>x.open.length&&(!q||x.name.includes(q)));heading.textContent='الزبائن حسب أقدم قائمة — '+filtered.length;results.innerHTML=filtered.length?filtered.map(x=>'<div class="row"><div class="line"><b>'+esc(x.name)+'</b><span class="amount">'+money(x.open.reduce((n,r)=>n+r.open,0))+'</span></div>'+x.open.map(r=>'<div class="line muted"><span>قائمة '+esc(r.number||r.note||'بلا رقم')+' · '+esc(r.invoiceDate||'بلا تاريخ')+(r.days===null?' · تاريخ الاستحقاق غير معروف':' · '+r.days+' يوم')+'</span><b>'+money(r.open)+'</b></div>').join('')+'</div>').join(''):'<p class="muted">ماكو قوائم مطابقة لهذا البحث.</p>';summary.querySelectorAll('[data-b]').forEach(btn=>btn.onclick=function(){var i=Number(this.dataset.b);selected=selected===i?-1:i;render()})}search.oninput=render;render()})();</script></body></html>
