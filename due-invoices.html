<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>القوائم المستحقة | مواعيد التسديد</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#17344e;font-family:Tahoma,Arial,sans-serif}header{background:#07579a;color:#fff;padding:17px}main{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #d5e1eb;border-radius:15px;padding:14px;margin-bottom:12px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.bucket{background:#eaf3fb;border:0;border-radius:10px;padding:10px 4px;color:#07579a;font-weight:bold}.bucket b{display:block;font-size:18px;margin:5px}.bucket.active{background:#07579a;color:white}input{width:100%;padding:13px;border:1px solid #afc3d5;border-radius:10px;font:inherit;margin:10px 0}.group{margin-top:18px}.group h3{background:#eaf3fb;color:#07579a;margin:0;border-radius:9px;padding:11px;font-size:16px}.row{border-top:1px solid #e2e9ef;padding:12px 2px}.row:first-child{border:0}.table-scroll{overflow-x:auto;overscroll-behavior-inline:contain;-webkit-overflow-scrolling:touch}.ledger-head,.ledger-row{display:grid;grid-template-columns:190px 135px 145px 100px 125px;min-width:695px;gap:8px;align-items:center}.ledger-head{background:#f4f8fc;color:#526a80;font-size:13px;font-weight:bold;padding:10px 8px}.ledger-row{padding:10px 8px;font-size:14px}.ledger-row span{white-space:nowrap}.ledger-row .customer-name{position:sticky;right:0;background:#fff;white-space:normal;font-weight:bold;z-index:1}.ledger-head span:first-child{position:sticky;right:0;background:#f4f8fc;z-index:1}.drag-hint{font-size:12px;color:#65798c;margin:8px 0 0}@media(min-width:750px){.drag-hint{display:none}}.line{display:flex;justify-content:space-between;gap:8px}.muted{color:#61778b;font-size:13px;line-height:1.7}.amount{font-weight:bold;white-space:nowrap}.back{color:white}small{display:block}@media(min-width:650px){.summary{grid-template-columns:repeat(6,1fr)}}.export-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.export-actions button{border:0;background:#07579a;color:#fff;border-radius:10px;padding:12px 4px;font:inherit;font-weight:bold}.export-actions button:last-child{background:#17834a}#printArea{display:none}@page{size:A4 portrait;margin:12mm}@media print{body{background:white}body>header,body>main{display:none!important}#printArea{display:block!important;font:10pt Tahoma,Arial}.print-title{text-align:center;font-size:18pt}.print-table{width:100%;border-collapse:collapse;table-layout:fixed}.print-table th,.print-table td{border:1px solid #aebdcc;padding:2mm;overflow-wrap:anywhere}.print-table th{background:#eaf3fb!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.print-table thead{display:table-header-group}.print-table tr{break-inside:avoid;page-break-inside:avoid}}</style></head><body><header><a class="back" href="payment-schedule.html">→ مواعيد التسديد</a><h2>كشف القوائم المستحقة</h2></header><main><div class="card"><div class="muted">مرتبة تلقائياً من أقدم قائمة إلى الأحدث. تُحسب الأيام من الاستحقاق إن وُجد، وإلا من تاريخ القائمة.</div><div id="summary" class="summary"></div><div class="export-actions"><button id="printReport" type="button">🖨️ طباعة A4 / PDF</button><button id="shareImage" type="button">🖼️ مشاركة كصورة</button></div><p id="exportStatus" class="muted" role="status"></p><input id="search" type="search" placeholder="ابحث عن زبون" aria-label="ابحث عن زبون"></div><div class="card"><b id="heading">الزبائن والقوائم</b><div id="results"></div></div></main><div id="printArea"></div><script>(function(){'use strict';var W='albayanWorkspaceV1',buckets=[['0–7 أيام',0,7],['8–14 يوم',8,14],['15–21 يوم',15,21],['22–30 يوم',22,30],['31–40 يوم',31,40],['أكثر من 40',41,Infinity]],selected=-1;function get(){try{return JSON.parse(localStorage.getItem(W)||'null')}catch{return null}}function clean(s){return String(s||'').trim().replace(/\s+/g,' ')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:2}).format(n)+' د.ع'}function age(d){if(!/^\d{4}-\d\d-\d\d$/.test(d||''))return null;var t=new Date(d+'T12:00:00'),now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12);return isNaN(t)?null:Math.max(0,Math.floor((today-t)/86400000))}function build(){var w=get();if(!w||!Array.isArray(w.accounts))return null;var groups=new Map(),add=(name,row)=>{name=clean(name);if(!name||name==='الصندوق')return;if(!groups.has(name))groups.set(name,[]);groups.get(name).push(row)};for(var a of w.accounts){if(a&&a.customer)add(a.customer,{id:a.id,date:a.due||a.dueDate||a.date||'',invoiceDate:a.date||'',by:Number(a.owedBy)||0,to:Number(a.owedTo)||0,number:a.externalDocumentNumber||a.invoiceNo||a.receiptNumber||'',note:a.note||a.notes||'',source:a.source||'',type:a.type||'',allocated:Array.isArray(a.allocations)?a.allocations:[]})}for(var v of w.invoices||[]){if(!v||v.cancelled)continue;var matches=(w.accounts||[]).some(a=>a.customer===v.customer&&(String(a.invoiceId||'')===String(v.id)||String(a.sourceInvoiceId||'')===String(v.id)));if(matches)continue;var total=Number(v.total??v.grandTotal);if(!Number.isFinite(total))total=(v.lines||[]).reduce((n,l)=>n+Number(l.quantity||0)*Number(l.price??l.cartonPrice??0),Number(v.loading||0));var debt=Math.max(0,total-Number(v.paid||0));if(debt)add(v.customer,{id:'invoice-'+v.id,date:v.due||v.date||'',invoiceDate:v.date||'',by:debt,to:0,number:v.number||'',note:'فاتورة بيع',source:'invoice',type:'',allocated:[]})}var all=[];for(var [name,rows] of groups){var docs=rows.filter(r=>r.by>0&&r.source!=='payment-reversal'),credits=rows.filter(r=>r.to>0).reduce((n,r)=>n+r.to,0);docs.sort((a,b)=>a.invoiceDate.localeCompare(b.invoiceDate)||String(a.id).localeCompare(String(b.id)));for(var doc of docs){var used=Math.min(credits,doc.by);doc.open=Math.max(0,doc.by-used);credits-=used}var open=docs.filter(r=>r.open>0.009).map(r=>({...r,days:(r.type==='balance-correction'||r.note.includes('تثبيت الرصيد من كشف العملاء'))?null:age(r.date)}));var total=open.reduce((n,r)=>n+r.open,0);if(total>0)all.push({name,open,total,oldest:Math.max(-1,...open.map(r=>r.days??-1))})}return all.sort((a,b)=>b.oldest-a.oldest||b.total-a.total||a.name.localeCompare(b.name,'ar'))}var data=build(),results=document.getElementById('results'),search=document.getElementById('search'),heading=document.getElementById('heading');function render(){if(!data){results.textContent='ماكو بيانات محفوظة هنا. افتح التقرير من مواعيد التسديد بنفس المتصفح.';return}var q=clean(search.value),list=data.flatMap(x=>x.open.map(r=>({name:x.name,total:x.total,amount:r.open,days:r.days,date:r.invoiceDate,number:r.number||r.note||'بلا رقم'}))).filter(r=>!q||r.name.includes(q));list.sort((a,b)=>(b.days??-1)-(a.days??-1)||b.amount-a.amount||a.name.localeCompare(b.name,'ar'));heading.textContent='القوائم المستحقة — '+list.length+' قائمة';var sections=[];for(var i=buckets.length-1;i>=0;i--){var b=buckets[i],items=list.filter(r=>r.days!==null&&r.days>=b[1]&&r.days<=b[2]);if(items.length)sections.push('<section class="group"><h3>'+b[0]+' · '+items.length+' قائمة · '+money(items.reduce((n,r)=>n+r.amount,0))+'</h3>'+'<div class="table-scroll"><div class="ledger-head"><span>اسم الزبون</span><span>الرصيد الكلي</span><span>القائمة المستحقة</span><span>عدد الأيام</span><span>تاريخ القائمة</span></div>'+items.map(row).join('')+'</div><div class="drag-hint">↔ اسحب الجدول يمين ويسار لعرض كل الأعمدة</div></section>')}var unknown=list.filter(r=>r.days===null);if(unknown.length)sections.push('<section class="group"><h3>أرصدة بلا تاريخ قائمة · '+unknown.length+'</h3>'+'<div class="table-scroll"><div class="ledger-head"><span>اسم الزبون</span><span>الرصيد الكلي</span><span>القائمة المستحقة</span><span>عدد الأيام</span><span>تاريخ القائمة</span></div>'+unknown.map(row).join('')+'</div><div class="drag-hint">↔ اسحب الجدول يمين ويسار لعرض كل الأعمدة</div></section>');results.innerHTML=sections.join('')||'<p class="muted">ماكو قوائم مطابقة لهذا البحث.</p>'}function row(r){return '<div class="row ledger-row"><span class="customer-name">'+esc(r.name)+'</span><span>'+money(r.total)+'</span><span>'+money(r.amount)+'</span><span>'+(r.days===null?'غير معروف':r.days+' يوم')+'</span><span dir="ltr">'+esc(r.date||'غير معروف')+'</span></div>'}window.DueReportRows=function(){if(!data)return[];var q=clean(search.value);return data.flatMap(x=>x.open.map(r=>({name:x.name,total:x.total,amount:r.open,days:r.days,date:r.invoiceDate,number:r.number||r.note||'بلا رقم'}))).filter(r=>!q||r.name.includes(q)).sort((a,b)=>(b.days??-1)-(a.days??-1)||b.amount-a.amount||a.name.localeCompare(b.name,'ar'))};search.oninput=render;document.getElementById('summary').remove();render()})();</script><script defer src="due-report-export.js?v=20261122-2"></script></body></html>
