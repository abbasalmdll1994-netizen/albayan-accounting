<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b63"><title>تسديد المندوب | البيان</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#172b40;font-family:Tahoma,Arial,sans-serif}.top{background:#123b63;color:#fff;padding:14px;position:sticky;top:0}.wrap{max-width:720px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #d9e3ed;border-radius:14px;padding:14px;margin-bottom:10px}.balance{font-size:22px;font-weight:bold;color:#123b63;margin-top:6px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{border:1px solid #b9c8d7;background:#fff;border-radius:14px;padding:20px 10px;font-weight:bold;font-size:18px;color:#123b63}.choice small{display:block;font-size:11px;color:#66788a;margin-top:6px;font-weight:normal}.page{display:none}.page.on{display:block}.back{border:0;background:#e9eef3;border-radius:9px;padding:9px 12px}.amount{width:100%;min-height:55px;border:1px solid #aebed0;border-radius:11px;padding:8px;text-align:center;font-size:22px;margin:10px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.primary{border:0;background:#17834a;color:#fff;border-radius:11px;padding:13px;font-weight:bold}.cancel{border:1px solid #c7d3dd;background:#fff;border-radius:11px;padding:13px}.invoice{display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:1px solid #e2e8ee;padding:11px 0}.invoice:last-child{border-bottom:0}.muted{color:#66788a;font-size:12px}.review-line{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid #e5ebf0}.notice{display:none;padding:10px;border-radius:10px;background:#eaf7ef;color:#14663d;margin-bottom:10px}.notice.on{display:block}</style></head><body><header class="top"><b id="title">تسديد الزبون</b></header><main class="wrap"><div id="notice" class="notice"></div><section class="card"><b id="customer">الزبون</b><div id="balance" class="balance">0 د.ع</div></section><section id="home" class="page on"><div class="choices"><button class="choice" onclick="openFifo()">FIFO<small>تسديد أقدم فاتورة أولاً</small></button><button class="choice" onclick="openManual()">Manual<small>عرض الفواتير فقط</small></button></div></section><section id="fifo" class="page"><div class="card"><button class="back" onclick="showPage('home')">رجوع</button><h3>FIFO</h3><div class="muted">أدخل مبلغ التسديد فقط، والتوزيع يصير تلقائياً على أقدم الفواتير.</div><input id="amount" class="amount" type="number" min="1" step="1" inputmode="decimal" placeholder="مبلغ التسديد"><div class="actions"><button class="primary" onclick="reviewPayment()">إضافة</button><button class="cancel" onclick="showPage('home')">إلغاء</button></div></div></section><section id="manual" class="page"><div class="card"><button class="back" onclick="showPage('home')">رجوع</button><h3>الفواتير المستحقة</h3><div class="muted">للعرض فقط — التسديد يتم من FIFO.</div><div id="manualList"></div></div></section><section id="review" class="page"><div class="card"><button class="back" onclick="showPage('fifo')">رجوع</button><h3>مراجعة التسديد</h3><div id="reviewList"></div><div class="actions" style="margin-top:12px"><button class="primary" onclick="confirmPayment()">تأكيد</button><button class="cancel" onclick="showPage('fifo')">إلغاء</button></div></div></section></main><script>const WORK='albayanWorkspaceV1',RECEIPTS='albayanPaymentReceiptsV2';const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),fmt=n=>new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:2}).format(Number(n)||0)+' د.ع';const active=load('albayanRepActiveCustomer',null);const name=active?.name||new URLSearchParams(location.search).get('customer')||'الزبون';document.getElementById('customer').textContent=name;document.getElementById('title').textContent='تسديد · '+name;function workspace(){return load(WORK,{accounts:[],invoices:[]})}function invoiceTotal(v){return Number(v.total??v.grandTotal??((v.lines||[]).reduce((s,l)=>s+Number(l.quantity||0)*Number(l.price??l.cartonPrice??0),0))||0)}function openInvoices(){const w=workspace(),out=[];(w.invoices||[]).filter(v=>!v.cancelled&&v.customer===name).forEach(v=>{const total=invoiceTotal(v),paid=Number(v.paid||0),remaining=Math.max(0,total-paid);if(remaining>0)out.push({id:v.id||v.number,date:v.date||'',number:v.number||v.id||'فاتورة',remaining,source:'invoice'})});if(!out.length){(w.accounts||[]).filter(a=>a.customer===name&&Number(a.owedBy)>0).forEach(a=>out.push({id:a.id,date:a.date||'',number:a.receiptId||a.invoiceNo||'حركة حساب',remaining:Number(a.owedBy),source:'account'}))}out.sort((a,b)=>String(a.date).localeCompare(String(b.date)));return out}function currentBalance(){const w=workspace();let b=(w.accounts||[]).filter(a=>a.customer===name).reduce((s,a)=>s+Number(a.owedBy||0)-Number(a.owedTo||0),0);if(!(w.accounts||[]).some(a=>a.customer===name&&Number(a.owedBy)>0))b=openInvoices().reduce((s,x)=>s+x.remaining,0);return Math.max(0,b)}function refresh(){document.getElementById('balance').textContent='الرصيد: '+fmt(currentBalance())}function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===id))}function openFifo(){if(currentBalance()<=0){note('ماكو رصيد مستحق على هذا الزبون');return}document.getElementById('amount').value='';showPage('fifo')}function openManual(){const rows=openInvoices();document.getElementById('manualList').innerHTML=rows.length?rows.map(x=>'<div class="invoice"><div><b>'+x.number+'</b><div class="muted">'+x.date+'</div></div><b>'+fmt(x.remaining)+'</b></div>').join(''):'<p class="muted">ماكو فواتير مستحقة.</p>';showPage('manual')}let pending=null;function reviewPayment(){const amount=Number(document.getElementById('amount').value)||0,b=currentBalance();if(amount<=0){note('أدخل مبلغ التسديد');return}if(amount>b){note('مبلغ التسديد أكبر من الرصيد الحالي '+fmt(b));return}let left=amount;const allocations=[];for(const inv of openInvoices()){if(left<=0)break;const use=Math.min(left,inv.remaining);allocations.push({...inv,allocated:use});left-=use}pending={amount,before:b,after:b-amount,allocations};document.getElementById('reviewList').innerHTML='<div class="review-line"><b>قيمة التسديد</b><b>'+fmt(amount)+'</b></div>'+allocations.map(x=>'<div class="review-line"><span>'+x.number+'<small class="muted" style="display:block">'+x.date+'</small></span><b>'+fmt(x.allocated)+'</b></div>').join('')+'<div class="review-line"><b>الرصيد المتبقي</b><b>'+fmt(pending.after)+'</b></div>';showPage('review')}function confirmPayment(){if(!pending)return;const w=workspace(),now=new Date(),date=now.toISOString().slice(0,10),id=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()),number='RC-'+date.replaceAll('-','')+'-'+String(load(RECEIPTS,[]).length+1).padStart(3,'0');for(const a of pending.allocations){if(a.source==='invoice'){const v=(w.invoices||[]).find(x=>(x.id||x.number)===a.id);if(v)v.paid=Number(v.paid||0)+a.allocated}}w.accounts=w.accounts||[];w.accounts.push({id,receiptId:number,customer:name,date,note:'تسديد FIFO · '+number,owedTo:pending.amount,owedBy:0,source:'payment',allocations:pending.allocations.map(a=>({documentId:a.id,number:a.number,amount:a.allocated}))});save(WORK,w);const rs=load(RECEIPTS,[]);rs.push({id,number,customer:name,date,createdAt:now.toISOString(),amount:pending.amount,before:pending.before,after:pending.after,allocations:pending.allocations,status:'confirmed',syncStatus:'pending'});save(RECEIPTS,rs);note('تم تأكيد وحفظ سند القبض '+number);pending=null;refresh();setTimeout(()=>showPage('home'),900)}function note(t){const n=document.getElementById('notice');n.textContent=t;n.classList.add('on');setTimeout(()=>n.classList.remove('on'),2800)}refresh();</script></body></html>
