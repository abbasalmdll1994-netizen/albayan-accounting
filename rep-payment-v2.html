<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b63"><title>تسديد المندوب | البيان</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#172b40;font-family:Tahoma,Arial,sans-serif}.top{background:#123b63;color:#fff;padding:14px;position:sticky;top:0;display:flex;justify-content:space-between;align-items:center}.exit{border:1px solid #ffffff55;background:#ffffff18;color:#fff;border-radius:9px;padding:8px 11px;font:inherit}.wrap{max-width:620px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #d9e3ed;border-radius:15px;padding:16px;margin-bottom:12px}.customer{font-size:18px;font-weight:bold}.balance{font-size:25px;font-weight:bold;color:#123b63;margin:8px 0 16px}.label{display:block;font-weight:bold;margin-bottom:7px}.amount{width:100%;height:58px;border:1px solid #aebed0;border-radius:12px;padding:8px;text-align:center;font-size:24px;margin-bottom:12px}.primary,.share,.cancel,.next-save{width:100%;border:0;border-radius:11px;padding:14px;font-weight:bold;font-size:16px}.primary,.next-save{background:#17834a;color:#fff}.share{background:#123b63;color:#fff}.cancel{border:1px solid #c7d3dd;background:#fff;color:#123b63}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.notice{display:none;padding:11px;border-radius:10px;background:#fff0d8;color:#7a5200;margin-bottom:10px}.notice.on{display:block}.page{display:none}.page.on{display:block}.receipt{background:#fff;border:2px solid #123b63;border-radius:14px;padding:18px}.receipt h2{text-align:center;color:#123b63;margin:0 0 4px}.sub{text-align:center;margin-bottom:15px}.receipt-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed #cbd7e2}.next-card{background:#fff8e8;border:1px solid #ead39a;border-radius:14px;padding:14px;margin-top:12px}.next-card select{width:100%;height:50px;border:1px solid #c8b273;border-radius:10px;background:#fff;padding:8px;font:inherit;margin:9px 0}.receipt-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:18px;z-index:100}.modal.show{display:grid}.dialog{background:#fff;border-radius:16px;padding:20px;width:min(420px,100%);text-align:center}.dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.yes,.no{min-height:44px;border-radius:10px;font:inherit;font-weight:bold}.yes{border:0;background:#b83232;color:#fff}.no{border:1px solid #cbd7e2;background:#fff;color:#123b63}</style></head><body><header class="top"><b id="title">تسديد الزبون</b><button class="exit" onclick="requestExit()">خروج</button></header><main class="wrap"><div id="notice" class="notice"></div><section id="paymentPage" class="page on"><div class="card"><div id="customer" class="customer">الزبون</div><div id="balance" class="balance">الرصيد: 0 د.ع</div><label class="label" for="amount">مبلغ التسديد</label><input id="amount" class="amount" type="number" min="1" step="1" inputmode="decimal" placeholder="0"><div class="actions"><button class="primary" onclick="confirmSimplePayment()">تأكيد التسديد</button><button class="cancel" onclick="requestExit()">إلغاء</button></div></div></section><section id="receiptPage" class="page"><div class="receipt"><h2>مكتب القرية</h2><div class="sub">واسط - السوق الكبير<br><b>سند قبض</b></div><div id="receiptRows"></div></div><div id="nextCard" class="next-card" style="display:none"><b>📅 موعد التسديد القادم</b><div style="font-size:13px;margin-top:5px">باقي على الزبون رصيد. اختار يوم الزيارة القادمة.</div><select id="nextDay"><option value="0">الأحد</option><option value="1">الاثنين</option><option value="2">الثلاثاء</option><option value="3">الأربعاء</option><option value="4">الخميس</option><option value="5">الجمعة</option><option value="6">السبت</option></select><button class="next-save" onclick="saveNextDay()">حفظ الموعد القادم</button></div><div class="receipt-actions"><button class="share" onclick="shareReceipt()">إرسال / مشاركة</button><button class="cancel" onclick="returnAfterPayment()">رجوع</button></div></section></main><div id="exitModal" class="modal"><div class="dialog"><h3>هل تريد الخروج من الزبون؟</h3><div class="dialog-actions"><button class="yes" onclick="confirmExit()">نعم</button><button class="no" onclick="closeExit()">لا</button></div></div></div><script>const WORK='albayanWorkspaceV1',RECEIPTS='albayanPaymentReceiptsV2',LEGACY='albayanRepReceiptsV1',SCHEDULE='albayanPaymentScheduleV1';const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),num=n=>new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:2}).format(Number(n)||0),fmt=n=>num(n)+' د.ع';const qs=new URLSearchParams(location.search),fromSchedule=qs.get('from')==='schedule',scheduleId=qs.get('scheduleId'),active=load('albayanRepActiveCustomer',null),name=active?.name||qs.get('customer')||'الزبون';let currentReceipt=null,nextDaySaved=false;document.getElementById('customer').textContent=name;document.getElementById('title').textContent='تسديد · '+name;function workspace(){return load(WORK,{accounts:[],invoices:[]})}function invoiceTotal(v){return Number(v.total??v.grandTotal??((v.lines||[]).reduce((s,l)=>s+Number(l.quantity||0)*Number(l.price??l.cartonPrice??0),0))||0)}function openInvoices(){const w=workspace(),out=[];(w.invoices||[]).filter(v=>!v.cancelled&&v.customer===name).forEach(v=>{const total=invoiceTotal(v),paid=Number(v.paid||0),remaining=Math.max(0,total-paid);if(remaining>0)out.push({id:v.id||v.number,date:v.date||'',number:v.number||v.id||'فاتورة',remaining,source:'invoice'})});if(!out.length)(w.accounts||[]).filter(a=>a.customer===name&&Number(a.owedBy)>0).forEach(a=>out.push({id:a.id,date:a.date||'',number:a.receiptId||a.invoiceNo||'حركة حساب',remaining:Number(a.owedBy),source:'account'}));out.sort((a,b)=>String(a.date).localeCompare(String(b.date)));return out}function rawBalance(){const w=workspace();let b=(w.accounts||[]).filter(a=>a.customer===name).reduce((s,a)=>s+Number(a.owedBy||0)-Number(a.owedTo||0),0);if(!(w.accounts||[]).some(a=>a.customer===name&&Number(a.owedBy)>0))b=openInvoices().reduce((s,x)=>s+x.remaining,0);return b}function currentBalance(){return Math.max(0,rawBalance())}function refresh(){const b=rawBalance();document.getElementById('balance').textContent=b<0?'رصيد للزبون: '+fmt(-b):'الرصيد: '+fmt(b)}function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===id))}function repId(){const p=load('albayanRepProfileV1',{});return p.id||p.userCode||p.code||'rep-1'}function note(t){const n=document.getElementById('notice');n.textContent=t;n.classList.add('on');setTimeout(()=>n.classList.remove('on'),3000)}function removePaidSchedule(){if(!fromSchedule||!scheduleId)return;const a=load(SCHEDULE,[]);save(SCHEDULE,(Array.isArray(a)?a:[]).filter(x=>String(x.id)!==String(scheduleId)))}function confirmSimplePayment(){const amount=Number(document.getElementById('amount').value)||0,b=currentBalance();if(amount<=0)return note('أدخل مبلغ التسديد');if(amount>b)return note('مبلغ التسديد أكبر من الرصيد الحالي '+fmt(b));let left=amount,allocations=[];for(const inv of openInvoices()){if(left<=0)break;const use=Math.min(left,inv.remaining);allocations.push({...inv,allocated:use});left-=use}const after=Math.max(0,b-amount),w=workspace(),now=new Date(),date=now.toISOString().slice(0,10),id=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()),number='RC-'+date.replaceAll('-','')+'-'+String(load(RECEIPTS,[]).length+1).padStart(3,'0'),rid=repId();for(const a of allocations)if(a.source==='invoice'){const v=(w.invoices||[]).find(x=>(x.id||x.number)===a.id);if(v)v.paid=Number(v.paid||0)+a.allocated}w.accounts=w.accounts||[];const alloc=allocations.map(a=>({documentId:a.id,number:a.number,amount:a.allocated}));w.accounts.push({id,receiptId:number,customer:name,date,note:'تسديد FIFO بواسطة المندوب · سند '+number,owedTo:amount,owedBy:0,source:'payment',repId:rid,allocations:alloc});w.accounts.push({id:id+'-cash',receiptId:number,customer:'الصندوق',date,note:'قبض من '+name+' بواسطة المندوب · سند '+number,owedTo:0,owedBy:amount,source:'payment-cash',repId:rid,linkedPaymentId:id});save(WORK,w);currentReceipt={id,number,customer:name,date,time:now.toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'}),createdAt:now.toISOString(),amount,before:b,after,allocations:alloc,status:'confirmed',syncStatus:'pending',repId:rid,scheduleId:scheduleId||null};const rs=load(RECEIPTS,[]);rs.push(currentReceipt);save(RECEIPTS,rs);const legacy=load(LEGACY,[]);legacy.push({id,number,customer:name,date,createdAt:currentReceipt.createdAt,amount,balanceBefore:b,balanceAfter:after,repId:rid,status:'confirmed',source:'fifo-v2'});save(LEGACY,legacy);if(after<=0)removePaidSchedule();refresh();renderReceipt();showPage('receiptPage')}function renderReceipt(){const r=currentReceipt;if(!r)return;document.getElementById('receiptRows').innerHTML='<div class="receipt-row"><span>رقم السند</span><b>'+r.number+'</b></div><div class="receipt-row"><span>الزبون</span><b>'+r.customer+'</b></div><div class="receipt-row"><span>التاريخ</span><b>'+r.date+' · '+r.time+'</b></div><div class="receipt-row"><span>الرصيد السابق</span><b>'+fmt(r.before)+'</b></div><div class="receipt-row"><span>قيمة التسديد</span><b>'+fmt(r.amount)+'</b></div><div class="receipt-row"><span>الرصيد المتبقي</span><b>'+fmt(r.after)+'</b></div>';document.getElementById('nextCard').style.display=(fromSchedule&&r.after>0)?'block':'none';document.getElementById('nextDay').value=String((new Date()).getDay());nextDaySaved=false}function saveNextDay(){if(!currentReceipt||currentReceipt.after<=0)return;const a=load(SCHEDULE,[]),x=(Array.isArray(a)?a:[]).find(v=>String(v.id)===String(scheduleId));if(!x)return note('تعذر العثور على موعد الزبون');x.day=Number(document.getElementById('nextDay').value);x.updatedAt=(new Date()).toISOString();x.lastPartialReceiptId=currentReceipt.id;x.nextPaymentSetAt=x.updatedAt;save(SCHEDULE,a);nextDaySaved=true;document.getElementById('nextCard').style.display='none';note('تم حفظ موعد التسديد القادم')}async function receiptImage(r){const c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1080,1350);x.strokeStyle='#123b63';x.lineWidth=8;x.strokeRect(25,25,1030,1300);x.direction='rtl';x.textAlign='center';x.fillStyle='#123b63';x.font='bold 68px Tahoma,Arial';x.fillText('مكتب القرية',540,125);x.fillStyle='#172b40';x.font='34px Tahoma,Arial';x.fillText('واسط - السوق الكبير',540,180);x.font='bold 58px Tahoma,Arial';x.fillText('سند قبض',540,285);const row=(l,v,y)=>{x.textAlign='right';x.fillStyle='#66788a';x.font='30px Tahoma,Arial';x.fillText(l,950,y);x.fillStyle='#172b40';x.font='bold 38px Tahoma,Arial';x.fillText(v,950,y+52)};row('الزبون',r.customer,440);row('قيمة التسديد',fmt(r.amount),590);row('الرصيد السابق',fmt(r.before),740);row('الرصيد المتبقي',fmt(r.after),890);row('التاريخ',r.date+' · '+r.time,1040);return new Promise(res=>c.toBlob(res,'image/png',1))}async function shareReceipt(){const r=currentReceipt;if(!r)return;const text='مكتب القرية\nالزبون: '+r.customer+'\nتم استلام مبلغ '+fmt(r.amount)+'.\nالرصيد المتبقي: '+fmt(r.after)+'.\nسند قبض رقم: '+r.number;try{const blob=await receiptImage(r),file=new File([blob],'سند-قبض-'+r.number+'.png',{type:'image/png'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){await navigator.share({title:'سند قبض '+r.number,text,files:[file]});return}if(navigator.share){await navigator.share({title:'سند قبض '+r.number,text});return}await navigator.clipboard?.writeText(text);note('تم نسخ نص السند')}catch(e){if(e?.name!=='AbortError')note('السند محفوظ داخل البرنامج')}}function returnAfterPayment(){if(fromSchedule&&currentReceipt&&currentReceipt.after>0&&!nextDaySaved){document.getElementById('nextCard').style.display='block';return note('حدد موعد التسديد القادم أولاً')}if(fromSchedule)location.replace('payment-schedule.html?v=20260911-23');else location.replace('representative.html?v=20260911-16')}function requestExit(){document.getElementById('exitModal').classList.add('show')}function closeExit(){document.getElementById('exitModal').classList.remove('show')}function confirmExit(){localStorage.removeItem('albayanRepActiveCustomer');sessionStorage.removeItem('albayanCurrentCustomer');if(fromSchedule)location.replace('payment-schedule.html?v=20260911-23');else location.replace('representative.html?v=20260911-16')}history.pushState({customer:true},'',location.href);addEventListener('popstate',()=>{requestExit();history.pushState({customer:true},'',location.href)});refresh();if(currentBalance()<=0)note('ماكو رصيد مستحق على هذا الزبون');</script></body></html>
