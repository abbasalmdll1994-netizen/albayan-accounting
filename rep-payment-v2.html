<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b63"><title>تسديد المندوب | البيان</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#172b40;font-family:Tahoma,Arial,sans-serif}.top{background:#123b63;color:#fff;padding:14px;position:sticky;top:0}.wrap{max-width:720px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #d9e3ed;border-radius:14px;padding:14px;margin-bottom:10px}.balance{font-size:22px;font-weight:bold;color:#123b63;margin-top:6px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{border:1px solid #b9c8d7;background:#fff;border-radius:14px;padding:20px 10px;font-weight:bold;font-size:18px;color:#123b63}.choice small{display:block;font-size:11px;color:#66788a;margin-top:6px;font-weight:normal}.page{display:none}.page.on{display:block}.back{border:0;background:#e9eef3;border-radius:9px;padding:9px 12px}.amount{width:100%;min-height:55px;border:1px solid #aebed0;border-radius:11px;padding:8px;text-align:center;font-size:22px;margin:10px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.primary,.share{border:0;background:#17834a;color:#fff;border-radius:11px;padding:13px;font-weight:bold}.share{background:#123b63}.cancel{border:1px solid #c7d3dd;background:#fff;border-radius:11px;padding:13px}.invoice{display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:1px solid #e2e8ee;padding:11px 0}.invoice:last-child{border-bottom:0}.muted{color:#66788a;font-size:12px}.review-line{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid #e5ebf0}.notice{display:none;padding:10px;border-radius:10px;background:#eaf7ef;color:#14663d;margin-bottom:10px}.notice.on{display:block}.receipt{background:#fff;border:2px solid #123b63;border-radius:14px;padding:18px}.receipt h2{text-align:center;color:#123b63;margin:0 0 4px}.receipt .sub{text-align:center;margin-bottom:15px}.receipt-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed #cbd7e2}.receipt-row:last-child{border-bottom:0}.receipt-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}</style></head><body><header class="top"><b id="title">تسديد الزبون</b></header><main class="wrap"><div id="notice" class="notice"></div><section class="card"><b id="customer">الزبون</b><div id="balance" class="balance">0 د.ع</div></section><section id="home" class="page on"><div class="choices"><button class="choice" onclick="openFifo()">FIFO<small>تسديد أقدم فاتورة أولاً</small></button><button class="choice" onclick="openManual()">Manual<small>عرض الفواتير فقط</small></button></div></section><section id="fifo" class="page"><div class="card"><button class="back" onclick="showPage('home')">رجوع</button><h3>FIFO</h3><div class="muted">أدخل مبلغ التسديد فقط، والتوزيع يصير تلقائياً على أقدم الفواتير.</div><input id="amount" class="amount" type="number" min="1" step="1" inputmode="decimal" placeholder="مبلغ التسديد"><div class="actions"><button class="primary" onclick="reviewPayment()">إضافة</button><button class="cancel" onclick="showPage('home')">إلغاء</button></div></div></section><section id="manual" class="page"><div class="card"><button class="back" onclick="showPage('home')">رجوع</button><h3>الفواتير المستحقة</h3><div class="muted">للعرض فقط — التسديد يتم من FIFO.</div><div id="manualList"></div></div></section><section id="review" class="page"><div class="card"><button class="back" onclick="showPage('fifo')">رجوع</button><h3>مراجعة التسديد</h3><div id="reviewList"></div><div class="actions" style="margin-top:12px"><button class="primary" onclick="confirmPayment()">تأكيد</button><button class="cancel" onclick="showPage('fifo')">إلغاء</button></div></div></section><section id="receiptPage" class="page"><div class="receipt"><h2>مكتب القرية</h2><div class="sub">واسط - السوق الكبير<br><b>سند قبض</b></div><div id="receiptRows"></div></div><div class="receipt-actions"><button class="share" onclick="shareReceipt()">إرسال واتساب / مشاركة</button><button class="cancel" onclick="showPage('home')">رجوع</button></div></section></main><script>const WORK='albayanWorkspaceV1',RECEIPTS='albayanPaymentReceiptsV2';const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),num=n=>new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:2}).format(Number(n)||0),fmt=n=>num(n)+' د.ع';const active=load('albayanRepActiveCustomer',null);const name=active?.name||new URLSearchParams(location.search).get('customer')||'الزبون';document.getElementById('customer').textContent=name;document.getElementById('title').textContent='تسديد · '+name;function workspace(){return load(WORK,{accounts:[],invoices:[]})}function invoiceTotal(v){return Number(v.total??v.grandTotal??((v.lines||[]).reduce((s,l)=>s+Number(l.quantity||0)*Number(l.price??l.cartonPrice??0),0))||0)}function openInvoices(){const w=workspace(),out=[];(w.invoices||[]).filter(v=>!v.cancelled&&v.customer===name).forEach(v=>{const total=invoiceTotal(v),paid=Number(v.paid||0),remaining=Math.max(0,total-paid);if(remaining>0)out.push({id:v.id||v.number,date:v.date||'',number:v.number||v.id||'فاتورة',remaining,source:'invoice'})});if(!out.length){(w.accounts||[]).filter(a=>a.customer===name&&Number(a.owedBy)>0).forEach(a=>out.push({id:a.id,date:a.date||'',number:a.receiptId||a.invoiceNo||'حركة حساب',remaining:Number(a.owedBy),source:'account'}))}out.sort((a,b)=>String(a.date).localeCompare(String(b.date)));return out}function currentBalance(){const w=workspace();let b=(w.accounts||[]).filter(a=>a.customer===name).reduce((s,a)=>s+Number(a.owedBy||0)-Number(a.owedTo||0),0);if(!(w.accounts||[]).some(a=>a.customer===name&&Number(a.owedBy)>0))b=openInvoices().reduce((s,x)=>s+x.remaining,0);return Math.max(0,b)}function refresh(){document.getElementById('balance').textContent='الرصيد: '+fmt(currentBalance())}function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===id))}function openFifo(){if(currentBalance()<=0){note('ماكو رصيد مستحق على هذا الزبون');return}document.getElementById('amount').value='';showPage('fifo')}function openManual(){const rows=openInvoices();document.getElementById('manualList').innerHTML=rows.length?rows.map(x=>'<div class="invoice"><div><b>'+x.number+'</b><div class="muted">'+x.date+'</div></div><b>'+fmt(x.remaining)+'</b></div>').join(''):'<p class="muted">ماكو فواتير مستحقة.</p>';showPage('manual')}let pending=null,currentReceipt=null;function reviewPayment(){const amount=Number(document.getElementById('amount').value)||0,b=currentBalance();if(amount<=0){note('أدخل مبلغ التسديد');return}if(amount>b){note('مبلغ التسديد أكبر من الرصيد الحالي '+fmt(b));return}let left=amount;const allocations=[];for(const inv of openInvoices()){if(left<=0)break;const use=Math.min(left,inv.remaining);allocations.push({...inv,allocated:use});left-=use}pending={amount,before:b,after:b-amount,allocations};document.getElementById('reviewList').innerHTML='<div class="review-line"><b>قيمة التسديد</b><b>'+fmt(amount)+'</b></div>'+allocations.map(x=>'<div class="review-line"><span>'+x.number+'<small class="muted" style="display:block">'+x.date+'</small></span><b>'+fmt(x.allocated)+'</b></div>').join('')+'<div class="review-line"><b>الرصيد المتبقي</b><b>'+fmt(pending.after)+'</b></div>';showPage('review')}function confirmPayment(){if(!pending)return;const w=workspace(),now=new Date(),date=now.toISOString().slice(0,10),id=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()),number='RC-'+date.replaceAll('-','')+'-'+String(load(RECEIPTS,[]).length+1).padStart(3,'0');for(const a of pending.allocations){if(a.source==='invoice'){const v=(w.invoices||[]).find(x=>(x.id||x.number)===a.id);if(v)v.paid=Number(v.paid||0)+a.allocated}}w.accounts=w.accounts||[];w.accounts.push({id,receiptId:number,customer:name,date,note:'تسديد FIFO · '+number,owedTo:pending.amount,owedBy:0,source:'payment',allocations:pending.allocations.map(a=>({documentId:a.id,number:a.number,amount:a.allocated}))});save(WORK,w);currentReceipt={id,number,customer:name,date,time:now.toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'}),createdAt:now.toISOString(),amount:pending.amount,before:pending.before,after:pending.after,allocations:pending.allocations,status:'confirmed',syncStatus:'pending'};const rs=load(RECEIPTS,[]);rs.push(currentReceipt);save(RECEIPTS,rs);pending=null;refresh();renderReceipt();showPage('receiptPage')}function renderReceipt(){const r=currentReceipt;if(!r)return;document.getElementById('receiptRows').innerHTML='<div class="receipt-row"><span>رقم السند</span><b>'+r.number+'</b></div><div class="receipt-row"><span>الزبون</span><b>'+r.customer+'</b></div><div class="receipt-row"><span>التاريخ</span><b>'+r.date+' · '+r.time+'</b></div><div class="receipt-row"><span>الرصيد السابق</span><b>'+fmt(r.before)+'</b></div><div class="receipt-row"><span>قيمة التسديد</span><b>'+fmt(r.amount)+'</b></div><div class="receipt-row"><span>الرصيد المتبقي</span><b>'+fmt(r.after)+'</b></div>'}async function receiptImage(r){const c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1080,1350);x.strokeStyle='#123b63';x.lineWidth=8;x.strokeRect(25,25,1030,1300);x.direction='rtl';x.textAlign='center';x.fillStyle='#123b63';x.font='bold 68px Tahoma,Arial';x.fillText('مكتب القرية',540,125);x.fillStyle='#172b40';x.font='34px Tahoma,Arial';x.fillText('واسط - السوق الكبير',540,180);x.font='bold 58px Tahoma,Arial';x.fillText('سند قبض',540,285);x.fillStyle='#123b63';x.font='bold 38px Arial';x.fillText(r.number,540,345);const row=(l,v,y)=>{x.textAlign='right';x.fillStyle='#66788a';x.font='30px Tahoma,Arial';x.fillText(l,950,y);x.fillStyle='#172b40';x.font='bold 38px Tahoma,Arial';x.fillText(v,950,y+52);x.strokeStyle='#d9e3ed';x.lineWidth=2;x.beginPath();x.moveTo(120,y+78);x.lineTo(950,y+78);x.stroke()};row('الزبون',r.customer,440);row('قيمة التسديد',fmt(r.amount),590);row('الرصيد السابق',fmt(r.before),740);row('الرصيد المتبقي',fmt(r.after),890);row('التاريخ',r.date+' · '+r.time,1040);x.textAlign='center';x.fillStyle='#123b63';x.font='bold 30px Tahoma,Arial';x.fillText('تم الحفظ في برنامج البيان المحاسبي',540,1240);return new Promise(res=>c.toBlob(res,'image/png',1))}async function shareReceipt(){const r=currentReceipt;if(!r)return;const text='مكتب القرية\nالزبون: '+r.customer+'\nتم استلام مبلغ '+fmt(r.amount)+'.\nالرصيد المتبقي: '+fmt(r.after)+'.\nسند قبض رقم: '+r.number;try{const blob=await receiptImage(r),file=new File([blob],'سند-قبض-'+r.number+'.png',{type:'image/png'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){await navigator.share({title:'سند قبض '+r.number,text,files:[file]});return}if(navigator.share){await navigator.share({title:'سند قبض '+r.number,text});return}await navigator.clipboard?.writeText(text);note('تم نسخ نص السند. المشاركة المباشرة غير مدعومة على هذا الجهاز.')}catch(e){if(e?.name!=='AbortError')note('تعذر فتح المشاركة، السند محفوظ داخل البرنامج')}}function note(t){const n=document.getElementById('notice');n.textContent=t;n.classList.add('on');setTimeout(()=>n.classList.remove('on'),2800)}refresh();</script></body></html>
