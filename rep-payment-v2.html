<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b63"><title>تسديد المندوب | البيان</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#172b40;font-family:Tahoma,Arial,sans-serif}.top{background:#123b63;color:#fff;padding:14px;display:flex;justify-content:space-between}.wrap{max-width:620px;margin:auto;padding:12px}.card,.receipt{background:#fff;border:1px solid #d9e3ed;border-radius:15px;padding:16px;margin-bottom:12px}.balance{font-size:25px;font-weight:bold;color:#123b63;margin:8px 0 16px}.amount{width:100%;height:58px;border:1px solid #aebed0;border-radius:12px;text-align:center;font-size:24px}.primary,.share,.cancel,.next-save,.exit{border:0;border-radius:11px;padding:13px;font-weight:bold}.primary,.next-save{background:#17834a;color:#fff}.share{background:#123b63;color:#fff}.actions,.receipt-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.notice{display:none;padding:11px;background:#eaf7ef;color:#14663d;border-radius:10px}.notice.on{display:block}.page{display:none}.page.on{display:block}.receipt-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #cbd7e2}.next-card{display:none;background:#fff8e8;border:1px solid #ead39a;border-radius:14px;padding:14px;margin-top:12px}.next-card select{width:100%;height:50px;margin:9px 0}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:18px}.modal.show{display:grid}.dialog{background:#fff;border-radius:16px;padding:20px;width:min(420px,100%)}.dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}</style></head><body><header class="top"><b id="title">تسديد الزبون</b><button class="exit" onclick="requestExit()">خروج</button></header><main class="wrap"><div id="notice" class="notice"></div><section id="paymentPage" class="page on"><div class="card"><div id="customer"></div><div id="balance" class="balance"></div><input id="amount" class="amount" type="number" min="1" step="1" inputmode="decimal" placeholder="مبلغ التسديد"><div class="actions"><button class="primary" id="confirmBtn" onclick="confirmSimplePayment()">تأكيد التسديد</button><button class="cancel" onclick="requestExit()">إلغاء</button></div></div></section><section id="receiptPage" class="page"><div class="receipt"><h2>مكتب القرية</h2><div>واسط - السوق الكبير · سند قبض</div><div id="receiptRows"></div></div><div id="nextCard" class="next-card"><b>موعد التسديد القادم</b><select id="nextDay"><option value="0">الأحد</option><option value="1">الاثنين</option><option value="2">الثلاثاء</option><option value="3">الأربعاء</option><option value="4">الخميس</option><option value="5">الجمعة</option><option value="6">السبت</option></select><button class="next-save" onclick="saveNextDay()">حفظ الموعد القادم</button></div><div class="receipt-actions"><button class="share" onclick="shareReceipt()">إرسال السند</button><button class="cancel" onclick="returnAfterPayment()">تم / رجوع</button></div></section></main><div id="exitModal" class="modal"><div class="dialog"><h3>هل تريد الخروج من الزبون؟</h3><div class="dialog-actions"><button onclick="confirmExit()">نعم</button><button onclick="closeExit()">لا</button></div></div></div><script>const WORK='albayanWorkspaceV1',RECEIPTS='albayanPaymentReceiptsV2',LEGACY='albayanRepReceiptsV1',SCHEDULE='albayanPaymentScheduleV1';const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),fmt=n=>new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:2}).format(Number(n)||0)+' د.ع';const qs=new URLSearchParams(location.search),fromSchedule=qs.get('from')==='schedule',scheduleId=qs.get('scheduleId'),active=load('albayanRepActiveCustomer',null),name=active?.name||qs.get('customer')||'الزبون';let currentReceipt=null,nextDaySaved=false,saving=false;customer.textContent=name;title.textContent='تسديد · '+name;function workspace(){return load(WORK,{accounts:[],invoices:[]})}function invoiceTotal(v){const lines=(v.lines||[]).reduce((s,l)=>s+Number(l.quantity||0)*Number(l.price??l.cartonPrice??0),Number(v.loading||0));return Number(v.total??v.grandTotal??lines??0)}function openInvoices(){const w=workspace(),out=[];(w.invoices||[]).filter(v=>!v.cancelled&&v.customer===name).forEach(v=>{const remaining=Math.max(0,invoiceTotal(v)-Number(v.paid||0));if(remaining>0)out.push({id:v.id||v.number,date:v.date||'',number:v.number||v.id||'فاتورة',remaining,source:'invoice'})});if(!out.length)(w.accounts||[]).filter(a=>a.customer===name&&Number(a.owedBy)>0).forEach(a=>out.push({id:a.id,date:a.date||'',number:a.receiptId||a.invoiceNo||'حركة حساب',remaining:Number(a.owedBy),source:'account'}));out.sort((a,b)=>String(a.date).localeCompare(String(b.date)));return out}function rawBalance(){return openInvoices().reduce((s,x)=>s+Number(x.remaining||0),0)}function currentBalance(){return Math.max(0,rawBalance())}function refresh(){balance.textContent='الرصيد: '+fmt(currentBalance())}function showPage(id){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===id))}function repId(){const p=load('albayanRepProfileV1',{});return p.id||p.userCode||p.code||'rep-1'}function note(t){notice.textContent=t;notice.classList.add('on');setTimeout(()=>notice.classList.remove('on'),3000)}function localDate(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}function nextReceiptNumber(date){const prefix='RC-'+date.replaceAll('-','')+'-',max=load(RECEIPTS,[]).reduce((m,r)=>{const n=String(r.number||'');return n.startsWith(prefix)?Math.max(m,Number(n.slice(prefix.length))||0):m},0);return prefix+String(max+1).padStart(3,'0')}function removePaidSchedule(){if(!fromSchedule||!scheduleId)return;save(SCHEDULE,load(SCHEDULE,[]).filter(x=>String(x.id)!==String(scheduleId)))}function recoverReceiptFromPayment(){const w=workspace(),rs=load(RECEIPTS,[]),legacy=load(LEGACY,[]);let changed=false;for(const p of w.accounts||[]){if(p.source!=='payment'||!p.receiptId||rs.some(r=>String(r.id)===String(p.id)||String(r.number)===String(p.receiptId)))continue;const cash=(w.accounts||[]).find(a=>a.source==='payment-cash'&&String(a.linkedPaymentId||'')===String(p.id)),amount=Number(p.owedTo||cash?.owedBy||0);if(!(amount>0))continue;const before=Number(p.balanceBefore||0),after=Math.max(0,Number(p.balanceAfter??(before?before-amount:0)));const created=p.createdAt||new Date().toISOString(),r={id:p.id,number:p.receiptId,customer:p.customer,date:p.date||localDate(new Date(created)),time:new Date(created).toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'}),createdAt:created,amount,before,after,allocations:Array.isArray(p.allocations)?p.allocations:[],status:'confirmed',syncStatus:'pending',repId:p.repId||repId(),recovered:true};rs.push(r);if(!legacy.some(x=>String(x.id)===String(p.id)))legacy.push({id:p.id,number:p.receiptId,customer:p.customer,date:r.date,createdAt:created,amount,balanceBefore:before,balanceAfter:after,repId:r.repId,status:'confirmed',source:'fifo-v2-recovered'});changed=true}if(changed){save(RECEIPTS,rs);save(LEGACY,legacy)}return changed}function confirmSimplePayment(){if(saving)return;const amount=Number(document.getElementById('amount').value)||0,b=currentBalance();if(amount<=0)return note('أدخل مبلغ التسديد');if(amount>b+0.001)return note('مبلغ التسديد أكبر من الرصيد الحالي '+fmt(b));let left=amount,allocations=[];for(const inv of openInvoices()){if(left<=0.001)break;const use=Math.min(left,inv.remaining);allocations.push({...inv,allocated:use});left-=use}if(left>0.001)return note('تعذر توزيع كامل مبلغ التسديد. لم يتم الحفظ.');saving=true;confirmBtn.disabled=true;const w=workspace(),now=new Date(),date=localDate(now),id=crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),number=nextReceiptNumber(date),rid=repId();for(const a of allocations)if(a.source==='invoice'){const v=(w.invoices||[]).find(x=>String(x.id||x.number)===String(a.id));if(v)v.paid=Number(v.paid||0)+a.allocated}w.accounts=w.accounts||[];const alloc=allocations.map(a=>({documentId:a.id,number:a.number,amount:a.allocated,source:a.source})),after=Math.max(0,b-amount),createdAt=now.toISOString();w.accounts.push({id,receiptId:number,customer:name,date,note:'تسديد FIFO بواسطة المندوب · سند '+number,owedTo:amount,owedBy:0,source:'payment',repId:rid,allocations:alloc,balanceBefore:b,balanceAfter:after,createdAt});w.accounts.push({id:id+'-cash',receiptId:number,customer:'الصندوق',date,note:'قبض من '+name+' بواسطة المندوب · سند '+number,owedTo:0,owedBy:amount,source:'payment-cash',repId:rid,linkedPaymentId:id,createdAt});try{save(WORK,w)}catch(e){saving=false;confirmBtn.disabled=false;return note('تعذر حفظ التسديد. لم يتم الحفظ.')}currentReceipt={id,number,customer:name,date,time:now.toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'}),createdAt,amount,before:b,after,allocations:alloc,status:'confirmed',syncStatus:'pending',repId:rid,scheduleId:scheduleId||null};try{const rs=load(RECEIPTS,[]);if(!rs.some(r=>String(r.id)===String(id)))rs.push(currentReceipt);save(RECEIPTS,rs);const legacy=load(LEGACY,[]);if(!legacy.some(r=>String(r.id)===String(id)))legacy.push({id,number,customer:name,date,createdAt,amount,balanceBefore:b,balanceAfter:after,repId:rid,status:'confirmed',source:'fifo-v2'});save(LEGACY,legacy)}catch(e){note('تم حفظ الحساب، وسيتم استرجاع السند تلقائياً من حركة التسديد.')}if(after<=0)removePaidSchedule();refresh();renderReceipt();showPage('receiptPage')}function renderReceipt(){const r=currentReceipt;if(!r)return;receiptRows.innerHTML='<div class="receipt-row"><span>رقم السند</span><b>'+r.number+'</b></div><div class="receipt-row"><span>الزبون</span><b>'+r.customer+'</b></div><div class="receipt-row"><span>التاريخ</span><b>'+r.date+' · '+r.time+'</b></div><div class="receipt-row"><span>الرصيد السابق</span><b>'+fmt(r.before)+'</b></div><div class="receipt-row"><span>قيمة التسديد</span><b>'+fmt(r.amount)+'</b></div><div class="receipt-row"><span>الرصيد المتبقي</span><b>'+fmt(r.after)+'</b></div>';nextCard.style.display=(fromSchedule&&r.after>0)?'block':'none';nextDay.value=String(new Date().getDay());nextDaySaved=false}function saveNextDay(){if(!currentReceipt||currentReceipt.after<=0)return;const a=load(SCHEDULE,[]),x=a.find(v=>String(v.id)===String(scheduleId));if(!x)return note('تعذر العثور على موعد الزبون');x.day=Number(nextDay.value);x.updatedAt=new Date().toISOString();x.lastPartialReceiptId=currentReceipt.id;x.nextPaymentSetAt=x.updatedAt;save(SCHEDULE,a);nextDaySaved=true;nextCard.style.display='none';note('تم حفظ موعد التسديد القادم')}async function shareReceipt(){const r=currentReceipt;if(!r)return;const text='مكتب القرية\nالزبون: '+r.customer+'\nتم استلام مبلغ '+fmt(r.amount)+'.\nالرصيد المتبقي: '+fmt(r.after)+'.\nسند قبض رقم: '+r.number;try{if(navigator.share){await navigator.share({title:'سند قبض '+r.number,text});return}if(navigator.clipboard)await navigator.clipboard.writeText(text);note('تم نسخ نص السند للمشاركة')}catch(e){if(e&&e.name!=='AbortError')note('السند محفوظ داخل البرنامج')}}function mustSetNext(){return fromSchedule&&currentReceipt&&currentReceipt.after>0&&!nextDaySaved}function returnAfterPayment(){if(mustSetNext()){nextCard.style.display='block';return note('حدد موعد التسديد القادم أولاً')}goBack()}function requestExit(){if(mustSetNext()){nextCard.style.display='block';return note('حدد موعد التسديد القادم أولاً')}exitModal.classList.add('show')}function closeExit(){exitModal.classList.remove('show')}function goBack(){localStorage.removeItem('albayanRepActiveCustomer');sessionStorage.removeItem('albayanCurrentCustomer');location.replace(fromSchedule?'payment-schedule.html?v=20260917-62':'representative.html?v=20260917-62')}function confirmExit(){if(mustSetNext()){closeExit();nextCard.style.display='block';return note('حدد موعد التسديد القادم أولاً')}goBack()}recoverReceiptFromPayment();history.pushState({customer:true},'',location.href);addEventListener('popstate',()=>{requestExit();history.pushState({customer:true},'',location.href)});refresh();if(currentBalance()<=0)note('ماكو رصيد مستحق على هذا الزبون');</script></body></html>
