<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ربط قوائم الزبائن | البيان</title><style>body{font-family:Tahoma,Arial;background:#edf3f8;color:#17344e;max-width:650px;margin:0 auto;padding:24px}.card{background:white;padding:24px;border-radius:18px;margin-top:30px;line-height:1.8}a{color:#07579a;font-weight:bold}.ok{color:#126a3c}</style><div class="card"><h1>ربط قوائم الزبائن</h1><p id="status">جارِ تجهيز القوائم من كشوف الأمس…</p><a href="due-invoices.html?v=20261122-7">افتح كشف المستحقات</a></div><script>(async()=>{'use strict';const el=document.getElementById('status'),say=s=>el.textContent=s;try{const h=location.hash.slice(1);if(!h.startsWith('k='))throw Error('رابط الربط ناقص. افتحه من الرسالة كاملاً.');const b64=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(s.padEnd(Math.ceil(s.length/4)*4,'=')),c=>c.charCodeAt(0))};const key=await crypto.subtle.importKey('raw',b64(h.slice(2)),{name:'AES-GCM'},false,['decrypt']);const response=await fetch('due-documents-encrypted.json?v=20261122-1',{cache:'no-store'});if(!response.ok)throw Error('تعذر تنزيل القوائم. حاول بعد قليل.');const pack=await response.json();if(pack.format!=='albayan-due-encrypted-v1')throw Error('بيانات القوائم غير صالحة');const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(pack.nonce),additionalData:new TextEncoder().encode('albayan-due-documents-v1')},key,b64(pack.data));const d=JSON.parse(new TextDecoder().decode(raw)),workspace=JSON.parse(localStorage.getItem('albayanWorkspaceV1')||'null');if(!workspace||!Array.isArray(workspace.accounts))throw Error('افتح الرابط من نفس المتصفح الذي تعمل به على مواعيد التسديد.');if(d.format!=='albayan-due-documents-v1'||d.customers.length!==93)throw Error('قوائم الزبائن غير مكتملة');const names=new Set();for(const c of d.customers){if(!c.name||names.has(c.name)||!Array.isArray(c.documents)||c.documents.some(x=>!/^\d{4}-\d{2}-\d{2}$/.test(x.date)||!Number.isFinite(x.amount)||x.amount<=0)||c.documents.reduce((n,x)=>n+x.amount,0)!==Math.max(0,c.balance))throw Error('تعذر التحقق من قوائم الزبائن');names.add(c.name)}localStorage.setItem('albayanDueDocumentsV1',JSON.stringify(d));el.className='ok';say('تم ربط قوائم '+d.customers.length+' زبون. افتح كشف المستحقات من الرابط أدناه لتشوف القوائم مرتبة حسب الأيام.');}catch(e){say(e.message)}})()</script></html>
