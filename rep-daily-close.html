<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b63"><title>إغلاق يوم المندوب | مكتب القرية</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172b40;font-family:Tahoma,Arial,sans-serif}.top{background:#123b63;color:#fff;padding:18px}.wrap{max-width:820px;margin:auto}.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{margin:0;font-size:22px}.top a{color:#fff;text-decoration:none;border:1px solid #ffffff55;border-radius:9px;padding:8px 12px}.page{padding:14px}.panel,.card{background:#fff;border:1px solid #d9e3ed;border-radius:14px}.panel{padding:15px;margin-bottom:13px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:13px}.card{padding:14px}.card span{display:block;color:#627387;font-size:12px}.card strong{display:block;font-size:23px;margin-top:6px;color:#123b63}.card.green strong{color:#18864b}.card.orange strong{color:#b86d00}.btn{display:block;width:100%;text-align:center;text-decoration:none;border-radius:11px;min-height:52px;padding:14px;font-weight:bold;background:#123b63;color:#fff;margin-top:10px}.btn.green{background:#18864b}.status{padding:12px;border-radius:11px;background:#eef5fb;border-right:4px solid #1769aa;margin-bottom:12px}.list-row{padding:11px 0;border-bottom:1px solid #e3e9ef}.muted{color:#627387;font-size:12px}.ok{color:#18864b;font-weight:bold}.wait{color:#b86d00;font-weight:bold}@media(max-width:600px){.cards{grid-template-columns:1fr 1fr}.page{padding:10px}}</style></head><body><header class="top"><div class="wrap"><h1>إغلاق يوم المندوب</h1><a href="representative.html">رجوع</a></div></header><main class="page wrap"><section class="panel"><div id="date" class="muted"></div><h2 style="margin:8px 0">ملخص نهاية الجولة</h2><div class="cards"><div class="card"><span>إجمالي البيع اليوم</span><strong id="sales">0 د.ع</strong></div><div class="card green"><span>إجمالي التحصيل اليوم</span><strong id="collected">0 د.ع</strong></div><div class="card"><span>تم تسليمه للمحاسب</span><strong id="submitted">0 د.ع</strong></div><div class="card orange"><span>المتبقي بذمة المندوب</span><strong id="remaining">0 د.ع</strong></div></div><div id="status" class="status"></div><a id="handoverBtn" class="btn green" href="cash-handover.html?mode=rep">💵 تسليم التحصيل للمحاسب</a></section><section class="panel"><h2>حركة الجولة اليوم</h2><div class="cards"><div class="card"><span>زيارات مكتملة</span><strong id="done">0</strong></div><div class="card"><span>زيارات ملغاة</span><strong id="cancelled">0</strong></div></div><div id="rows"></div></section></main><script>const WORK='albayanWorkspaceV1',PENDING='albayanPendingInvoicesV1',HAND='albayanCashHandoversV1',VISITS='albayanRepVisitsV2';const $=id=>document.getElementById(id);function load(k,f){try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}}function today(){const d=new Date();return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function money(n){return new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:2}).format(Number(n)||0)}function invoiceTotal(v){return(v.lines||[]).reduce((s,l)=>s+Number(l.quantity||0)*Number(l.unit==='carton'?l.cartonPrice:l.unit==='dozen'?l.dozenPrice:l.piecePrice),Number(v.loading)||0)}function render(){const d=today(),w=load(WORK,{accounts:[],invoices:[]}),p=load(PENDING,[]),h=load(HAND,[]),vis=load(VISITS,[]);const posted=(w.invoices||[]).filter(v=>!v.cancelled&&v.date===d&&String(v.note||'').includes('المندوب'));const pend=(Array.isArray(p)?p:[]).filter(x=>x.source==='representative'&&x.invoice?.date===d);const sales=posted.reduce((s,v)=>s+invoiceTotal(v),0)+pend.reduce((s,x)=>s+invoiceTotal(x.invoice||{}),0);const collected=(w.accounts||[]).filter(a=>a.date===d&&(a.repId||a.receiptId||String(a.note||'').includes('المندوب'))).reduce((s,a)=>s+Number(a.owedTo||0),0);const todayH=(Array.isArray(h)?h:[]).filter(x=>x.date===d&&(x.status==='pending'||x.status==='received'));const submitted=todayH.reduce((s,x)=>s+Number(x.amount||0),0),remaining=Math.max(0,collected-submitted);$('sales').textContent=money(sales)+' د.ع';$('collected').textContent=money(collected)+' د.ع';$('submitted').textContent=money(submitted)+' د.ع';$('remaining').textContent=money(remaining)+' د.ع';$('date').textContent=new Date().toLocaleDateString('ar-IQ',{weekday:'long',year:'numeric',month:'long',day:'numeric'});const tv=(Array.isArray(vis)?vis:[]).filter(v=>v.date===d);$('done').textContent=tv.filter(v=>v.status==='done').length;$('cancelled').textContent=tv.filter(v=>v.status==='cancelled').length;$('rows').innerHTML=tv.length?tv.map(v=>'<div class="list-row"><b>'+String(v.customerName||'')+'</b><div class="muted">'+(v.status==='cancelled'?'ملغاة · '+String(v.reason||''):'تمت الزيارة')+'</div></div>').join(''):'<div class="muted">لا توجد حركات مسجلة اليوم.</div>';const pendingCash=todayH.filter(x=>x.status==='pending').reduce((s,x)=>s+Number(x.amount||0),0);if(remaining>0){$('status').innerHTML='باقي بذمة المندوب <b>'+money(remaining)+' د.ع</b> ويحتاج تسليم للمحاسب.';$('handoverBtn').style.display='block'}else if(pendingCash>0){$('status').innerHTML='<span class="wait">تم تسجيل التسليم وبانتظار تأكيد استلام المحاسب.</span>';$('handoverBtn').style.display='none'}else if(collected>0){$('status').innerHTML='<span class="ok">✓ تم تسوية تحصيل اليوم بالكامل مع المحاسب.</span>';$('handoverBtn').style.display='none'}else{$('status').textContent='لا يوجد تحصيل مسجل اليوم.';$('handoverBtn').style.display='none'}}window.addEventListener('storage',render);document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});render();</script></body></html>
