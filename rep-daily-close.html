<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b63"><title>إغلاق يوم المندوب | مكتب القرية</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172b40;font-family:Tahoma,Arial,sans-serif}.top{background:#123b63;color:#fff;padding:18px}.wrap{max-width:860px;margin:auto}.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{margin:0;font-size:22px}.top small{display:block;color:#d9e7f3;margin-top:3px}.top a{color:#fff;text-decoration:none;border:1px solid #ffffff55;border-radius:9px;padding:8px 12px}.page{padding:14px}.panel,.card{background:#fff;border:1px solid #d9e3ed;border-radius:14px}.panel{padding:15px;margin-bottom:13px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:13px}.card{padding:14px}.card span{display:block;color:#627387;font-size:12px}.card strong{display:block;font-size:23px;margin-top:6px;color:#123b63}.card.green strong{color:#18864b}.card.orange strong{color:#b86d00}.card.red strong{color:#b83232}.btn{display:block;width:100%;text-align:center;text-decoration:none;border-radius:11px;min-height:52px;padding:14px;font-weight:bold;background:#123b63;color:#fff;margin-top:10px}.btn.green{background:#18864b}.status{padding:12px;border-radius:11px;background:#eef5fb;border-right:4px solid #1769aa;margin-bottom:12px}.list-row{padding:11px 0;border-bottom:1px solid #e3e9ef}.muted{color:#627387;font-size:12px}.ok{color:#18864b;font-weight:bold}.wait{color:#b86d00;font-weight:bold}.bad{color:#b83232;font-weight:bold}@media(max-width:600px){.cards{grid-template-columns:1fr 1fr}.page{padding:10px}}</style></head><body><header class="top"><div class="wrap"><div><h1>إغلاق يوم المندوب</h1><small id="repLabel">المندوب</small></div><a href="representative-dashboard.html">رجوع</a></div></header><main class="page wrap"><section class="panel"><div id="date" class="muted"></div><h2 style="margin:8px 0">ملخص نهاية الجولة</h2><div class="cards"><div class="card"><span>إجمالي البيع اليوم</span><strong id="sales">0 د.ع</strong></div><div class="card green"><span>إجمالي التحصيل اليوم</span><strong id="collected">0 د.ع</strong></div><div class="card orange"><span>قيد التسليم للمحاسب</span><strong id="pendingAmount">0 د.ع</strong></div><div class="card green"><span>تم استلامه من المحاسب</span><strong id="receivedAmount">0 د.ع</strong></div><div class="card red"><span>المتبقي بذمة المندوب</span><strong id="remaining">0 د.ع</strong></div><div class="card"><span>سندات مرفوضة اليوم</span><strong id="rejectedCount">0</strong></div></div><div id="status" class="status"></div><a id="handoverBtn" class="btn green" href="cash-handover.html?mode=rep">💵 تسليم التحصيل للمحاسب</a></section><section class="panel"><h2>حركة الجولة اليوم</h2><div class="cards"><div class="card"><span>زيارات مكتملة</span><strong id="done">0</strong></div><div class="card"><span>زيارات ملغاة</span><strong id="cancelled">0</strong></div></div><div id="rows"></div></section></main><script>const WORK='albayanWorkspaceV1',PENDING='albayanPendingInvoicesV1',HAND='albayanCashHandoversV1',VISITS='albayanRepVisitsV2',PROFILE='albayanRepProfileV1';const $=id=>document.getElementById(id);function load(k,f){try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}}function profile(){const p=load(PROFILE,{id:'rep-1',name:'عباس'});return{id:String(p.id||'rep-1'),name:String(p.name||'عباس')}}function belongs(obj,p){const rid=obj?.repId||obj?.invoice?.repId||'';if(rid)return String(rid)===p.id;const rn=obj?.repName||obj?.invoice?.repName||'';if(rn)return String(rn)===p.name;return true}function today(){const d=new Date();return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function money(n){return new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:2}).format(Number(n)||0)}function invoiceTotal(v){return(v.lines||[]).reduce((s,l)=>s+Number(l.quantity||0)*Number(l.unit==='carton'?l.cartonPrice:l.unit==='dozen'?l.dozenPrice:l.piecePrice),Number(v.loading)||0)}function render(){const rp=profile(),d=today(),w=load(WORK,{accounts:[],invoices:[]}),p=load(PENDING,[]),h=load(HAND,[]),vis=load(VISITS,[]);$('repLabel').textContent='المندوب: '+rp.name;const posted=(w.invoices||[]).filter(v=>!v.cancelled&&v.date===d&&String(v.note||'').includes('المندوب')&&belongs(v,rp));const pend=(Array.isArray(p)?p:[]).filter(x=>x.source==='representative'&&x.invoice?.date===d&&belongs(x,rp));const sales=posted.reduce((s,v)=>s+invoiceTotal(v),0)+pend.reduce((s,x)=>s+invoiceTotal(x.invoice||{}),0);const collected=(w.accounts||[]).filter(a=>a.date===d&&(a.repId||a.receiptId||String(a.note||'').includes('المندوب'))&&belongs(a,rp)).reduce((s,a)=>s+Number(a.owedTo||0),0);const allH=(Array.isArray(h)?h:[]).filter(x=>x.date===d&&belongs(x,rp)),pendingH=allH.filter(x=>x.status==='pending'),receivedH=allH.filter(x=>x.status==='received'),rejectedH=allH.filter(x=>x.status==='rejected'),pendingAmount=pendingH.reduce((s,x)=>s+Number(x.amount||0),0),receivedAmount=receivedH.reduce((s,x)=>s+Number(x.amount||0),0),remaining=Math.max(0,collected-pendingAmount-receivedAmount);$('sales').textContent=money(sales)+' د.ع';$('collected').textContent=money(collected)+' د.ع';$('pendingAmount').textContent=money(pendingAmount)+' د.ع';$('receivedAmount').textContent=money(receivedAmount)+' د.ع';$('remaining').textContent=money(remaining)+' د.ع';$('rejectedCount').textContent=rejectedH.length;$('date').textContent=new Date().toLocaleDateString('ar-IQ',{weekday:'long',year:'numeric',month:'long',day:'numeric'});const tv=(Array.isArray(vis)?vis:[]).filter(v=>v.date===d&&belongs(v,rp));$('done').textContent=tv.filter(v=>v.status==='done').length;$('cancelled').textContent=tv.filter(v=>v.status==='cancelled').length;$('rows').innerHTML=tv.length?tv.map(v=>'<div class="list-row"><b>'+String(v.customerName||'')+'</b><div class="muted">'+(v.status==='cancelled'?'ملغاة · '+String(v.reason||''):'تمت الزيارة')+'</div></div>').join(''):'<div class="muted">لا توجد حركات مسجلة اليوم.</div>';if(remaining>0){$('status').innerHTML='باقي بذمة '+rp.name+' <b>'+money(remaining)+' د.ع</b> ويحتاج تسليم للمحاسب.'+(rejectedH.length?' <span class="bad">يوجد '+rejectedH.length+' سند مرفوض اليوم.</span>':'');$('handoverBtn').style.display='block'}else if(pendingAmount>0){$('status').innerHTML='<span class="wait">تم تسجيل '+money(pendingAmount)+' د.ع للتسليم وبانتظار تأكيد استلام المحاسب.</span>';$('handoverBtn').style.display='none'}else if(collected>0&&receivedAmount>=collected){$('status').innerHTML='<span class="ok">✓ تم استلام تحصيل اليوم بالكامل من المحاسب.</span>';$('handoverBtn').style.display='none'}else{$('status').textContent='لا يوجد تحصيل مسجل اليوم لهذا المندوب.';$('handoverBtn').style.display='none'}}window.addEventListener('storage',render);document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});render();</script></body></html>
