<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b63"><title>ترتيب الجولة | مكتب القرية</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172b40;font-family:Tahoma,Arial,sans-serif}.top{background:#123b63;color:#fff;padding:16px}.wrap{max-width:760px;margin:auto}.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{margin:0;font-size:21px}.back{color:#fff;text-decoration:none;border:1px solid #ffffff55;border-radius:9px;padding:8px 12px}.page{padding:12px}.panel,.row,.stat{background:#fff;border:1px solid #d9e3ed;border-radius:14px}.panel{padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{display:block;font-size:12px;color:#627387;margin-bottom:5px}.field select{width:100%;min-height:45px;border:1px solid #afc0d0;border-radius:10px;padding:8px 10px;background:#fff;font:inherit}.notice{background:#eef5fb;border-right:4px solid #1769aa;padding:10px;border-radius:9px;margin-top:10px;font-size:13px}.current{background:#edf8f0;border-right-color:#18864b;color:#145c38;font-weight:bold}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}.stat{padding:11px;text-align:center}.stat span{display:block;color:#627387;font-size:11px}.stat strong{display:block;color:#123b63;font-size:18px;margin-top:4px}.daynav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.daynav button{min-height:42px}.todaybar,.copybar{margin-top:10px}.todaybar button,.copybar button{width:100%;min-height:42px;font-weight:bold}.row{padding:12px;margin-bottom:9px;display:grid;grid-template-columns:44px minmax(0,1fr) 96px;gap:9px;align-items:center}.num{width:40px;height:40px;border-radius:50%;background:#edf3f8;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#123b63}.name b{display:block}.muted{color:#627387;font-size:12px;margin-top:3px}.moves{display:grid;grid-template-columns:1fr 1fr;gap:5px}.btn{border:1px solid #c6d2de;background:#fff;color:#123b63;border-radius:9px;min-height:38px;font:inherit}.btn.primary{background:#123b63;color:#fff;border-color:#123b63}.btn:disabled{opacity:.35}.empty{text-align:center;padding:25px;background:#fff;border:1px dashed #b9c7d4;border-radius:14px;color:#627387}.savebar{position:sticky;bottom:0;padding:10px;background:#f3f6fa}.save{width:100%;min-height:48px;border:0;border-radius:11px;background:#123b63;color:#fff;font-weight:bold;font:inherit}.saved{background:#18864b!important}.hint{text-align:center;color:#627387;font-size:11px;margin-top:6px}.hidden{display:none!important}@media(max-width:560px){.grid{grid-template-columns:1fr}.row{grid-template-columns:40px minmax(0,1fr) 88px}.stats{grid-template-columns:1fr 1fr 1fr}}</style></head><body><header class="top"><div class="wrap toprow"><div><h1>ترتيب الجولة اليومية</h1><div style="font-size:12px;color:#d8e6f2;margin-top:4px">مكتب القرية</div></div><a class="back" href="admin-control.html">رجوع للإدارة</a></div></header><main class="page wrap"><div class="panel"><div class="grid"><div class="field"><label>الأسبوع</label><select id="week"><option value="1">الأسبوع الأول</option><option value="2">الأسبوع الثاني</option></select></div><div class="field"><label>اليوم</label><select id="day"><option value="6">السبت</option><option value="0">الأحد</option><option value="1">الاثنين</option><option value="2">الثلاثاء</option><option value="3">الأربعاء</option><option value="4">الخميس</option></select></div></div><div id="cycleNote" class="notice"></div><div id="currentNote" class="notice current"></div><div class="todaybar"><button id="openToday" class="btn primary">عرض جولة اليوم الحالية</button></div><div class="daynav"><button id="prevDay" class="btn">→ اليوم السابق</button><button id="nextDay" class="btn">اليوم التالي ←</button></div><div id="copyBar" class="copybar hidden"><button id="copyWeek" class="btn">نسخ الأسبوع الأول بالكامل إلى الأسبوع الثاني</button></div></div><div class="stats"><div class="stat"><span>الأسبوع</span><strong id="statWeek">الأول</strong></div><div class="stat"><span>اليوم</span><strong id="statDay">السبت</strong></div><div class="stat"><span>عدد الزبائن</span><strong id="statCount">0</strong></div></div><div id="list"></div><div class="savebar"><button id="save" class="save">حفظ الترتيب</button><div class="hint">الترتيب محفوظ لكل يوم بشكل مستقل، والتغييرات تُحفظ تلقائياً بعد كل حركة.</div></div></main><script>const ROUTE='albayanRepresentativeRouteV1',CFG='albayanRouteCycleV1',$=id=>document.getElementById(id),dayValues=[6,0,1,2,3,4],dayNames={6:'السبت',0:'الأحد',1:'الاثنين',2:'الثلاثاء',3:'الأربعاء',4:'الخميس',5:'الجمعة'};let ordered=[];function load(k,f){try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function ymd(d){return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function currentSaturday(){const d=new Date();d.setHours(12,0,0,0);const back=(d.getDay()-6+7)%7;d.setDate(d.getDate()-back);return ymd(d)}function config(){const c=load(CFG,{cycleDays:7,cycleStart:''});return{cycleDays:Number(c.cycleDays)===14?14:7,cycleStart:c.cycleStart||''}}function activeWeek(){const c=config();if(c.cycleDays!==14)return 1;const start=new Date((c.cycleStart||currentSaturday())+'T12:00:00'),now=new Date();now.setHours(12,0,0,0);const days=Math.floor((now-start)/86400000),week=Math.floor(days/7);return((week%2)+2)%2+1}function daysFor(c,w){if(config().cycleDays===14){const k=w===2?'visitDaysWeek2':'visitDaysWeek1';return Array.isArray(c[k])?c[k]:(Array.isArray(c.visitDays)?c.visitDays:[])}return Array.isArray(c.visitDays)?c.visitDays:[]}function daySeqKey(w){return config().cycleDays===14?(w===2?'routeSequenceByDayWeek2':'routeSequenceByDayWeek1'):'routeSequenceByDay'}function seqFor(c,w,d){const map=c&&typeof c[daySeqKey(w)]==='object'&&c[daySeqKey(w)]?c[daySeqKey(w)]:{},specific=Number(map[String(d)]);if(specific>0)return specific;if(config().cycleDays===14){const k=w===2?'routeSequenceWeek2':'routeSequenceWeek1';return Number(c[k])||Number(c.routeSequence)||999999}return Number(c.routeSequence)||999999}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function renderCurrent(){const c=config(),w=activeWeek(),d=new Date().getDay();$('currentNote').textContent=d===5?'اليوم الجمعة: ماكو جولة يومية محددة، والجولة الكلية تبقى فعالة.':'جولة المندوب اليوم: '+dayNames[d]+(c.cycleDays===14?' · الأسبوع '+(w===1?'الأول':'الثاني'):'')+' · اضغط «عرض جولة اليوم الحالية» حتى تشوف نفس ترتيب المندوب.'}function render(){const cfg=config();$('week').disabled=cfg.cycleDays!==14;$('copyBar').classList.toggle('hidden',cfg.cycleDays!==14);if(cfg.cycleDays!==14)$('week').value='1';const w=Number($('week').value),d=Number($('day').value);$('cycleNote').textContent=cfg.cycleDays===14?'النظام حالياً دورة أسبوعين. ترتيب كل يوم محفوظ بصورة مستقلة داخل كل أسبوع.':'النظام حالياً أسبوع واحد. ترتيب كل يوم محفوظ بصورة مستقلة ويتكرر أسبوعياً.';renderCurrent();const all=load(ROUTE,[]);ordered=(Array.isArray(all)?all:[]).filter(c=>daysFor(c,w).includes(d)).sort((a,b)=>seqFor(a,w,d)-seqFor(b,w,d)||String(a.name||'').localeCompare(String(b.name||''),'ar'));$('statWeek').textContent=cfg.cycleDays===14?(w===1?'الأول':'الثاني'):'واحد';$('statDay').textContent=dayNames[d]||'';$('statCount').textContent=ordered.length;drawOnly()}function drawOnly(){$('statCount').textContent=ordered.length;$('list').innerHTML=ordered.length?ordered.map((c,i)=>'<div class="row"><div class="num">'+(i+1)+'</div><div class="name"><b>'+esc(c.name)+'</b><div class="muted">'+esc(c.area||'')+' · '+esc(c.type||'')+'</div></div><div class="moves"><button class="btn" data-up="'+i+'" '+(i===0?'disabled':'')+'>▲</button><button class="btn" data-down="'+i+'" '+(i===ordered.length-1?'disabled':'')+'>▼</button></div></div>').join(''):'<div class="empty">لا يوجد زبائن معيّنين لهذا اليوم.</div>';document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(Number(b.dataset.up),-1));document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>move(Number(b.dataset.down),1))}function persist(showAlert=false){const all=load(ROUTE,[]),w=Number($('week').value),d=Number($('day').value),key=daySeqKey(w),now=new Date().toISOString();ordered.forEach((c,i)=>{const x=all.find(a=>String(a.id)===String(c.id));if(!x)return;x[key]=x[key]&&typeof x[key]==='object'?x[key]:{};x[key][String(d)]=i+1;x.updatedAt=now});save(ROUTE,all);$('save').classList.add('saved');$('save').textContent='✓ تم الحفظ';setTimeout(()=>{$('save').classList.remove('saved');$('save').textContent='حفظ الترتيب'},1000);if(showAlert)alert('تم حفظ ترتيب جولة '+dayNames[d]+' بشكل مستقل.')}function move(i,delta){const j=i+delta;if(j<0||j>=ordered.length)return;[ordered[i],ordered[j]]=[ordered[j],ordered[i]];drawOnly();persist(false)}function changeDay(delta){let i=dayValues.indexOf(Number($('day').value));i=Math.max(0,Math.min(dayValues.length-1,i+delta));$('day').value=String(dayValues[i]);render()}function openToday(){const d=new Date().getDay();if(d===5)return alert('اليوم الجمعة، ماكو جولة يومية محددة.');$('day').value=String(d);$('week').value=String(activeWeek());render()}function copyWeek(){if(config().cycleDays!==14)return;if(!confirm('نسخ جميع أيام وترتيب الأسبوع الأول إلى الأسبوع الثاني؟'))return;const all=load(ROUTE,[]),now=new Date().toISOString();for(const c of all){c.visitDaysWeek2=Array.isArray(c.visitDaysWeek1)?[...c.visitDaysWeek1]:(Array.isArray(c.visitDays)?[...c.visitDays]:[]);c.routeSequenceByDayWeek2=c.routeSequenceByDayWeek1&&typeof c.routeSequenceByDayWeek1==='object'?{...c.routeSequenceByDayWeek1}:{};const n=Number(c.routeSequenceWeek1)||Number(c.routeSequence)||0;if(n>0)c.routeSequenceWeek2=n;else delete c.routeSequenceWeek2;c.updatedAt=now}save(ROUTE,all);$('week').value='2';alert('تم نسخ الأسبوع الأول إلى الأسبوع الثاني، بما فيه ترتيب كل يوم.');render()}$('week').onchange=render;$('day').onchange=render;$('save').onclick=()=>persist(true);$('prevDay').onclick=()=>changeDay(-1);$('nextDay').onclick=()=>changeDay(1);$('openToday').onclick=openToday;$('copyWeek').onclick=copyWeek;window.addEventListener('storage',e=>{if([ROUTE,CFG].includes(e.key))render()});render();</script></body></html>
