<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b63"><title>ترتيب الجولة | مكتب القرية</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172b40;font-family:Tahoma,Arial,sans-serif}.top{background:#123b63;color:#fff;padding:16px}.wrap{max-width:760px;margin:auto}.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{margin:0;font-size:21px}.back{color:#fff;text-decoration:none;border:1px solid #ffffff55;border-radius:9px;padding:8px 12px}.page{padding:12px}.panel,.row{background:#fff;border:1px solid #d9e3ed;border-radius:14px}.panel{padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{display:block;font-size:12px;color:#627387;margin-bottom:5px}.field select{width:100%;min-height:45px;border:1px solid #afc0d0;border-radius:10px;padding:8px 10px;background:#fff;font:inherit}.notice{background:#eef5fb;border-right:4px solid #1769aa;padding:10px;border-radius:9px;margin-top:10px;font-size:13px}.row{padding:12px;margin-bottom:9px;display:grid;grid-template-columns:44px minmax(0,1fr) 96px;gap:9px;align-items:center}.num{width:40px;height:40px;border-radius:50%;background:#edf3f8;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#123b63}.name b{display:block}.muted{color:#627387;font-size:12px;margin-top:3px}.moves{display:grid;grid-template-columns:1fr 1fr;gap:5px}.btn{border:1px solid #c6d2de;background:#fff;color:#123b63;border-radius:9px;min-height:38px;font:inherit}.btn:disabled{opacity:.35}.empty{text-align:center;padding:25px;background:#fff;border:1px dashed #b9c7d4;border-radius:14px;color:#627387}.savebar{position:sticky;bottom:0;padding:10px;background:#f3f6fa}.save{width:100%;min-height:48px;border:0;border-radius:11px;background:#123b63;color:#fff;font-weight:bold;font:inherit}@media(max-width:560px){.grid{grid-template-columns:1fr}.row{grid-template-columns:40px minmax(0,1fr) 88px}}</style></head><body><header class="top"><div class="wrap toprow"><div><h1>ترتيب الجولة اليومية</h1><div style="font-size:12px;color:#d8e6f2;margin-top:4px">مكتب القرية</div></div><a class="back" href="admin-control.html">رجوع للإدارة</a></div></header><main class="page wrap"><div class="panel"><div class="grid"><div class="field"><label>الأسبوع</label><select id="week"><option value="1">الأسبوع الأول</option><option value="2">الأسبوع الثاني</option></select></div><div class="field"><label>اليوم</label><select id="day"><option value="6">السبت</option><option value="0">الأحد</option><option value="1">الاثنين</option><option value="2">الثلاثاء</option><option value="3">الأربعاء</option><option value="4">الخميس</option></select></div></div><div id="cycleNote" class="notice"></div></div><div id="list"></div><div class="savebar"><button id="save" class="save">حفظ الترتيب</button></div></main><script>const ROUTE='albayanRepresentativeRouteV1',CFG='albayanRouteCycleV1',$=id=>document.getElementById(id);let ordered=[];function load(k,f){try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function config(){const c=load(CFG,{cycleDays:7});return{cycleDays:Number(c.cycleDays)===14?14:7}}function daysFor(c,w){if(config().cycleDays===14){const k=w===2?'visitDaysWeek2':'visitDaysWeek1';return Array.isArray(c[k])?c[k]:(Array.isArray(c.visitDays)?c.visitDays:[])}return Array.isArray(c.visitDays)?c.visitDays:[]}function seqFor(c,w){if(config().cycleDays===14){const k=w===2?'routeSequenceWeek2':'routeSequenceWeek1';return Number(c[k])||Number(c.routeSequence)||999999}return Number(c.routeSequence)||999999}function render(){const w=Number($('week').value),d=Number($('day').value),cfg=config();$('week').disabled=cfg.cycleDays!==14;if(cfg.cycleDays!==14)$('week').value='1';$('cycleNote').textContent=cfg.cycleDays===14?'النظام حالياً دورة أسبوعين. رتّب زبائن كل يوم لكل أسبوع بشكل مستقل.':'النظام حالياً أسبوع واحد. ترتيب هذا الأسبوع يتكرر تلقائياً كل أسبوع.';const all=load(ROUTE,[]);ordered=(Array.isArray(all)?all:[]).filter(c=>daysFor(c,w).includes(d)).sort((a,b)=>seqFor(a,w)-seqFor(b,w)||String(a.name||'').localeCompare(String(b.name||''),'ar'));$('list').innerHTML=ordered.length?ordered.map((c,i)=>'<div class="row"><div class="num">'+(i+1)+'</div><div class="name"><b>'+esc(c.name)+'</b><div class="muted">'+esc(c.area||'')+' · '+esc(c.type||'')+'</div></div><div class="moves"><button class="btn" data-up="'+i+'" '+(i===0?'disabled':'')+'>▲</button><button class="btn" data-down="'+i+'" '+(i===ordered.length-1?'disabled':'')+'>▼</button></div></div>').join(''):'<div class="empty">لا يوجد زبائن معيّنين لهذا اليوم.</div>';document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(Number(b.dataset.up),-1));document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>move(Number(b.dataset.down),1))}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function move(i,delta){const j=i+delta;if(j<0||j>=ordered.length)return;[ordered[i],ordered[j]]=[ordered[j],ordered[i]];drawOnly()}function drawOnly(){$('list').innerHTML=ordered.length?ordered.map((c,i)=>'<div class="row"><div class="num">'+(i+1)+'</div><div class="name"><b>'+esc(c.name)+'</b><div class="muted">'+esc(c.area||'')+' · '+esc(c.type||'')+'</div></div><div class="moves"><button class="btn" data-up="'+i+'" '+(i===0?'disabled':'')+'>▲</button><button class="btn" data-down="'+i+'" '+(i===ordered.length-1?'disabled':'')+'>▼</button></div></div>').join(''):'<div class="empty">لا يوجد زبائن معيّنين لهذا اليوم.</div>';document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>move(Number(b.dataset.up),-1));document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>move(Number(b.dataset.down),1))}function saveOrder(){const all=load(ROUTE,[]),w=Number($('week').value),cfg=config(),now=new Date().toISOString();ordered.forEach((c,i)=>{const x=all.find(a=>String(a.id)===String(c.id));if(!x)return;const n=i+1;if(cfg.cycleDays===14)x[w===2?'routeSequenceWeek2':'routeSequenceWeek1']=n;else x.routeSequence=n;x.updatedAt=now});save(ROUTE,all);alert('تم حفظ ترتيب الجولة.');render()}$('week').onchange=render;$('day').onchange=render;$('save').onclick=saveOrder;window.addEventListener('storage',e=>{if([ROUTE,CFG].includes(e.key))render()});render();</script></body></html>
