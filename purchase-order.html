<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b63"><title>طلبية الشراء | مكتب القرية</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17304d;font-family:Tahoma,Arial,sans-serif}.head{background:#123b63;color:#fff;padding:18px 20px}.headin{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand b{font-size:27px;display:block}.brand small{color:#d9e8f5}.date{font-size:14px}.wrap{max-width:1100px;margin:auto;padding:20px 14px 110px}.titlebar{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}.titlebar h1{font-size:27px;margin:0;color:#123b63}.titlebar p{margin:4px 0;color:#65788c}.count{min-width:100px;text-align:center;background:#fff0f0;color:#a52727;border:1px solid #f0caca;border-radius:15px;padding:9px}.count b{font-size:24px;display:block}.panel{background:#fff;border:1px solid #d7e1eb;border-radius:17px;overflow:hidden;box-shadow:0 4px 15px rgba(18,59,99,.05)}.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:690px}th{background:#eaf3fb;color:#123b63;padding:13px 10px;text-align:center}td{padding:11px 9px;border-top:1px solid #e2e8ef;text-align:center}.name{text-align:right;font-weight:bold}.stock{display:inline-block;min-width:50px;padding:7px;border-radius:9px;background:#ffeaea;color:#a52727;font-weight:bold}.qty{width:85px;padding:8px;border:1px solid #bdcad7;border-radius:9px;text-align:center;font:inherit}.btn{border:0;border-radius:9px;padding:8px 12px;color:#fff;font:inherit;font-weight:bold;margin:2px}.accept{background:#16804b}.reject{background:#c43b3b}.selected{background:#f1fbf5}.rejected{opacity:.45;background:#fafafa}.actions{display:flex;gap:10px;justify-content:flex-start;padding:15px;border-top:1px solid #dfe7ef;flex-wrap:wrap}.big{border:0;border-radius:10px;padding:12px 18px;color:#fff;font:inherit;font-weight:bold}.approve{background:#16804b}.rejectall{background:#c43b3b}.empty{padding:45px 15px;text-align:center;color:#65788c}.back{display:inline-block;margin-top:16px;color:#123b63;text-decoration:none;font-weight:bold}.bottom{position:fixed;bottom:0;left:0;right:0;background:#123b63;color:#fff;display:flex;justify-content:center;z-index:5}.bottom a{color:#e8f1f8;text-decoration:none;text-align:center;padding:12px 22px;min-width:110px}.bottom a.active{background:#1c75b5}.bottom span{display:block;font-size:20px}.msg{margin:12px 0;color:#147343;font-weight:bold}@media(max-width:650px){.headin{align-items:flex-start}.brand b{font-size:24px}.titlebar{align-items:flex-start}.titlebar h1{font-size:24px}.count{min-width:86px}.bottom a{min-width:20%;padding:10px 4px;font-size:12px}.wrap{padding:16px 9px 95px}.actions .big{flex:1}}</style></head><body><header class="head"><div class="headin"><div class="brand"><b>مكتب القرية</b><small>واسط - السوق الكبير</small></div><div class="date" id="today"></div></div></header><main class="wrap"><div class="titlebar"><div><h1>🛒 طلبية الشراء</h1><p>الأصناف القليلة في المخزون</p></div><div class="count"><b id="count">0</b><small>صنف بحاجة لطلب</small></div></div><section class="panel"><div class="scroll"><table><thead><tr><th>تسلسل</th><th>اسم الصنف</th><th>المخزون الحالي</th><th>الكمية المقترحة</th><th>إجراء</th></tr></thead><tbody id="body"></tbody></table><div class="empty" id="empty" hidden>لا توجد أصناف قليلة في المخزون حالياً</div></div><div class="actions"><button class="big approve" id="approve">🛒 اعتماد المحدد (إضافة إلى الطلبية)</button><button class="big rejectall" id="rejectAll">✕ رفض المحدد</button></div></section><div class="msg" id="msg"></div><a class="back" href="purchases.html">‹ رجوع إلى المشتريات</a></main><nav class="bottom"><a href="index.html"><span>⌂</span>الرئيسية</a><a class="active" href="purchases.html"><span>▣</span>المشتريات</a><a href="index.html#sales"><span>▤</span>المبيعات</a><a href="index.html#cash"><span>◉</span>الصندوق</a><a href="index.html#reports"><span>▦</span>التقارير</a></nav><script>const $=id=>document.getElementById(id);$('today').textContent=new Date().toLocaleDateString('ar-IQ');const rejected=new Set(JSON.parse(localStorage.getItem('albayanRejectedReorderV1')||'[]'));let rows=[];function n(o,ks,d=0){for(const k of ks)if(o&&o[k]!=null&&!isNaN(Number(o[k])))return Number(o[k]);return d}function s(o,ks){for(const k of ks)if(o&&typeof o[k]==='string'&&o[k].trim())return o[k].trim();return''}function load(){const seen=new Set(),out=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);let a;try{a=JSON.parse(localStorage.getItem(key))}catch{continue}if(!Array.isArray(a))continue;for(const o of a){if(!o||typeof o!=='object')continue;const name=s(o,['name','itemName','productName','pName','اسم الصنف','الصنف']);if(!name||seen.has(name))continue;const stock=n(o,['stock','qty','quantity','currentStock','balance','pQty','الكمية','المخزون'],NaN);const min=n(o,['minStock','minimum','min','pMin','reorderLevel','حد التنبيه','الحد الأدنى'],NaN);if(Number.isNaN(stock)||Number.isNaN(min)||stock>min)continue;const carton=Math.max(1,n(o,['cartonPieces','pCartonPieces','piecesPerCarton'],1));const target=Math.max(min+carton,carton);const suggested=Math.max(carton,Math.ceil((target-stock)/carton)*carton);seen.add(name);out.push({id:String(o.id||o.code||name),name,stock,suggested,selected:!rejected.has(String(o.id||o.code||name))})}}return out}function render(){rows=load();$('body').innerHTML='';$('count').textContent=rows.length;$('empty').hidden=rows.length>0;rows.forEach((x,i)=>{const tr=document.createElement('tr');tr.className=x.selected?'selected':'rejected';tr.innerHTML=`<td>${i+1}</td><td class="name"></td><td><span class="stock">${x.stock}</span></td><td><input class="qty" type="number" min="1" step="1" value="${x.suggested}"></td><td><button class="btn accept">قبول</button><button class="btn reject">رفض</button></td>`;tr.querySelector('.name').textContent=x.name;tr.querySelector('.qty').oninput=e=>x.suggested=Math.max(1,Number(e.target.value)||1);tr.querySelector('.accept').onclick=()=>{x.selected=true;rejected.delete(x.id);saveReject();tr.className='selected'};tr.querySelector('.reject').onclick=()=>{x.selected=false;rejected.add(x.id);saveReject();tr.className='rejected'};$('body').appendChild(tr)})}function saveReject(){localStorage.setItem('albayanRejectedReorderV1',JSON.stringify([...rejected]))}$('rejectAll').onclick=()=>{rows.filter(x=>x.selected).forEach(x=>{x.selected=false;rejected.add(x.id)});saveReject();render()};$('approve').onclick=()=>{const chosen=rows.filter(x=>x.selected).map(x=>({id:x.id,name:x.name,currentStock:x.stock,qty:x.suggested}));if(!chosen.length){$('msg').textContent='حدد صنفاً واحداً على الأقل';return}let list=[];try{list=JSON.parse(localStorage.getItem('albayanPurchaseOrdersV1')||'[]')}catch{}if(!Array.isArray(list))list=[];list.unshift({id:'PO-'+Date.now(),date:new Date().toISOString().slice(0,10),items:chosen,status:'pending',createdAt:new Date().toISOString()});localStorage.setItem('albayanPurchaseOrdersV1',JSON.stringify(list));$('msg').textContent='✓ تم اعتماد '+chosen.length+' صنف وإضافتها إلى الطلبية';setTimeout(()=>location.href='purchase-list.html',700)};render();</script></body></html>
