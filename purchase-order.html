<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b63"><title>طلبية الشراء | مكتب القرية</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#17304d;font-family:Tahoma,Arial,sans-serif}.top{background:#123b63;color:#fff;padding:18px;text-align:center}.top h1{margin:0;font-size:25px}.wrap{max-width:920px;margin:auto;padding:20px 14px 35px}.back{display:inline-block;margin-bottom:15px;color:#123b63;text-decoration:none;font-weight:bold}.box{background:#fff;border:1px solid #d9e3ed;border-radius:16px;padding:18px;margin-bottom:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-weight:bold;color:#425a72}input,textarea{width:100%;margin-top:5px;border:1px solid #cbd8e5;border-radius:10px;padding:11px;font:inherit;background:#fff}textarea{min-height:75px;resize:vertical}.items-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.add{border:0;border-radius:10px;padding:10px 15px;background:#1769aa;color:#fff;font:inherit;font-weight:bold}.row{display:grid;grid-template-columns:42px minmax(150px,1fr) 100px 110px 44px;gap:8px;align-items:end;margin-top:10px}.num{text-align:center;font-weight:bold;padding-bottom:11px}.remove{border:0;border-radius:9px;height:43px;background:#fdecec;color:#a52727;font-size:20px}.save{width:100%;border:0;border-radius:11px;padding:13px;background:#147343;color:#fff;font:inherit;font-weight:bold;font-size:18px}.msg{margin:10px 0 0;color:#147343;font-weight:bold}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{grid-template-columns:34px minmax(0,1fr) 80px 44px}.price{display:none}.box{padding:14px}}</style></head><body><header class="top"><h1>طلبية الشراء</h1></header><main class="wrap"><a class="back" href="purchases.html">‹ رجوع إلى المشتريات</a><form id="form"><section class="box"><div class="grid"><label>المورد<input id="supplier" required placeholder="اسم المورد"></label><label>التاريخ<input id="date" type="date" required></label></div><label style="margin-top:12px">ملاحظات الطلبية<textarea id="note" placeholder="ملاحظات"></textarea></label></section><section class="box"><div class="items-head"><h3 style="margin:0">مواد الطلبية</h3><button class="add" type="button" id="add">+ إضافة مادة</button></div><div id="rows"></div></section><button class="save" type="submit">حفظ طلبية الشراء</button><p id="msg" class="msg"></p></form></main><script>const rows=document.getElementById('rows');function addRow(name='',qty=1,price=''){const n=rows.children.length+1,d=document.createElement('div');d.className='row';d.innerHTML='<div class="num">'+n+'</div><label>اسم الصنف<input class="item" required value="'+String(name).replace(/"/g,'&quot;')+'"></label><label>الكمية<input class="qty" type="number" min="1" step="1" required value="'+qty+'"></label><label class="price">السعر<input class="cost" type="number" min="0" step="0.01" value="'+price+'"></label><button class="remove" type="button">×</button>';d.querySelector('.remove').onclick=()=>{d.remove();renumber()};rows.appendChild(d)}function renumber(){[...rows.children].forEach((r,i)=>r.querySelector('.num').textContent=i+1)}document.getElementById('add').onclick=()=>addRow();document.getElementById('date').value=new Date().toISOString().slice(0,10);addRow();document.getElementById('form').onsubmit=e=>{e.preventDefault();const items=[...rows.children].map(r=>({name:r.querySelector('.item').value.trim(),qty:Number(r.querySelector('.qty').value),price:Number(r.querySelector('.cost').value)||0}));const order={id:'PO-'+Date.now(),supplier:document.getElementById('supplier').value.trim(),date:document.getElementById('date').value,note:document.getElementById('note').value.trim(),items,status:'pending',createdAt:new Date().toISOString()};let list=[];try{list=JSON.parse(localStorage.getItem('albayanPurchaseOrdersV1')||'[]')}catch{}if(!Array.isArray(list))list=[];list.unshift(order);localStorage.setItem('albayanPurchaseOrdersV1',JSON.stringify(list));document.getElementById('msg').textContent='✓ تم حفظ طلبية الشراء';setTimeout(()=>location.href='purchase-list.html',500)};</script></body></html>
