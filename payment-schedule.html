<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07579a"><title>مواعيد التسديد</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3f8;color:#073e72;font-family:Tahoma,Arial}.top{background:#07579a;color:#fff;padding:18px}.wrap{max-width:900px;margin:auto}.top h1{margin:0;font-size:24px}.top p{margin:6px 0 0}.page{padding:14px}.card{background:#fff;border:1px solid #d6e1eb;border-radius:16px;padding:14px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}.day{border:1px solid #c7d7e5;background:#f8fbfe;color:#073e72;border-radius:11px;padding:10px 2px;font-weight:bold}.day.on{background:#0878e5;color:#fff}.day span{display:block;font-size:11px;margin-top:5px}.title{font-size:18px;font-weight:bold;margin:10px 0}.customer{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-top:1px solid #e0e7ee;padding:13px 3px}.customer b{font-size:15px}.actions{display:flex;gap:5px}.icon{border:0;border-radius:9px;padding:9px}.edit{background:#eaf2fb;color:#07579a}.del{background:#fff0f0;color:#b83232}.empty{text-align:center;color:#8292a1;padding:25px}.add{width:100%;margin-top:12px;border:0;border-radius:11px;background:#07579a;color:#fff;padding:13px;font-weight:bold}.notice{background:#e8f7ee;color:#17643b;border-radius:10px;padding:10px;margin-bottom:12px;font-size:13px}@media(max-width:600px){.days{grid-template-columns:repeat(4,1fr)}}</style></head><body><header class="top"><div class="wrap"><h1>📅 مواعيد التسديد</h1><p>جدول التحصيل الأسبوعي</p></div></header><main class="page wrap"><section class="card"><div class="notice" id="notice">تم إيقاف الحذف التلقائي وحماية المواعيد.</div><div class="days" id="days"></div><div class="title" id="title"></div><div id="list"></div><button class="add" onclick="addEntry()">＋ تعيين زبون</button></section></main><script>const KEY='albayanPaymentScheduleV1',DONE='albayanPaymentScheduleDoneV1',names=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];let selected=new Date().getDay();const load=(k,f=[])=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return Array.isArray(v)?v:f}catch{return f}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function recover(){let a=load(KEY),d=load(DONE),n=0;for(const x of d){if(x&&x.source==='automatic'&&x.reason==='balance-zero'&&x.name&&!a.some(y=>y.name===x.name)){a.push({id:x.id||('r'+Date.now()+n),name:x.name,day:Number(x.day)||0,recovered:true,updatedAt:new Date().toISOString()});n++}}if(n)save(KEY,a);document.getElementById('notice').textContent=n?'تم استرجاع '+n+' موعد وحمايته من الحذف التلقائي.':'المواعيد محمية الآن من الحذف التلقائي.'}function render(){const a=load(KEY);days.innerHTML=names.map((n,d)=>'<button class="day '+(selected===d?'on':'')+'" onclick="selected='+d+';render()">'+n+'<span>'+a.filter(x=>Number(x.day)===d).length+' زبون</span></button>').join('');const r=a.filter(x=>Number(x.day)===selected);title.textContent='زبائن يوم '+names[selected]+' — '+r.length;list.innerHTML=r.length?r.map(x=>'<div class="customer"><b>'+esc(x.name)+'</b><div class="actions"><button class="icon edit" onclick="move(\''+encodeURIComponent(x.id)+'\')">✎</button><button class="icon del" onclick="del(\''+encodeURIComponent(x.id)+'\')">✕</button></div></div>').join(''):'<div class="empty">لا يوجد زبائن بهذا اليوم</div>'}function addEntry(){const n=prompt('اسم الزبون');if(!n)return;const d=prompt('رقم اليوم: 0 الأحد، 1 الاثنين، 2 الثلاثاء، 3 الأربعاء، 4 الخميس، 5 الجمعة، 6 السبت',selected);if(d===null||Number(d)<0||Number(d)>6)return;const a=load(KEY);a.push({id:'p'+Date.now(),name:n.trim(),day:Number(d),updatedAt:new Date().toISOString()});save(KEY,a);selected=Number(d);render()}function move(e){const id=decodeURIComponent(e),a=load(KEY),x=a.find(v=>String(v.id)===id);if(!x)return;const d=prompt('انقل إلى يوم: 0 الأحد، 1 الاثنين، 2 الثلاثاء، 3 الأربعاء، 4 الخميس، 5 الجمعة، 6 السبت',x.day);if(d===null||Number(d)<0||Number(d)>6)return;x.day=Number(d);save(KEY,a);selected=Number(d);render()}function del(e){const id=decodeURIComponent(e);if(!confirm('حذف هذا الموعد فقط؟'))return;save(KEY,load(KEY).filter(x=>String(x.id)!==id));render()}recover();render();</script></body></html>
