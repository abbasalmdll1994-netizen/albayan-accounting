<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07579a"><title>مواعيد التسديد</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3f8;color:#073e72;font-family:Tahoma,Arial}.top{background:#07579a;color:#fff;padding:18px}.wrap{max-width:900px;margin:auto}.top h1{margin:0;font-size:24px}.top p{margin:6px 0 0}.page{padding:14px}.card{background:#fff;border:1px solid #d6e1eb;border-radius:16px;padding:14px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}.day{border:1px solid #c7d7e5;background:#f8fbfe;color:#073e72;border-radius:11px;padding:10px 2px;font-weight:bold}.day.on{background:#0878e5;color:#fff}.day span{display:block;font-size:11px;margin-top:5px}.title{font-size:18px;font-weight:bold;margin:10px 0}.customer{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-top:1px solid #e0e7ee;padding:13px 3px}.customer b{font-size:15px}.actions{display:flex;gap:5px}.icon{border:0;border-radius:9px;padding:9px}.edit{background:#eaf2fb;color:#07579a}.del{background:#fff0f0;color:#b83232}.empty{text-align:center;color:#8292a1;padding:25px}.add{width:100%;margin-top:12px;border:0;border-radius:11px;background:#07579a;color:#fff;padding:13px;font-weight:bold}.notice{background:#e8f7ee;color:#17643b;border-radius:10px;padding:10px;margin-bottom:12px;font-size:13px}.overlay{display:none;position:fixed;inset:0;background:#163c5d66;z-index:20;padding:18px;align-items:center;justify-content:center}.overlay.open{display:flex}.modal{width:min(520px,100%);background:#fff;border-radius:17px;padding:18px}.modal h2{margin:0 0 16px}.field{margin-bottom:13px}.field label{display:block;font-weight:bold;margin-bottom:7px}.field input,.field select{width:100%;height:50px;border:1px solid #b9c9d8;border-radius:11px;padding:10px;font:inherit;background:#fff}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.save,.cancel{height:48px;border:0;border-radius:11px;font-weight:bold}.save{background:#07579a;color:#fff}.cancel{background:#eef4fa;color:#073e72}@media(max-width:600px){.days{grid-template-columns:repeat(4,1fr)}}</style></head><body><header class="top"><div class="wrap"><h1>📅 مواعيد التسديد</h1><p>جدول التحصيل الأسبوعي</p></div></header><main class="page wrap"><section class="card"><div class="notice" id="notice">المواعيد محمية من الحذف التلقائي.</div><div class="days" id="days"></div><div class="title" id="title"></div><div id="list"></div><button class="add" onclick="openForm()">＋ تعيين زبون</button></section></main><div class="overlay" id="overlay"><div class="modal"><h2 id="formTitle">تعيين موعد تسديد</h2><div class="field"><label>اسم الزبون</label><input id="customerName" autocomplete="off" placeholder="اسم الزبون"></div><div class="field"><label>يوم التسديد</label><select id="daySelect"><option value="0">الأحد</option><option value="1">الاثنين</option><option value="2">الثلاثاء</option><option value="3">الأربعاء</option><option value="4">الخميس</option><option value="5">الجمعة</option><option value="6">السبت</option></select></div><div class="buttons"><button class="save" onclick="saveForm()">حفظ</button><button class="cancel" onclick="closeForm()">إلغاء</button></div></div></div><script>const KEY='albayanPaymentScheduleV1',DONE='albayanPaymentScheduleDoneV1',names=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];let selected=new Date().getDay(),editing=null;const load=(k,f=[])=>{try{const v=JSON.parse(localStorage.getItem(k)||'null');return Array.isArray(v)?v:f}catch{return f}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function recover(){let a=load(KEY),d=load(DONE),n=0;for(const x of d){if(x&&x.source==='automatic'&&x.reason==='balance-zero'&&x.name&&!a.some(y=>y.name===x.name)){a.push({id:x.id||('r'+Date.now()+n),name:x.name,day:Number(x.day)||0,recovered:true,updatedAt:new Date().toISOString()});n++}}if(n)save(KEY,a);notice.textContent=n?'تم استرجاع '+n+' موعد وحمايته من الحذف التلقائي.':'المواعيد محمية الآن من الحذف التلقائي.'}function render(){const a=load(KEY);days.innerHTML=names.map((n,d)=>'<button class="day '+(selected===d?'on':'')+'" onclick="selected='+d+';render()">'+n+'<span>'+a.filter(x=>Number(x.day)===d).length+' زبون</span></button>').join('');const r=a.filter(x=>Number(x.day)===selected);title.textContent='زبائن يوم '+names[selected]+' — '+r.length;list.innerHTML=r.length?r.map(x=>'<div class="customer"><b>'+esc(x.name)+'</b><div class="actions"><button class="icon edit" onclick="move(\''+encodeURIComponent(x.id)+'\')">✎</button><button class="icon del" onclick="del(\''+encodeURIComponent(x.id)+'\')">✕</button></div></div>').join(''):'<div class="empty">لا يوجد زبائن بهذا اليوم</div>'}function openForm(x){editing=x?x.id:null;formTitle.textContent=x?'تعديل موعد التسديد':'تعيين موعد تسديد';customerName.value=x?x.name:'';daySelect.value=String(x?x.day:selected);overlay.classList.add('open');setTimeout(()=>customerName.focus(),50)}function closeForm(){overlay.classList.remove('open');editing=null}function saveForm(){const n=customerName.value.trim();if(!n)return alert('اكتب اسم الزبون');const d=Number(daySelect.value),a=load(KEY);if(editing){const x=a.find(v=>String(v.id)===String(editing));if(x){x.name=n;x.day=d;x.updatedAt=new Date().toISOString()}}else a.push({id:'p'+Date.now(),name:n,day:d,updatedAt:new Date().toISOString()});save(KEY,a);selected=d;closeForm();render()}function move(e){const id=decodeURIComponent(e),x=load(KEY).find(v=>String(v.id)===id);if(x)openForm(x)}function del(e){const id=decodeURIComponent(e);if(!confirm('حذف هذا الموعد فقط؟'))return;save(KEY,load(KEY).filter(x=>String(x.id)!==id));render()}overlay.onclick=e=>{if(e.target===overlay)closeForm()};recover();render();</script></body></html>
