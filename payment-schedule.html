<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07579a"><title>مواعيد التسديد</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3f8;color:#073e72;font-family:Tahoma,Arial,sans-serif}.top{background:#07579a;color:#fff;padding:22px 18px}.wrap{max-width:900px;margin:auto}.top h1{margin:0;font-size:26px}.top p{margin:8px 0 0;font-size:17px}.page{padding:14px}.card{background:#fff;border:1px solid #d6e1eb;border-radius:18px;padding:14px;margin-bottom:14px}.days{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}.day{min-height:62px;border:1px solid #c7d7e5;background:#f8fbfe;color:#073e72;border-radius:12px;padding:8px 2px;font-weight:bold;font-size:14px}.day.on{background:#0878e5;color:#fff}.day span{display:block;font-size:10px;margin-top:5px}.title{font-size:19px;font-weight:bold;margin:10px 0 12px}.customer{display:flex;gap:8px;align-items:center;border-top:1px solid #e0e7ee;padding:13px 2px}.customer-info{min-width:0;flex:1}.customer-info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bal{display:block;margin-top:5px;font-size:13px;color:#526b82;white-space:nowrap}.actions{display:flex;flex:0 0 auto;gap:5px;white-space:nowrap}.btn{border:0;border-radius:9px;padding:9px 10px;font-weight:bold;font-size:13px}.edit{background:#eaf2fb;color:#07579a}.pay{background:#17834a;color:#fff}.empty{text-align:center;color:#8292a1;padding:20px}.add,.statement,.close-day{width:100%;margin-top:10px;border:0;border-radius:11px;color:#fff;padding:14px;font-weight:bold;font-size:15px}.add{background:#07579a}.statement{background:#1769aa}.close-day{background:#17834a}.close-day:disabled{background:#a9b6c1}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f6f9fc;border-radius:12px;padding:14px}.stat strong{display:block;font-size:22px;margin-top:7px}.collection-row,.history-row{border-top:1px solid #e2e9ef;padding:11px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}.muted{font-size:12px;color:#687d90}.hint{font-size:12px;color:#687d90;margin-top:6px;line-height:1.5}.overlay{display:none;position:fixed;inset:0;background:#163c5d66;z-index:20;padding:18px;align-items:center;justify-content:center}.overlay.open{display:flex}.modal{width:min(520px,100%);background:#fff;border-radius:17px;padding:18px}.field{margin-bottom:13px}.field label{display:block;font-weight:bold;margin-bottom:7px}.field input,.field select{width:100%;height:50px;border:1px solid #b9c9d8;border-radius:11px;padding:10px;font:inherit;background:#fff}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.save,.cancel{height:48px;border:0;border-radius:11px;font-weight:bold}.save{background:#07579a;color:#fff}.cancel{background:#eef4fa;color:#073e72}@media(max-width:390px){.btn{padding:8px 7px;font-size:12px}.bal{font-size:12px}}@media(min-width:700px){.days{grid-template-columns:repeat(7,1fr)}}</style></head><body><header class="top"><div class="wrap"><h1>📅 مواعيد التسديد</h1><p>جدول التحصيل الأسبوعي</p></div></header><main class="page wrap"><section class="card"><div class="days" id="days"><button class="day">الأحد</button><button class="day">الاثنين</button><button class="day">الثلاثاء</button><button class="day">الأربعاء</button><button class="day">الخميس</button><button class="day">الجمعة</button><button class="day">السبت</button></div><div class="title" id="dayTitle">زبائن اليوم</div><div id="customerList"></div><button class="add" id="addBtn">＋ تعيين زبون</button></section><section class="card"><div class="title">💰 تحصيل اليوم</div><div class="summary"><div class="stat">إجمالي المستحصل<strong id="todayTotal">0 د.ع</strong></div><div class="stat">عدد عمليات التسديد<strong id="todayCount">0</strong></div></div><div id="todayList"></div><button class="statement" id="statementBtn">📄 كشف تحصيل اليوم</button><button class="close-day" id="closeBtn">✓ تسليم وإقفال تحصيل اليوم</button></section><section class="card"><div class="title">📚 سجل تسليم التحصيل</div><div id="history"></div></section></main><div class="overlay" id="overlay"><div class="modal"><h2 id="formTitle">تعيين موعد تسديد</h2><div class="field"><label>اسم الزبون</label><input id="customerName" autocomplete="off"></div><div class="field"><label>يوم التسديد</label><select id="daySelect"><option value="0">الأحد</option><option value="1">الاثنين</option><option value="2">الثلاثاء</option><option value="3">الأربعاء</option><option value="4">الخميس</option><option value="5">الجمعة</option><option value="6">السبت</option></select></div><div class="field" id="balanceField" style="display:none"><label>الرصيد الحالي</label><input id="balanceInput" type="number" inputmode="decimal" min="0" step="0.01"><div class="hint">إذا غيّرت الرصيد، البرنامج يسجل فرق المبلغ كحركة تصحيح ويحافظ على الفواتير والتسديدات السابقة.</div></div><div class="buttons"><button class="save" id="saveBtn">حفظ</button><button class="cancel" id="cancelBtn">إلغاء</button></div></div></div><script>(function(){'use strict';var KEY='albayanPaymentScheduleV1',WORK='albayanWorkspaceV1',RECEIPTS='albayanPaymentReceiptsV2',CLOSES='albayanDailyCollectionClosingsV1';var names=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];var selected=(new Date()).getDay(),editing=null,originalName='',originalBalance=0;function el(id){return document.getElementById(id)}function load(k,f){try{var v=JSON.parse(localStorage.getItem(k)||'null');return v===null?f:v}catch(e){return f}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}function money(n){return new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:2}).format(Math.max(0,Number(n)||0))+' د.ع'}function dateNow(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function schedule(){var a=load(KEY,[]);return Array.isArray(a)?a:[]}function safe(s){var d=document.createElement('div');d.textContent=String(s||'');return d.innerHTML}function balance(name){var w=load(WORK,{accounts:[],invoices:[]}),a=Array.isArray(w.accounts)?w.accounts:[],b=0,hasDebt=false;a.forEach(function(x){if(x.customer===name){b+=Number(x.owedBy||0)-Number(x.owedTo||0);if(Number(x.owedBy)>0)hasDebt=true}});if(!hasDebt){b=0;(Array.isArray(w.invoices)?w.invoices:[]).forEach(function(v){if(!v.cancelled&&v.customer===name){var t=Number(v.total||v.grandTotal||0);b+=Math.max(0,t-Number(v.paid||0))}})}return Math.max(0,Math.round(b*100)/100)}function closedToday(){var c=load(CLOSES,[]);return Array.isArray(c)&&c.some(function(x){return x.date===dateNow()})}function renderDays(){var a=schedule(),buttons=el('days').querySelectorAll('.day');for(var i=0;i<buttons.length;i++){(function(d){var count=a.filter(function(x){return Number(x.day)===d}).length;buttons[d].className='day'+(selected===d?' on':'');buttons[d].innerHTML=names[d]+'<span>'+count+' زبون</span>';buttons[d].onclick=function(){selected=d;render()}})(i)}}function render(){renderDays();var a=schedule().filter(function(x){return Number(x.day)===selected});el('dayTitle').textContent='زبائن يوم '+names[selected]+' — '+a.length;el('customerList').innerHTML=a.length?a.map(function(x){return '<div class="customer"><div class="customer-info"><b>'+safe(x.name)+'</b><span class="bal">الرصيد المتبقي: '+money(balance(x.name))+'</span></div><div class="actions"><button class="btn edit" data-edit="'+encodeURIComponent(x.id)+'">تعديل</button><button class="btn pay" data-pay="'+encodeURIComponent(x.id)+'">تسديد</button></div></div>'}).join(''):'<div class="empty">لا يوجد زبائن بهذا اليوم</div>';document.querySelectorAll('[data-edit]').forEach(function(b){b.onclick=function(){openEdit(decodeURIComponent(this.getAttribute('data-edit')))}});document.querySelectorAll('[data-pay]').forEach(function(b){b.onclick=function(){pay(decodeURIComponent(this.getAttribute('data-pay')))}});renderToday();renderHistory()}function openForm(x){editing=x?x.id:null;originalName=x?x.name:'';originalBalance=x?balance(x.name):0;el('formTitle').textContent=x?'تعديل الزبون والرصيد':'تعيين موعد تسديد';el('customerName').value=x?x.name:'';el('daySelect').value=String(x?x.day:selected);el('balanceField').style.display=x?'block':'none';el('balanceInput').value=x?String(originalBalance):'';el('overlay').classList.add('open')}function openEdit(id){var x=schedule().find(function(v){return String(v.id)===String(id)});if(x)openForm(x)}function closeForm(){el('overlay').classList.remove('open');editing=null;originalName='';originalBalance=0}function applyBalanceCorrection(name,target,current){var diff=Math.round((Number(target)-Number(current))*100)/100;if(Math.abs(diff)<0.01)return;var w=load(WORK,{accounts:[],invoices:[]});if(!Array.isArray(w.accounts))w.accounts=[];w.accounts.push({id:'BAL-'+Date.now(),customer:name,date:dateNow(),owedBy:diff>0?diff:0,owedTo:diff<0?Math.abs(diff):0,notes:'تصحيح يدوي للرصيد من مواعيد التسديد',type:'balance-correction',createdAt:(new Date()).toISOString()});save(WORK,w)}function saveForm(){var n=el('customerName').value.trim();if(!n){alert('اكتب اسم الزبون');return}var d=Number(el('daySelect').value),a=schedule();if(editing){var target=Number(el('balanceInput').value);if(!isFinite(target)||target<0){alert('اكتب رصيد صحيح');return}var x=a.find(function(v){return String(v.id)===String(editing)});if(x){x.name=n;x.day=d;x.updatedAt=(new Date()).toISOString()}applyBalanceCorrection(n,target,balance(originalName));}else a.push({id:'p'+Date.now(),name:n,day:d,updatedAt:(new Date()).toISOString()});save(KEY,a);selected=d;closeForm();render()}function pay(id){if(closedToday()){alert('تم إقفال تحصيل اليوم');return}var x=schedule().find(function(v){return String(v.id)===String(id)});if(!x)return;localStorage.setItem('albayanRepActiveCustomer',JSON.stringify({id:x.id,name:x.name}));sessionStorage.setItem('albayanCurrentCustomer',x.name);location.href='rep-payment-v2.html?customer='+encodeURIComponent(x.name)+'&scheduleId='+encodeURIComponent(x.id)+'&from=schedule&v=20260911-22'}function rowsToday(){var r=load(RECEIPTS,[]);return (Array.isArray(r)?r:[]).filter(function(x){return String(x.date||'').slice(0,10)===dateNow()&&x.status!=='cancelled'})}function renderToday(){var r=rowsToday(),t=r.reduce(function(s,x){return s+Number(x.amount||0)},0);el('todayTotal').textContent=money(t);el('todayCount').textContent=r.length;el('todayList').innerHTML=r.length?r.slice().reverse().map(function(x){return '<div class="collection-row"><span>'+safe(x.customer||'زبون')+'</span><b>'+money(x.amount)+'</b></div>'}).join(''):'<div class="empty">لا توجد تسديدات مسجلة اليوم</div>';el('closeBtn').disabled=closedToday()||!r.length;el('closeBtn').textContent=closedToday()?'✓ تم تسليم تحصيل اليوم':'✓ تسليم وإقفال تحصيل اليوم'}function closeDay(){var r=rowsToday();if(!r.length)return;if(closedToday()){alert('تحصيل اليوم مسلم مسبقاً');return}var t=r.reduce(function(s,x){return s+Number(x.amount||0)},0);if(!confirm('تأكيد تسليم '+money(t)+' للمحاسب؟'))return;var c=load(CLOSES,[]),n=new Date();c.push({id:'DC-'+Date.now(),date:dateNow(),closedAt:n.toISOString(),closedTime:n.toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'}),total:t,count:r.length,receiptIds:r.map(function(x){return x.id||x.number}),status:'handed-over'});save(CLOSES,c);render()}function renderHistory(){var c=load(CLOSES,[]);el('history').innerHTML=c.length?c.slice().reverse().map(function(x){return '<div class="history-row"><div><b>'+safe(x.date)+'</b><div class="muted">'+Number(x.count||0)+' عملية</div></div><b>'+money(x.total)+'</b></div>'}).join(''):'<div class="empty">لا يوجد تسليم سابق</div>'}el('addBtn').onclick=function(){openForm(null)};el('saveBtn').onclick=saveForm;el('cancelBtn').onclick=closeForm;el('statementBtn').onclick=function(){location.href='collection-statement.html?date='+encodeURIComponent(dateNow())+'&v=20260911-3'};el('closeBtn').onclick=closeDay;el('overlay').onclick=function(e){if(e.target===el('overlay'))closeForm()};window.addEventListener('pageshow',render);window.addEventListener('focus',render);render()})();</script></body></html>
