<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b63"><title>مواعيد التسديد | مكتب القرية</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#17324d;font-family:Tahoma,Arial,sans-serif}.top{background:#123b63;color:#fff;padding:18px}.wrap{max-width:760px;margin:auto}.top h1{margin:0;font-size:25px}.top p{margin:7px 0 0;color:#d9e7f3}.page{padding:14px}.addbar{display:flex;justify-content:flex-end;margin-bottom:12px}.addicon{border:0;background:#123b63;color:#fff;border-radius:13px;padding:12px 17px;font:bold 15px Tahoma;box-shadow:0 4px 12px #123b6330}.card{background:#fff;border:1px solid #dbe4ed;border-radius:17px;padding:16px;box-shadow:0 5px 18px #123b6310;margin-bottom:14px}.formcard{display:none}.formcard.open{display:block}.card h2{margin:0 0 15px}.field{margin-bottom:12px}.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #b9c9d8;border-radius:11px;padding:12px;font:inherit;background:#fff}.field textarea{min-height:68px}.save{width:100%;border:0;border-radius:11px;padding:14px;background:#123b63;color:#fff;font:bold 15px Tahoma}.close{width:100%;border:1px solid #c7d3df;border-radius:11px;padding:11px;background:#fff;color:#61758a;font:bold 13px Tahoma;margin-top:8px}.msg{display:none;margin-top:10px;padding:9px;border-radius:9px;background:#e9f7ef;color:#17633c;font-size:12px}.stats{display:flex;gap:8px;margin-bottom:12px}.stat{flex:1;background:#fff;border:1px solid #dbe4ed;border-radius:12px;padding:10px 4px;text-align:center}.stat strong{display:block;font-size:19px;color:#123b63}.stat span{font-size:11px;color:#718397}.days{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}.daybtn{border:1px solid #c7d7e5;background:#fff;color:#17324d;border-radius:11px;padding:10px 3px;font:bold 13px Tahoma}.daybtn span{display:block;font-size:11px;margin-top:4px;color:#718397}.daybtn.on{background:#123b63;color:#fff}.daybtn.on span{color:#dce9f4}.listTitle{font-size:18px;font-weight:bold;margin-bottom:10px}.customer{border:1px solid #dfe7ee;border-radius:11px;padding:11px;margin:8px 0;background:#f9fbfd}.customer b{font-size:15px}.meta{font-size:12px;color:#718397;margin-top:4px}.amount{font-weight:bold;margin-top:5px}.actions{display:flex;gap:6px;margin-top:8px}.actions button{flex:1;border:1px solid #c7d3df;background:#fff;border-radius:8px;padding:8px;font:12px Tahoma}.actions .paid{color:#16834c}.empty{text-align:center;color:#91a0ae;padding:25px}.paidrow{opacity:.58}.all{width:100%;border:1px solid #c7d3df;background:#fff;border-radius:10px;padding:10px;margin-top:8px;font:bold 13px Tahoma}@media(max-width:480px){.days{grid-template-columns:repeat(4,1fr)}.top h1{font-size:22px}.page{padding:10px}.card{padding:14px}.daybtn{font-size:12px}.addicon{width:100%}}</style><script defer src="offline.js?v=offline-20260907-68"></script></head><body><header class="top"><div class="wrap"><h1>📅 مواعيد التسديد</h1><p>ترتيب الزبائن حسب أيام الأسبوع</p></div></header><main class="page wrap"><div class="addbar"><button class="addicon" id="addToggle">➕ إضافة زبون</button></div><section class="card formcard" id="addForm"><h2>إضافة زبون</h2><div class="field"><label>اسم الزبون *</label><input id="name" placeholder="اسم الزبون" autocomplete="off"></div><div class="field"><label>رقم الهاتف</label><input id="phone" inputmode="tel" placeholder="07xxxxxxxxx"></div><div class="field"><label>المبلغ المستحق</label><input id="amount" type="number" min="0" placeholder="0"></div><div class="field"><label>يوم التسديد *</label><select id="day"><option value="6">السبت</option><option value="0">الأحد</option><option value="1">الاثنين</option><option value="2">الثلاثاء</option><option value="3">الأربعاء</option><option value="4">الخميس</option><option value="5">الجمعة</option></select></div><div class="field"><label>ملاحظات</label><textarea id="notes" placeholder="ملاحظات اختيارية"></textarea></div><button class="save" id="save">حفظ الزبون</button><button class="close" id="closeForm">إغلاق</button><div class="msg" id="msg">✓ تم حفظ الزبون.</div></section><section class="card"><div class="stats"><div class="stat"><strong id="total">0</strong><span>الزبائن</span></div><div class="stat"><strong id="due">0</strong><span>غير مسدد</span></div><div class="stat"><strong id="paid">0</strong><span>مسدد</span></div></div><div class="days" id="days"></div><div class="listTitle" id="listTitle"></div><div id="list"></div><button class="all" onclick="showAll()">عرض كل الزبائن</button></section></main><script>const KEY='albayanPaymentScheduleV1',names={6:'السبت',0:'الأحد',1:'الاثنين',2:'الثلاثاء',3:'الأربعاء',4:'الخميس',5:'الجمعة'},order=[6,0,1,2,3,4,5],$=id=>document.getElementById(id);let selected=new Date().getDay();function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}function store(x){localStorage.setItem(KEY,JSON.stringify(x))}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]))}function money(v){return Number(v||0).toLocaleString('ar-IQ')+' د.ع'}function render(){const a=load();$('total').textContent=a.length;$('paid').textContent=a.filter(x=>x.paid).length;$('due').textContent=a.filter(x=>!x.paid).length;$('days').innerHTML=order.map(d=>{const c=a.filter(x=>Number(x.day)===d).length;return'<button class="daybtn '+(selected===d?'on':'')+'" onclick="selectDay('+d+')">'+names[d]+'<span>'+c+' زبون</span></button>'}).join('');renderList()}function renderList(){const a=load().filter(x=>Number(x.day)===selected);$('listTitle').textContent='زبائن يوم '+names[selected]+' — '+a.length;$('list').innerHTML=a.length?a.map(x=>'<div class="customer '+(x.paid?'paidrow':'')+'"><b>'+esc(x.name)+'</b>'+(x.phone?'<div class="meta">📞 '+esc(x.phone)+'</div>':'')+(Number(x.amount)>0?'<div class="amount">'+money(x.amount)+'</div>':'')+(x.note||x.notes?'<div class="meta">'+esc(x.note||x.notes)+'</div>':'')+'<div class="actions"><button class="paid" onclick="toggle(\''+x.id+'\')">'+(x.paid?'↩ إلغاء التسديد':'✓ تم التسديد')+'</button><button onclick="del(\''+x.id+'\')">حذف</button></div></div>').join(''):'<div class="empty">لا يوجد زبائن بهذا اليوم</div>'}function selectDay(d){selected=d;render()}function add(){const name=$('name').value.trim();if(!name){$('name').focus();return alert('اكتب اسم الزبون أولاً.')}const a=load();const d=Number($('day').value);a.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),name,phone:$('phone').value.trim(),amount:Number($('amount').value)||0,day:d,note:$('notes').value.trim(),paid:false,updatedAt:new Date().toISOString()});store(a);selected=d;$('name').value='';$('phone').value='';$('amount').value='';$('notes').value='';render();$('addForm').classList.remove('open')}function toggle(id){const a=load(),x=a.find(v=>String(v.id)===String(id));if(x){x.paid=!x.paid;store(a);render()}}function del(id){if(!confirm('حذف هذا الزبون من مواعيد التسديد؟'))return;store(load().filter(x=>String(x.id)!==String(id)));render()}function showAll(){const a=load();$('listTitle').textContent='كل الزبائن — '+a.length;$('list').innerHTML=a.length?a.map(x=>'<div class="customer '+(x.paid?'paidrow':'')+'"><b>'+esc(x.name)+'</b><div class="meta">'+names[Number(x.day)]+'</div>'+(Number(x.amount)>0?'<div class="amount">'+money(x.amount)+'</div>':'')+'</div>').join(''):'<div class="empty">لا توجد مواعيد</div>'}$('addToggle').onclick=()=>{$('addForm').classList.toggle('open');if($('addForm').classList.contains('open'))setTimeout(()=>$('name').focus(),50)};$('closeForm').onclick=()=>$('addForm').classList.remove('open');$('save').onclick=add;window.addEventListener('storage',e=>{if(e.key===KEY)render()});render();</script></body></html>
