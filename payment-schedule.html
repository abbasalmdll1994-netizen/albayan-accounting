<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07579a"><title>مواعيد التسديد | مكتب القرية</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3f8;color:#073e72;font-family:Tahoma,Arial,sans-serif}.top{background:#07579a;color:#fff;padding:18px}.wrap{max-width:900px;margin:auto}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.top h1{margin:0;font-size:25px}.top p{margin:6px 0 0;color:#e0edf7}.add{border:0;background:#0878e5;color:#fff;border-radius:12px;padding:12px 16px;font-weight:bold}.page{padding:14px}.card{background:#fff;border:1px solid #d6e1eb;border-radius:17px;padding:14px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}.day{border:1px solid #c7d7e5;background:#f8fbfe;color:#073e72;border-radius:11px;padding:9px 2px;font-weight:bold}.day span{display:block;font-size:11px;margin-top:4px}.day.on{background:#0878e5;color:#fff}.title{font-size:18px;font-weight:bold;margin:8px 0}.customer{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:9px;border-top:1px solid #dfe7ee;padding:12px 2px}.customer-main{border:0;background:#fff;text-align:right;color:inherit;padding:2px;min-width:0}.customer-main b{font-size:15px}.amount{font-weight:bold;white-space:nowrap}.credit{color:#16824a}.actions{display:flex;gap:4px}.icon{width:34px;height:34px;border:0;border-radius:9px;font-size:17px;font-weight:bold}.ok{background:#e8f7ee;color:#16824a}.edit{background:#eaf2fb;color:#07579a}.del{background:#fff0f0;color:#b83232}.empty{text-align:center;color:#91a0ae;padding:25px}.overlay{display:none;position:fixed;inset:0;background:#163c5d66;z-index:20;padding:18px;align-items:center;justify-content:center}.overlay.open{display:flex}.modal{width:min(620px,100%);background:#fff;border-radius:18px;padding:18px}.field{margin-bottom:13px}.field label{display:block;font-weight:bold;margin-bottom:6px}.field input,.field select{width:100%;height:50px;border:1px solid #b9c9d8;border-radius:11px;padding:10px;font:inherit}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.save,.cancel{height:48px;border:0;border-radius:11px;font-weight:bold}.save{background:#07579a;color:#fff}.cancel{background:#eef4fa;color:#073e72}.hint{font-size:12px;color:#718397}.remove{margin-top:12px;width:100%;border:0;background:#fff0f0;color:#b83232;border-radius:10px;padding:10px}@media(max-width:600px){.days{grid-template-columns:repeat(4,1fr)}.toprow{align-items:flex-start}.top h1{font-size:22px}.customer{grid-template-columns:minmax(0,1fr) auto}.amount{grid-column:1/2}.actions{grid-row:1/3;grid-column:2}}</style><script defer src="offline.js?v=offline-20260911-payment-schedule"></script></head><body><header class="top"><div class="wrap toprow"><div><h1>📅 مواعيد التسديد</h1><p>جدول التحصيل الأسبوعي</p></div><button class="add" id="add">＋ تعيين زبون</button></div></header><main class="page wrap"><section class="card"><div class="days" id="days"></div><div class="title" id="listTitle"></div><div id="list"></div></section></main><div class="overlay" id="overlay"><section class="modal"><h2 id="formTitle">تعيين موعد تسديد</h2><div class="field"><label>اسم الزبون</label><input id="name" list="customerNames" autocomplete="off"><datalist id="customerNames"></datalist><div class="hint">الرصيد يُقرأ تلقائياً من حساب الزبون، ولا يُكتب هنا.</div></div><div class="field"><label>يوم التسديد</label><select id="day"><option value="0">الأحد</option><option value="1">الاثنين</option><option value="2">الثلاثاء</option><option value="3">الأربعاء</option><option value="4">الخميس</option><option value="5">الجمعة</option><option value="6">السبت</option></select></div><div class="buttons"><button class="save" id="save">حفظ</button><button class="cancel" id="cancel">إلغاء</button></div><button class="remove" id="remove" hidden>حذف من جدول التسديد</button></section></div><script>const KEY='albayanPaymentScheduleV1',WORK='albayanWorkspaceV1',ROUTE='albayanRepresentativeRouteV1',RECEIPTS='albayanPaymentReceiptsV2',DONE='albayanPaymentScheduleDoneV1',names={0:'الأحد',1:'الاثنين',2:'الثلاثاء',3:'الأربعاء',4:'الخميس',5:'الجمعة',6:'السبت'},order=[0,1,2,3,4,5,6],$=id=>document.getElementById(id);let selected=new Date().getDay(),editing=null;const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}},store=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=v=>new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:2}).format(Math.abs(Number(v)||0))+' د.ع',today=()=>new Date().toISOString().slice(0,10);function schedule(){const a=load(KEY,[]);return Array.isArray(a)?a:[]}function workspace(){return load(WORK,{accounts:[],invoices:[]})}function invoiceTotal(v){return Number(v.total??v.grandTotal??((v.lines||[]).reduce((s,l)=>s+Number(l.quantity||0)*Number(l.price??l.cartonPrice??0),0))||0)}function balance(name){const w=workspace();let b=(w.accounts||[]).filter(a=>a.customer===name).reduce((s,a)=>s+Number(a.owedBy||0)-Number(a.owedTo||0),0);if(!(w.accounts||[]).some(a=>a.customer===name&&Number(a.owedBy)>0)){for(const v of(w.invoices||[]).filter(v=>!v.cancelled&&v.customer===name))b+=Math.max(0,invoiceTotal(v)-Number(v.paid||0))}return Math.round(b*100)/100}function autoRemoveZero(){const a=schedule(),keep=[],done=load(DONE,[]);let changed=false;for(const x of a){if(balance(x.name)<=0){changed=true;done.push({id:x.id,name:x.name,day:x.day,date:today(),completedAt:new Date().toISOString(),reason:'balance-zero',source:'automatic'})}else keep.push(x)}if(changed){store(KEY,keep);store(DONE,done)}return keep}function allNames(){const w=workspace(),r=load(ROUTE,[]),set=new Set();(Array.isArray(r)?r:[]).forEach(x=>x.name&&set.add(x.name));(w.accounts||[]).forEach(x=>x.customer&&x.customer!=='الصندوق'&&set.add(x.customer));return [...set].sort((a,b)=>a.localeCompare(b,'ar'))}function render(){const a=autoRemoveZero();$('days').innerHTML=order.map(d=>'<button class="day '+(selected===d?'on':'')+'" onclick="selectDay('+d+')">'+names[d]+'<span>'+a.filter(x=>Number(x.day)===d).length+' زبون</span></button>').join('');const rows=a.filter(x=>Number(x.day)===selected);$('listTitle').textContent='زبائن يوم '+names[selected]+' — '+rows.length;$('list').innerHTML=rows.length?rows.map(row).join(''):'<div class="empty">لا يوجد زبائن بهذا اليوم</div>';$('customerNames').innerHTML=allNames().map(n=>'<option value="'+esc(n)+'"></option>').join('')}function row(x){const b=balance(x.name),label=b>0?money(b):b<0?'له '+money(b):'0 د.ع';return '<div class="customer"><button class="customer-main" onclick="openCustomer(\''+encodeURIComponent(x.id)+'\')"><b>'+esc(x.name)+'</b></button><span class="amount '+(b<0?'credit':'')+'">'+label+'</span><span class="actions"><button class="icon ok" title="تم التسديد" onclick="completeEntry(\''+encodeURIComponent(x.id)+'\')">✓</button><button class="icon edit" title="تعديل" onclick="editEntry(\''+encodeURIComponent(x.id)+'\')">✎</button><button class="icon del" title="إلغاء" onclick="cancelEntry(\''+encodeURIComponent(x.id)+'\')">✕</button></span></div>'}function selectDay(d){selected=d;render()}function findEntry(encoded){const id=decodeURIComponent(encoded);return schedule().find(v=>String(v.id)===String(id))}function completeEntry(encoded){const x=findEntry(encoded);if(!x)return;const done=load(DONE,[]);done.push({id:x.id,name:x.name,day:x.day,date:today(),completedAt:new Date().toISOString(),reason:'manual-complete',source:'check'});store(DONE,done);store(KEY,schedule().filter(v=>String(v.id)!==String(x.id)));render()}function cancelEntry(encoded){const x=findEntry(encoded);if(!x)return;if(!confirm('إلغاء '+x.name+' من نظام التسديد؟'))return;store(KEY,schedule().filter(v=>String(v.id)!==String(x.id)));render()}function editEntry(encoded){const x=findEntry(encoded);if(x)openForm(x)}function openForm(x){editing=x?.id||null;$('formTitle').textContent=x?'تعديل موعد التسديد':'تعيين موعد تسديد';$('name').value=x?.name||'';$('day').value=String(x?.day??selected);$('remove').hidden=!x;$('overlay').classList.add('open')}function closeForm(){$('overlay').classList.remove('open');editing=null}function saveEntry(){const n=$('name').value.trim();if(!n)return alert('اختار اسم الزبون');const a=schedule(),d=Number($('day').value),existing=a.find(x=>x.name===n&&String(x.id)!==String(editing));if(existing)return alert('هذا الزبون موجود أصلاً بيوم '+names[existing.day]);if(editing){const x=a.find(v=>String(v.id)===String(editing));if(x){x.name=n;x.day=d;x.updatedAt=new Date().toISOString()}}else a.push({id:(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)),name:n,day:d,updatedAt:new Date().toISOString()});store(KEY,a);selected=d;closeForm();render()}function openCustomer(encoded){const x=findEntry(encoded);if(!x)return;const route=(load(ROUTE,[])||[]).find(c=>c.name===x.name)||{id:x.name,name:x.name};localStorage.setItem('albayanRepActiveCustomer',JSON.stringify(route));sessionStorage.setItem('albayanCurrentCustomer',x.name);location.href='rep-payment-v2.html?customer='+encodeURIComponent(x.name)+'&from=schedule&v=20260911-7'}$('add').onclick=()=>openForm();$('cancel').onclick=closeForm;$('save').onclick=saveEntry;$('remove').onclick=()=>{if(!editing)return;store(KEY,schedule().filter(x=>String(x.id)!==String(editing)));closeForm();render()};$('overlay').onclick=e=>{if(e.target===$('overlay'))closeForm()};window.addEventListener('storage',e=>{if([KEY,WORK,ROUTE,RECEIPTS].includes(e.key))render()});window.addEventListener('focus',render);render();</script></body></html>
