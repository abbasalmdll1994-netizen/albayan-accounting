<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07579a"><title>مواعيد التسديد | مكتب القرية</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3f8;color:#073e72;font-family:Tahoma,Arial,sans-serif}.top{background:linear-gradient(135deg,#075083,#0867a9);color:#fff;padding:18px 18px 22px}.wrap{max-width:900px;margin:auto}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.top h1{margin:0;font-size:27px}.top p{margin:7px 0 0;color:#e0edf7;font-size:16px}.addicon{border:0;background:#0878e5;color:#fff;border-radius:13px;padding:13px 20px;font:bold 16px Tahoma;box-shadow:0 5px 14px #003e7030}.page{padding:14px}.card{background:#fff;border:1px solid #d6e1eb;border-radius:17px;box-shadow:0 5px 18px #123b6310;margin-bottom:14px}.maincard{padding:14px}.stats{display:flex;gap:8px;margin-bottom:12px}.stat{flex:1;background:#f8fbfe;border:1px solid #dbe4ed;border-radius:12px;padding:9px 4px;text-align:center}.stat strong{display:block;font-size:19px}.stat span{font-size:11px;color:#718397}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}.daybtn{border:1px solid #c7d7e5;background:#f8fbfe;color:#073e72;border-radius:11px;padding:9px 2px;font:bold 12px Tahoma}.daybtn span{display:block;width:27px;margin:5px auto 0;padding:3px;border-radius:8px;background:#56a9f2;color:#063c6c}.daybtn.on{background:#0878e5;color:#fff;border-color:#0878e5}.daybtn.on span{background:#dcecff}.listTitle{font-size:18px;font-weight:bold;padding:4px 2px 11px}.customer{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px;border-top:1px solid #dfe7ee;padding:11px 4px}.customer b{font-size:14px}.amount{font-weight:bold;white-space:nowrap}.actions{display:flex;gap:5px}.actions button{width:36px;height:34px;border:0;border-radius:8px;color:#fff;font:bold 15px Tahoma}.edit{background:#0878e5}.paid{background:#08a45c}.del{background:#e62929}.paidrow{opacity:.55}.empty{text-align:center;color:#91a0ae;padding:25px}.all{width:100%;border:1px solid #c7d3df;background:#fff;border-radius:10px;padding:10px;margin-top:8px;font:bold 13px Tahoma;color:#073e72}.overlay{display:none;position:fixed;inset:0;background:#163c5d66;backdrop-filter:blur(2px);z-index:20;padding:18px;align-items:center;justify-content:center}.overlay.open{display:flex}.modal{width:min(700px,100%);background:#fff;border-radius:18px;padding:20px;box-shadow:0 20px 55px #102d4555}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0;font-size:23px}.x{border:0;background:transparent;font-size:28px;color:#555}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}.field label{display:block;font-weight:bold;font-size:14px;margin-bottom:7px}.field input,.field select{width:100%;height:52px;border:1px solid #b9c9d8;border-radius:11px;padding:11px;font:inherit;background:#fff}.wide{grid-column:1/-1}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:3px}.save,.cancel{height:50px;border-radius:11px;font:bold 15px Tahoma}.save{border:0;background:#07579a;color:#fff}.cancel{border:0;background:#eef4fa;color:#073e72}@media(max-width:600px){.toprow{align-items:flex-start}.top h1{font-size:23px}.top p{font-size:14px}.addicon{padding:11px 14px;font-size:14px}.days{grid-template-columns:repeat(4,1fr)}.customer{grid-template-columns:minmax(0,1fr) auto}.actions{grid-column:1/-1}.twocol{grid-template-columns:1fr 1fr}.modal{padding:16px}.field input,.field select{height:49px}}@media(max-width:390px){.toprow{flex-direction:column}.addicon{width:100%}.twocol{gap:8px}.field label{font-size:12px}.field input,.field select{padding:8px}}</style><script defer src="offline.js?v=offline-20260907-69"></script></head><body><header class="top"><div class="wrap toprow"><div><h1>📅 مواعيد التسديد</h1><p>ترتيب الزبائن حسب أيام الأسبوع</p></div><button class="addicon" id="addToggle">＋ إضافة زبون</button></div></header><main class="page wrap"><section class="card maincard"><div class="stats"><div class="stat"><strong id="total">0</strong><span>الزبائن</span></div><div class="stat"><strong id="due">0</strong><span>غير مسدد</span></div><div class="stat"><strong id="paid">0</strong><span>مسدد</span></div></div><div class="days" id="days"></div><div class="listTitle" id="listTitle"></div><div id="list"></div><button class="all" onclick="showAll()">عرض كل الزبائن</button></section></main><div class="overlay" id="overlay"><section class="modal"><div class="modalhead"><h2>👤＋ إضافة زبون جديد</h2><button class="x" id="x">×</button></div><div class="twocol"><div class="field"><label>اسم الزبون *</label><input id="name" placeholder="اسم الزبون" autocomplete="off"></div><div class="field"><label>المبلغ المستحق *</label><input id="amount" type="number" min="0" placeholder="0"></div><div class="field wide"><label>يوم التسديد *</label><select id="day"><option value="6">السبت</option><option value="0">الأحد</option><option value="1">الاثنين</option><option value="2">الثلاثاء</option><option value="3">الأربعاء</option><option value="4">الخميس</option><option value="5">الجمعة</option></select></div></div><div class="buttons"><button class="save" id="save">💾 حفظ الزبون</button><button class="cancel" id="cancel">إلغاء</button></div></section></div><script>const KEY='albayanPaymentScheduleV1',names={6:'السبت',0:'الأحد',1:'الاثنين',2:'الثلاثاء',3:'الأربعاء',4:'الخميس',5:'الجمعة'},order=[6,0,1,2,3,4,5],$=id=>document.getElementById(id);let selected=new Date().getDay(),editing=null;function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}function store(x){localStorage.setItem(KEY,JSON.stringify(x))}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(v){return Number(v||0).toLocaleString('ar-IQ')+' د.ع'}function render(){const a=load();$('total').textContent=a.length;$('paid').textContent=a.filter(x=>x.paid).length;$('due').textContent=a.filter(x=>!x.paid).length;$('days').innerHTML=order.map(d=>{const c=a.filter(x=>Number(x.day)===d).length;return'<button class="daybtn '+(selected===d?'on':'')+'" onclick="selectDay('+d+')">'+names[d]+'<span>'+c+'</span></button>'}).join('');renderList()}function row(x){return'<div class="customer '+(x.paid?'paidrow':'')+'"><b>'+esc(x.name)+'</b><div class="amount">'+money(x.amount)+'</div><div class="actions"><button class="edit" onclick="edit(\''+x.id+'\')">✎</button><button class="paid" onclick="toggle(\''+x.id+'\')">✓</button><button class="del" onclick="del(\''+x.id+'\')">⌫</button></div></div>'}function renderList(){const a=load().filter(x=>Number(x.day)===selected);$('listTitle').textContent='👥 زبائن يوم '+names[selected]+' — '+a.length;$('list').innerHTML=a.length?a.map(row).join(''):'<div class="empty">لا يوجد زبائن بهذا اليوم</div>'}function selectDay(d){selected=d;render()}function openForm(x){editing=x?x.id:null;$('name').value=x?x.name:'';$('amount').value=x?x.amount:'';$('day').value=x?String(x.day):String(selected);$('overlay').classList.add('open');setTimeout(()=>$('name').focus(),50)}function closeForm(){$('overlay').classList.remove('open');editing=null}function saveCustomer(){const name=$('name').value.trim();if(!name)return alert('اكتب اسم الزبون أولاً.');const a=load(),d=Number($('day').value),amount=Number($('amount').value)||0;if(editing){const x=a.find(v=>String(v.id)===String(editing));if(x){x.name=name;x.amount=amount;x.day=d;x.updatedAt=new Date().toISOString()}}else a.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),name,amount,day:d,paid:false,updatedAt:new Date().toISOString()});store(a);selected=d;closeForm();render()}function edit(id){const x=load().find(v=>String(v.id)===String(id));if(x)openForm(x)}function toggle(id){const a=load(),x=a.find(v=>String(v.id)===String(id));if(x){x.paid=!x.paid;store(a);render()}}function del(id){if(!confirm('حذف هذا الزبون من مواعيد التسديد؟'))return;store(load().filter(x=>String(x.id)!==String(id)));render()}function showAll(){const a=load();$('listTitle').textContent='👥 كل الزبائن — '+a.length;$('list').innerHTML=a.length?a.map(row).join(''):'<div class="empty">لا توجد مواعيد</div>'}$('addToggle').onclick=()=>openForm();$('x').onclick=closeForm;$('cancel').onclick=closeForm;$('save').onclick=saveCustomer;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeForm()};window.addEventListener('storage',e=>{if(e.key===KEY)render()});render();</script></body></html>
