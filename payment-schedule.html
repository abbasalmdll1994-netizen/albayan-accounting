<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07579a"><title>مواعيد التسديد</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3f8;color:#073e72;font-family:Tahoma,Arial}.top{background:#07579a;color:#fff;padding:18px}.wrap{max-width:900px;margin:auto}.top h1{margin:0;font-size:24px}.top p{margin:6px 0 0}.page{padding:14px}.card{background:#fff;border:1px solid #d6e1eb;border-radius:16px;padding:14px;margin-bottom:12px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}.day{border:1px solid #c7d7e5;background:#f8fbfe;color:#073e72;border-radius:11px;padding:10px 2px;font-weight:bold}.day.on{background:#0878e5;color:#fff}.day span{display:block;font-size:11px;margin-top:5px}.title{font-size:18px;font-weight:bold;margin:10px 0}.customer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid #e0e7ee;padding:13px 3px}.customer b{font-size:15px}.bal{display:block;margin-top:5px;font-size:13px;color:#526b82}.actions{display:flex;gap:6px}.btn{border:0;border-radius:9px;padding:9px 11px;font-weight:bold}.edit{background:#eaf2fb;color:#07579a}.pay{background:#17834a;color:#fff}.empty{text-align:center;color:#8292a1;padding:25px}.add,.close-day,.statement{width:100%;margin-top:10px;border:0;border-radius:11px;color:#fff;padding:13px;font-weight:bold}.add{background:#07579a}.close-day{background:#17834a}.statement{background:#1769aa}.close-day:disabled{background:#a9b6c1}.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f6f9fc;border-radius:12px;padding:13px}.stat strong{display:block;font-size:21px;margin-top:5px}.collection-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #e2e9ef}.closed{background:#e8f7ee;color:#17643b;border-radius:11px;padding:11px;margin-top:12px}.history-row{border-top:1px solid #e2e9ef;padding:11px 0;display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}.history-open{border:0;border-radius:8px;background:#eaf2fb;color:#07579a;padding:8px;font-weight:bold}.muted{font-size:12px;color:#687d90}.overlay{display:none;position:fixed;inset:0;background:#163c5d66;z-index:20;padding:18px;align-items:center;justify-content:center}.overlay.open{display:flex}.modal{width:min(520px,100%);background:#fff;border-radius:17px;padding:18px}.field{margin-bottom:13px}.field label{display:block;font-weight:bold;margin-bottom:7px}.field input,.field select{width:100%;height:50px;border:1px solid #b9c9d8;border-radius:11px;padding:10px;font:inherit;background:#fff}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.save,.cancel{height:48px;border:0;border-radius:11px;font-weight:bold}.save{background:#07579a;color:#fff}.cancel{background:#eef4fa;color:#073e72}@media(max-width:600px){.days{grid-template-columns:repeat(4,1fr)}.customer{grid-template-columns:1fr}.actions{justify-content:flex-start}.history-row{grid-template-columns:1fr auto}}</style></head><body><header class="top"><div class="wrap"><h1>📅 مواعيد التسديد</h1><p>جدول التحصيل الأسبوعي</p></div></header><main class="page wrap"><section class="card"><div class="days" id="days"></div><div class="title" id="title"></div><div id="list"></div><button class="add" onclick="openForm()">＋ تعيين زبون</button></section><section class="card"><div class="title">💰 تحصيل اليوم</div><div class="summary"><div class="stat">إجمالي المستحصل<strong id="todayTotal">0 د.ع</strong></div><div class="stat">عدد عمليات التسديد<strong id="todayCount">0</strong></div></div><div id="todayList"></div><button class="statement" onclick="openStatement(today())">📄 كشف تحصيل اليوم</button><div id="closeStatus"></div><button class="close-day" id="closeDayBtn" onclick="closeDay()">✓ تسليم وإقفال تحصيل اليوم</button></section><section class="card"><div class="title">📚 سجل تسليم التحصيل</div><div id="history"></div></section></main><div class="overlay" id="overlay"><div class="modal"><h2 id="formTitle">تعيين موعد تسديد</h2><div class="field"><label>اسم الزبون</label><input id="customerName" autocomplete="off"></div><div class="field"><label>يوم التسديد</label><select id="daySelect"><option value="0">الأحد</option><option value="1">الاثنين</option><option value="2">الثلاثاء</option><option value="3">الأربعاء</option><option value="4">الخميس</option><option value="5">الجمعة</option><option value="6">السبت</option></select></div><div class="buttons"><button class="save" onclick="saveForm()">حفظ</button><button class="cancel" onclick="closeForm()">إلغاء</button></div></div></div><script>const KEY='albayanPaymentScheduleV1',WORK='albayanWorkspaceV1',RECEIPTS='albayanPaymentReceiptsV2',CLOSES='albayanDailyCollectionClosingsV1',names=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];let selected=new Date().getDay(),editing=null;const load=(k,f=[])=>{try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:2}).format(Math.max(0,Number(n)||0))+' د.ع',today=()=>new Date().toISOString().slice(0,10);function schedule(){const a=load(KEY,[]);return Array.isArray(a)?a:[]}function workspace(){return load(WORK,{accounts:[],invoices:[]})}function invoiceTotal(v){return Number(v.total??v.grandTotal??((v.lines||[]).reduce((s,l)=>s+Number(l.quantity||0)*Number(l.price??l.cartonPrice??0),0))||0)}function balance(name){const w=workspace();let b=(w.accounts||[]).filter(a=>a.customer===name).reduce((s,a)=>s+Number(a.owedBy||0)-Number(a.owedTo||0),0);if(!(w.accounts||[]).some(a=>a.customer===name&&Number(a.owedBy)>0))b=(w.invoices||[]).filter(v=>!v.cancelled&&v.customer===name).reduce((s,v)=>s+Math.max(0,invoiceTotal(v)-Number(v.paid||0)),0);return Math.max(0,Math.round(b*100)/100)}function render(){const a=schedule();days.innerHTML=names.map((n,d)=>'<button class="day '+(selected===d?'on':'')+'" onclick="selected='+d+';render()">'+n+'<span>'+a.filter(x=>Number(x.day)===d).length+' زبون</span></button>').join('');const r=a.filter(x=>Number(x.day)===selected);title.textContent='زبائن يوم '+names[selected]+' — '+r.length;list.innerHTML=r.length?r.map(x=>'<div class="customer"><div><b>'+esc(x.name)+'</b><span class="bal">الرصيد: '+fmt(balance(x.name))+'</span></div><div class="actions"><button class="btn edit" onclick="editEntry(\''+encodeURIComponent(x.id)+'\')">تعديل</button><button class="btn pay" onclick="payEntry(\''+encodeURIComponent(x.id)+'\')">تسديد</button></div></div>').join(''):'<div class="empty">لا يوجد زبائن بهذا اليوم</div>';renderToday();renderHistory()}function openForm(x){editing=x?.id||null;formTitle.textContent=x?'تعديل موعد التسديد':'تعيين موعد تسديد';customerName.value=x?.name||'';daySelect.value=String(x?.day??selected);overlay.classList.add('open')}function closeForm(){overlay.classList.remove('open');editing=null}function saveForm(){const n=customerName.value.trim();if(!n)return alert('اكتب اسم الزبون');const d=Number(daySelect.value),a=schedule();if(editing){const x=a.find(v=>String(v.id)===String(editing));if(x){x.name=n;x.day=d;x.updatedAt=new Date().toISOString()}}else a.push({id:'p'+Date.now(),name:n,day:d,updatedAt:new Date().toISOString()});save(KEY,a);selected=d;closeForm();render()}function editEntry(e){const id=decodeURIComponent(e),x=schedule().find(v=>String(v.id)===id);if(x)openForm(x)}function payEntry(e){const id=decodeURIComponent(e),x=schedule().find(v=>String(v.id)===id);if(!x)return;localStorage.setItem('albayanRepActiveCustomer',JSON.stringify({id:x.id,name:x.name}));sessionStorage.setItem('albayanCurrentCustomer',x.name);location.href='rep-payment-v2.html?customer='+encodeURIComponent(x.name)+'&scheduleId='+encodeURIComponent(x.id)+'&from=schedule&v=20260911-10'}function reconcilePaid(){const a=schedule(),keep=[];let changed=false;for(const x of a){if(balance(x.name)<=0)changed=true;else keep.push(x)}if(changed)save(KEY,keep)}function todayRows(){const rs=load(RECEIPTS,[]);return(Array.isArray(rs)?rs:[]).filter(r=>String(r.date||'').slice(0,10)===today()&&r.status!=='cancelled')}function renderToday(){const rows=todayRows(),total=rows.reduce((s,r)=>s+Number(r.amount||0),0),closes=load(CLOSES,[]),closed=closes.find(c=>c.date===today());todayTotal.textContent=fmt(total);todayCount.textContent=rows.length;todayList.innerHTML=rows.length?rows.slice().reverse().map(r=>'<div class="collection-row"><span>'+esc(r.customer||'زبون')+'</span><b>'+fmt(r.amount)+'</b></div>').join(''):'<div class="empty">لا توجد تسديدات مسجلة اليوم</div>';closeDayBtn.disabled=!!closed||!rows.length;closeDayBtn.textContent=closed?'✓ تم تسليم تحصيل اليوم':'✓ تسليم وإقفال تحصيل اليوم';closeStatus.innerHTML=closed?'<div class="closed">تم التسليم للمحاسب · '+fmt(closed.total)+' · '+esc(closed.closedTime||'')+'</div>':''}function closeDay(){const rows=todayRows();if(!rows.length)return alert('لا توجد تسديدات اليوم');const closes=load(CLOSES,[]);if(closes.some(c=>c.date===today()))return alert('تحصيل اليوم مقفل ومسلم مسبقاً');const total=rows.reduce((s,r)=>s+Number(r.amount||0),0);if(!confirm('تأكيد تسليم '+fmt(total)+' للمحاسب وإقفال تحصيل اليوم؟'))return;const now=new Date();closes.push({id:'DC-'+Date.now(),date:today(),closedAt:now.toISOString(),closedTime:now.toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'}),total,count:rows.length,receiptIds:rows.map(r=>r.id||r.number),status:'handed-over'});save(CLOSES,closes);render()}function openStatement(d){location.href='collection-statement.html?date='+encodeURIComponent(d)+'&v=20260911-1'}function renderHistory(){const closes=load(CLOSES,[]);history.innerHTML=closes.length?closes.slice().reverse().map(c=>'<div class="history-row"><div><b>'+esc(c.date)+'</b><div class="muted">'+Number(c.count||0)+' عملية · تم التسليم '+esc(c.closedTime||'')+'</div></div><b>'+fmt(c.total)+'</b><button class="history-open" onclick="openStatement(\''+esc(c.date)+'\')">كشف</button></div>').join(''):'<div class="empty">لا يوجد تسليم سابق</div>'}window.addEventListener('focus',()=>{reconcilePaid();render()});window.addEventListener('pageshow',()=>{reconcilePaid();render()});window.addEventListener('storage',e=>{if([KEY,WORK,RECEIPTS,CLOSES].includes(e.key)){reconcilePaid();render()}});overlay.onclick=e=>{if(e.target===overlay)closeForm()};reconcilePaid();render();</script></body></html>
