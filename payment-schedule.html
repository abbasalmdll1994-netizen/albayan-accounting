<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b63"><title>مواعيد التسديد | مكتب القرية</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172b40;font-family:Tahoma,Arial,sans-serif}.top{background:#123b63;color:#fff;padding:16px}.topin,main{max-width:900px;margin:auto}.topin{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{font-size:20px;margin:0}.top a{color:#fff;text-decoration:none;border:1px solid #ffffff66;border-radius:9px;padding:8px 11px}.notice,.panel{background:#fff;border:1px solid #d9e3ed;border-radius:14px;padding:14px;margin:12px 0}.notice{background:#edf8f0;color:#16643c}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;overflow:auto}.day{border:1px solid #cbd9e6;background:#fff;color:#123b63;border-radius:11px;padding:10px 8px;min-width:82px;font:inherit;font-weight:bold}.day.on{background:#123b63;color:#fff}.day small{display:block;font-size:11px;margin-top:4px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.field input,.field select,.field textarea{min-height:45px;border:1px solid #afc0d0;border-radius:9px;padding:9px 11px;font:inherit;background:#fff}.field textarea{min-height:70px}.grid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:9px}.btn{min-height:44px;border:1px solid #cbd9e6;border-radius:9px;padding:8px 13px;background:#fff;color:#123b63;font:inherit}.primary{background:#123b63;color:#fff}.danger{color:#a52727}.customer{background:#fff;border:1px solid #d9e3ed;border-right:5px solid #18864b;border-radius:13px;padding:13px;margin:9px 0}.customer h3{margin:0 0 5px;font-size:17px}.meta{color:#627387;font-size:12px}.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.empty{text-align:center;color:#627387;padding:28px;background:#fff;border:1px dashed #bccbd8;border-radius:13px}.count{background:#eaf2fa;color:#123b63;border-radius:999px;padding:3px 9px;font-size:12px}.search{width:100%;min-height:44px;border:1px solid #afc0d0;border-radius:9px;padding:9px 11px;font:inherit;margin-bottom:10px}@media(max-width:650px){main{padding:0 10px}.grid{grid-template-columns:1fr 1fr}.grid .name{grid-column:1/-1}.days{grid-template-columns:repeat(7,82px)}.top{padding:13px 10px}}</style><script defer src="offline.js?v=offline-20260903-1"></script></head><body><header class="top"><div class="topin"><div><h1>📅 مواعيد تسديد الزباين</h1><small>نظام المندوب</small></div><a href="representative-dashboard.html">رجوع</a></div></header><main><div class="notice">اختار اليوم، وكل زبون مسجل بهذا اليوم يطلع قدامك حتى تزوره.</div><div class="panel"><div id="days" class="days"></div></div><div class="panel"><h2 style="font-size:18px;margin-top:0">إضافة موعد تسديد</h2><div class="grid"><div class="field name"><label>اسم الزبون</label><input id="name" autocomplete="off" placeholder="مثلاً: أبو علي ماركت"></div><div class="field"><label>يوم التسديد</label><select id="day"></select></div><div class="field"><label>المبلغ المتوقع</label><input id="amount" type="number" min="0" inputmode="numeric" placeholder="اختياري"></div></div><div class="field"><label>ملاحظة</label><textarea id="note" placeholder="مثلاً: الاتصال قبل الزيارة"></textarea></div><button id="save" class="btn primary">حفظ الموعد</button></div><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 id="title" style="font-size:18px;margin:0 0 10px">مواعيد اليوم</h2><span id="count" class="count">0</span></div><input id="search" class="search" type="search" placeholder="بحث باسم الزبون"><div id="list"></div></div></main><script>const KEY='albayanPaymentScheduleV1',days=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];let selected=new Date().getDay(),editing=null;const $=id=>document.getElementById(id);function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function store(v){localStorage.setItem(KEY,JSON.stringify(v))}function money(n){return new Intl.NumberFormat('ar-IQ').format(Number(n)||0)}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function renderDays(){const a=load();$('days').innerHTML=days.map((d,i)=>`<button class="day ${i===selected?'on':''}" data-i="${i}">${d}<small>${a.filter(x=>Number(x.day)===i).length} زبون</small></button>`).join('');$('day').innerHTML=days.map((d,i)=>`<option value="${i}" ${i===selected?'selected':''}>${d}</option>`).join('')}function render(){renderDays();const q=$('search').value.trim().toLowerCase(),a=load().filter(x=>Number(x.day)===selected&&(!q||String(x.name).toLowerCase().includes(q)));$('title').textContent='مواعيد يوم '+days[selected];$('count').textContent=a.length+' زبون';$('list').innerHTML=a.length?a.map(x=>`<div class="customer"><h3>${esc(x.name)}</h3>${x.amount?`<div><b>${money(x.amount)} د.ع</b></div>`:''}<div class="meta">${esc(x.note||'بدون ملاحظات')}</div><div class="row"><button class="btn" data-edit="${x.id}">تعديل</button><button class="btn danger" data-del="${x.id}">حذف</button></div></div>`).join(''):'<div class="empty">ماكو زباين مسجلين بهذا اليوم.</div>'}function clear(){editing=null;$('name').value='';$('amount').value='';$('note').value='';$('day').value=selected;$('save').textContent='حفظ الموعد'}$('days').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;selected=Number(b.dataset.i);clear();render()};$('search').oninput=render;$('save').onclick=()=>{const name=$('name').value.trim();if(!name)return alert('اكتب اسم الزبون');let a=load(),obj={id:editing||Date.now().toString(),name,day:Number($('day').value),amount:Number($('amount').value)||0,note:$('note').value.trim(),updatedAt:new Date().toISOString()};if(editing)a=a.map(x=>x.id===editing?obj:x);else a.push(obj);store(a);selected=obj.day;clear();render()};$('list').onclick=e=>{const ed=e.target.closest('[data-edit]'),del=e.target.closest('[data-del]'),a=load();if(ed){const x=a.find(v=>v.id===ed.dataset.edit);if(!x)return;editing=x.id;$('name').value=x.name;$('day').value=x.day;$('amount').value=x.amount||'';$('note').value=x.note||'';$('save').textContent='حفظ التعديل';scrollTo({top:0,behavior:'smooth'})}if(del&&confirm('حذف موعد هذا الزبون؟')){store(a.filter(v=>v.id!==del.dataset.del));render()}};render();</script></body></html>
