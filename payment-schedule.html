<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b63"><title>مواعيد التسديد | مكتب القرية</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#17324d;font-family:Tahoma,Arial,sans-serif}.top{background:#123b63;color:#fff;padding:18px}.wrap{max-width:1100px;margin:auto}.top h1{margin:0;font-size:25px}.top p{margin:7px 0 0;color:#d9e7f3}.page{padding:16px}.layout{display:grid;grid-template-columns:310px 1fr;gap:16px}.card{background:#fff;border:1px solid #dbe4ed;border-radius:17px;padding:16px;box-shadow:0 5px 18px #123b6310}.card h2{margin:0 0 15px}.field{margin-bottom:12px}.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #b9c9d8;border-radius:11px;padding:12px;font:inherit;background:#fff}.field textarea{min-height:72px}.save{width:100%;border:0;border-radius:11px;padding:13px;background:#123b63;color:#fff;font:bold 15px Tahoma}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{background:#fff;border:1px solid #d7e1eb;border-radius:14px;overflow:hidden;min-height:300px}.dayhead{padding:12px 7px;text-align:center;background:#eaf3fb;font-weight:bold;color:#123b63}.count{display:block;font-size:11px;color:#667b90;margin-top:3px}.list{padding:8px}.customer{border:1px solid #e0e7ee;border-radius:10px;padding:9px;margin-bottom:7px;background:#fff}.customer b{display:block;font-size:13px}.meta{font-size:11px;color:#718397;margin-top:4px}.amount{font-weight:bold;margin-top:5px}.actions{display:flex;gap:5px;margin-top:7px}.actions button{flex:1;border:1px solid #c7d3df;background:#fff;border-radius:7px;padding:6px;font:11px Tahoma}.actions .paid{color:#16834c}.empty{text-align:center;color:#91a0ae;font-size:12px;padding:22px 4px}.msg{display:none;margin-top:10px;padding:9px;border-radius:9px;background:#e9f7ef;color:#17633c;font-size:12px}.stats{display:flex;gap:8px;margin-bottom:12px}.stat{flex:1;background:#fff;border:1px solid #dbe4ed;border-radius:12px;padding:11px;text-align:center}.stat strong{display:block;font-size:20px;color:#123b63}.stat span{font-size:11px;color:#718397}@media(max-width:800px){.layout{grid-template-columns:1fr}.days{grid-template-columns:1fr 1fr}.day{min-height:170px}}@media(max-width:480px){.days{grid-template-columns:1fr}.top h1{font-size:22px}.page{padding:11px}}</style><script defer src="offline.js?v=offline-20260907-66"></script></head><body><header class="top"><div class="wrap"><h1>📅 مواعيد التسديد</h1><p>ترتيب الزبائن حسب أيام الأسبوع</p></div></header><main class="page wrap"><div class="layout"><section class="card"><h2>إضافة زبون</h2><div class="field"><label>اسم الزبون *</label><input id="name" placeholder="اسم الزبون"></div><div class="field"><label>رقم الهاتف</label><input id="phone" inputmode="tel" placeholder="07xxxxxxxxx"></div><div class="field"><label>المبلغ المستحق</label><input id="amount" type="number" min="0" placeholder="0"></div><div class="field"><label>يوم التسديد *</label><select id="day"><option value="6">السبت</option><option value="0">الأحد</option><option value="1">الاثنين</option><option value="2">الثلاثاء</option><option value="3">الأربعاء</option><option value="4">الخميس</option><option value="5">الجمعة</option></select></div><div class="field"><label>ملاحظات</label><textarea id="notes" placeholder="ملاحظات اختيارية"></textarea></div><button class="save" id="save">حفظ الزبون</button><div class="msg" id="msg">✓ تم حفظ الزبون وإضافته إلى يوم التسديد.</div></section><section><div class="stats"><div class="stat"><strong id="total">0</strong><span>إجمالي الزبائن</span></div><div class="stat"><strong id="due">0</strong><span>غير مسددين</span></div><div class="stat"><strong id="paid">0</strong><span>تم التسديد</span></div></div><div class="days" id="days"></div></section></div></main><script>const KEY='albayanPaymentScheduleV1',names={6:'السبت',0:'الأحد',1:'الاثنين',2:'الثلاثاء',3:'الأربعاء',4:'الخميس',5:'الجمعة'},order=[6,0,1,2,3,4,5],$=id=>document.getElementById(id);function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}function store(x){localStorage.setItem(KEY,JSON.stringify(x))}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(v){return Number(v||0).toLocaleString('ar-IQ')+' د.ع'}function render(){const a=load();$('total').textContent=a.length;$('paid').textContent=a.filter(x=>x.paid).length;$('due').textContent=a.filter(x=>!x.paid).length;$('days').innerHTML=order.map(d=>{const xs=a.filter(x=>Number(x.day)===d);return'<div class="day"><div class="dayhead">'+names[d]+'<span class="count">'+xs.length+' زبون</span></div><div class="list">'+(xs.length?xs.map(x=>'<div class="customer"><b>'+esc(x.name)+'</b>'+(x.phone?'<div class="meta">'+esc(x.phone)+'</div>':'')+(Number(x.amount)>0?'<div class="amount">'+money(x.amount)+'</div>':'')+(x.note||x.notes?'<div class="meta">'+esc(x.note||x.notes)+'</div>':'')+'<div class="actions"><button class="paid" onclick="toggle(\''+x.id+'\')">'+(x.paid?'↩ إلغاء التسديد':'✓ تم التسديد')+'</button><button onclick="del(\''+x.id+'\')">حذف</button></div></div>').join(''):'<div class="empty">لا يوجد زبائن</div>')+'</div></div>'}).join('')}function add(){const name=$('name').value.trim();if(!name){$('name').focus();return alert('اكتب اسم الزبون أولاً.')}const a=load();a.push({id:Date.now().toString(),name,phone:$('phone').value.trim(),amount:Number($('amount').value)||0,day:Number($('day').value),note:$('notes').value.trim(),paid:false,updatedAt:new Date().toISOString()});store(a);$('name').value='';$('phone').value='';$('amount').value='';$('notes').value='';$('msg').style.display='block';setTimeout(()=>$('msg').style.display='none',2200);render()}function toggle(id){const a=load(),x=a.find(v=>String(v.id)===String(id));if(x){x.paid=!x.paid;store(a);render()}}function del(id){if(!confirm('حذف هذا الزبون من مواعيد التسديد؟'))return;store(load().filter(x=>String(x.id)!==String(id)));render()}$('save').onclick=add;window.addEventListener('storage',e=>{if(e.key===KEY)render()});render();</script></body></html>
