<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استيراد أرصدة الزبائن</title><style>body{font-family:Tahoma,Arial;background:#edf3f8;color:#073e72;margin:0}main{max-width:850px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:17px;margin:12px 0}button,input{font:inherit}button{background:#07579a;color:white;border:0;border-radius:8px;padding:12px;margin:5px}button:disabled{background:#aaa}input{max-width:100%}.warn{color:#9a4300;background:#fff4dd;padding:12px}.row{border-bottom:1px solid #ddd;padding:8px}.row input{width:80px}.muted{color:#567}a{color:#07579a}</style><main><h1>استيراد أرصدة كشف الزبائن</h1><p><a href="payment-schedule.html">الرجوع لبرنامج التسديد</a></p><section class="card"><p>اختَر ملف الأرصدة JSON المُجهّز من كشف الحساب. ستُعرض الأسماء والمبالغ للمراجعة قبل تغيير البيانات.</p><input type="file" id="file" accept=".json,application/json"><p id="status"></p></section><section class="card" id="preview" hidden><h2>المعاينة</h2><p id="summary"></p><p class="warn" id="difference"></p><p>الزبائن الجدد يُعيَّنون تلقائياً إلى اليوم الذي تختاره؛ تستطيع تعديل يوم كل زبون لاحقاً من جدول التسديد.</p><label>يوم الزبائن الجدد <select id="day"><option value="0">الأحد</option><option value="1">الاثنين</option><option value="2">الثلاثاء</option><option value="3">الأربعاء</option><option value="4">الخميس</option><option value="5">الجمعة</option><option value="6">السبت</option></select></label><p><label><input type="checkbox" id="agree"> راجعت الأسماء والأرصدة وأوافق على تصفير أرصدة زبائن الجدول الحاليين واعتماد أرصدة الكشف. سيُنزل ملف نسخة احتياطية تلقائياً قبل التنفيذ.</label></p><button id="apply" disabled>حفظ الأرصدة في هذا الجهاز</button><div id="rows"></div></section></main><script>(function(){'use strict';var W='albayanWorkspaceV1',S='albayanPaymentScheduleV1',current=null;function el(id){return document.getElementById(id)}function read(k,def){try{return JSON.parse(localStorage.getItem(k)||'null')||def}catch(e){return def}}function fmt(n){return new Intl.NumberFormat('ar-IQ').format(n)+' د.ع'}function balance(w,name){var entries=(w.accounts||[]).filter(function(x){return x.customer===name});if(entries.length)return entries.reduce(function(v,x){return v+Number(x.owedBy||0)-Number(x.owedTo||0)},0);return(w.invoices||[]).filter(function(x){return !x.cancelled&&x.customer===name}).reduce(function(v,x){return v+Math.max(0,Number(x.total||x.grandTotal||0)-Number(x.paid||0))},0)}function download(name,data){var a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},60000)}function normalized(n){return String(n||'').trim().replace(/\s+/g,' ')}el('file').onchange=async function(){el('preview').hidden=true;el('status').textContent='';try{var data=JSON.parse(await this.files[0].text());if(!Array.isArray(data.customers)||data.customers.length!==93)throw Error('الملف لا يحتوي 93 زبوناً');var seen=new Set(),sum=0;data.customers.forEach(function(x){if(!x.name||!Number.isSafeInteger(x.balance)||x.balance<0||seen.has(normalized(x.name)))throw Error('اسم مكرر أو رصيد غير صالح: '+x.name);seen.add(normalized(x.name));sum+=x.balance});if(sum!==data.rows_total)throw Error('إجمالي السطور لا يطابق الملف');current=data;el('summary').textContent='عدد الزبائن: '+data.customers.length+' | مجموع أرصدة السطور: '+fmt(sum);el('difference').textContent=sum===data.printed_total?'إجمالي السطور يطابق الإجمالي المطبوع.':'تنبيه: إجمالي السطور '+fmt(sum)+'، والمطبوع في الكشف '+fmt(data.printed_total)+'، والفرق '+fmt(Math.abs(sum-data.printed_total))+'. ستُستورد قيم السطور كما هي.';el('rows').innerHTML='';data.customers.forEach(function(x){var d=document.createElement('div');d.className='row';d.textContent=x.sequence+' — '+x.name+' — '+fmt(x.balance);el('rows').appendChild(d)});el('preview').hidden=false;el('agree').checked=false;el('apply').disabled=true}catch(e){el('status').textContent='تعذر قراءة الملف: '+e.message}};el('agree').onchange=function(){el('apply').disabled=!this.checked};el('apply').onclick=function(){if(!current||!el('agree').checked)return;var schedule=read(S,[]),work=read(W,{accounts:[],invoices:[]});if(!Array.isArray(schedule)||!work||!Array.isArray(work.accounts))return alert('بيانات البرنامج غير صالحة');var names=new Set(schedule.map(function(x){return normalized(x.name)})),targets=new Map();schedule.forEach(function(x){targets.set(normalized(x.name),0)});current.customers.forEach(function(x){targets.set(normalized(x.name),x.balance)});var changed=[];targets.forEach(function(target,name){var hasAccounts=work.accounts.some(function(x){return x.customer===name});var diff=hasAccounts?target-balance(work,name):target;if(diff||!hasAccounts)changed.push({name:name,diff:diff})});var now=new Date(),date=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');var backup={savedAt:now.toISOString(),schedule:localStorage.getItem(S),workspace:localStorage.getItem(W)};download('نسخة-قبل-استيراد-الارصدة-'+date+'.json',backup);var previousSchedule=localStorage.getItem(S),previousWork=localStorage.getItem(W);try{current.customers.forEach(function(x){var name=normalized(x.name);if(!names.has(name)){schedule.push({id:'pdf-'+x.code+'-'+Date.now(),name:name,day:Number(el('day').value),updatedAt:now.toISOString()});names.add(name)}});changed.forEach(function(x,i){work.accounts.push({id:'PDF-BAL-'+Date.now()+'-'+i,customer:x.name,date:date,owedBy:x.diff>0?x.diff:0,owedTo:x.diff<0?-x.diff:0,notes:'تثبيت الرصيد من كشف العملاء 21/11/2026',type:'balance-correction',createdAt:now.toISOString()})});localStorage.setItem(W,JSON.stringify(work));localStorage.setItem(S,JSON.stringify(schedule));alert('تم اعتماد '+current.customers.length+' زبوناً. احتفظ بنسخة الأمان التي نزلت على جهازك.');location.href='payment-schedule.html'}catch(e){if(previousWork===null)localStorage.removeItem(W);else localStorage.setItem(W,previousWork);if(previousSchedule===null)localStorage.removeItem(S);else localStorage.setItem(S,previousSchedule);alert('لم يكتمل الاستيراد: '+e.message)}}})();</script></html>
