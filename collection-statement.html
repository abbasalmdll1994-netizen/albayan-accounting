<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كشف تحصيل اليوم | البيان</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#172b40;font-family:Tahoma,Arial}.wrap{max-width:850px;margin:auto;padding:14px}.paper{background:#fff;border:1px solid #d8e1e9;border-radius:14px;padding:18px}.head{text-align:center;border-bottom:2px solid #123b63;padding-bottom:13px}.head h1{margin:0;color:#123b63}.head p{margin:5px}.meta,.totals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.box{background:#f5f8fb;border-radius:10px;padding:12px}.box b{display:block;font-size:20px;margin-top:5px}.row{display:grid;grid-template-columns:45px 1fr 130px 130px;gap:8px;padding:11px 5px;border-bottom:1px solid #e1e8ee;align-items:center}.row.header{font-weight:bold;background:#eef4f9;border-radius:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.btn{border:0;border-radius:10px;padding:13px;font-weight:bold;background:#123b63;color:#fff}.back{background:#e8eef3;color:#172b40}.closed{margin-top:12px;background:#e8f7ee;color:#17643b;padding:11px;border-radius:9px}.empty{text-align:center;color:#718397;padding:25px}@media(max-width:600px){.row{grid-template-columns:35px 1fr 100px}.row>*:nth-child(3){display:none}.meta,.totals{grid-template-columns:1fr}}@media print{body{background:#fff}.wrap{padding:0;max-width:none}.paper{border:0;border-radius:0}.actions{display:none}}</style></head><body><main class="wrap"><section class="paper"><div class="head"><h1>مكتب القرية</h1><p>واسط - السوق الكبير</p><h2>كشف تحصيل المندوب اليومي</h2></div><div class="meta"><div class="box">التاريخ<b id="date"></b></div><div class="box">عدد سندات القبض<b id="count">0</b></div></div><div class="row header"><span>ت</span><span>اسم الزبون</span><span>رقم السند</span><span>المبلغ</span></div><div id="rows"></div><div class="totals"><div class="box">إجمالي التحصيل<b id="total">0 د.ع</b></div><div class="box">حالة التسليم<b id="status">غير مسلم</b></div></div><div id="closedInfo"></div><div class="actions"><button class="btn" onclick="window.print()">طباعة / حفظ PDF</button><button class="btn back" onclick="history.back()">رجوع</button></div></section></main><script>const R='albayanPaymentReceiptsV2',C='albayanDailyCollectionClosingsV1';const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}},fmt=n=>new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:2}).format(Number(n)||0)+' د.ع',esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const p=new URLSearchParams(location.search),d=p.get('date')||new Date().toISOString().slice(0,10),receipts=load(R,[]).filter(r=>String(r.date||'').slice(0,10)===d&&r.status!=='cancelled'),closing=load(C,[]).find(x=>x.date===d),sum=receipts.reduce((s,r)=>s+Number(r.amount||0),0);date.textContent=d;count.textContent=receipts.length;total.textContent=fmt(sum);rows.innerHTML=receipts.length?receipts.map((r,i)=>'<div class="row"><span>'+(i+1)+'</span><b>'+esc(r.customer||'زبون')+'</b><span>'+esc(r.number||'-')+'</span><b>'+fmt(r.amount)+'</b></div>').join(''):'<div class="empty">لا توجد سندات قبض بهذا اليوم</div>';if(closing){status.textContent='تم التسليم';closedInfo.innerHTML='<div class="closed">تم تسليم '+fmt(closing.total)+' للمحاسب · '+esc(closing.closedTime||'')+'</div>'}else status.textContent='غير مسلم';</script></body></html>
