<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b63"><title>تقارير المندوب | البيان</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#172b40;font-family:Tahoma,Arial,sans-serif}.top{background:#123b63;color:white;padding:14px;position:sticky;top:0}.wrap{max-width:800px;margin:auto;padding:12px}.card,.row{background:white;border:1px solid #d9e3ed;border-radius:13px;padding:12px;margin-bottom:9px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filters select,.filters input{min-height:44px;border:1px solid #afc0d0;border-radius:10px;padding:8px;background:white;width:100%}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}.tab{border:1px solid #c7d4df;background:white;color:#123b63;border-radius:10px;padding:10px 5px;font-weight:bold}.tab.on{background:#123b63;color:white}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.summary div{background:#fff;border:1px solid #d9e3ed;border-radius:11px;padding:10px;text-align:center}.summary b{display:block;font-size:19px;margin-top:4px}.muted{color:#66788a;font-size:12px}.good{color:#17834a}.bad{color:#b83232}.line{display:flex;justify-content:space-between;gap:10px;align-items:center}.empty{text-align:center;color:#66788a;padding:28px}.back{border:0;background:#e8eef4;border-radius:9px;padding:8px 12px}.page{display:none}.page.on{display:block}@media(max-width:520px){.filters{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}</style></head><body><header class="top"><b>تقارير المندوب</b></header><main class="wrap"><button class="back" onclick="location.href='representative.html?v=20260911-reports'">رجوع للجولة</button><div class="card" style="margin-top:10px"><div class="filters"><div><small>من تاريخ</small><input id="from" type="date"></div><div><small>إلى تاريخ</small><input id="to" type="date"></div><div><small>الوكالة</small><select id="agency"><option value="">كل الوكالات</option></select></div><div><small>الصنف</small><select id="item"><option value="">كل الأصناف</option></select></div></div></div><nav class="tabs"><button class="tab on" data-tab="customers">الزبائن</button><button class="tab" data-tab="items">الأصناف</button><button class="tab" data-tab="free">FTF</button></nav><div id="summary" class="summary"></div><section id="customers" class="page on"><div id="customersList"></div></section><section id="items" class="page"><div id="itemsList"></div></section><section id="free" class="page"><div id="freeList"></div></section></main><script>const P='albayanPendingInvoicesV1',W='albayanWorkspaceV1',ROUTE='albayanRepresentativeRouteV1';const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}},money=n=>new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:0}).format(Number(n)||0)+' د.ع',num=n=>new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:2}).format(Number(n)||0);const today=new Date().toISOString().slice(0,10);from.value=today.slice(0,8)+'01';to.value=today;const w=load(W,{items:[]}),raw=load(P,[]);function orders(){const a=agency.value,i=item.value,f=from.value,t=to.value;return raw.filter(o=>{const d=String(o.createdAt||o.invoice?.date||'').slice(0,10);if(!String(o.source||'').startsWith('representative')||o.syncStatus==='cancelled')return false;if(f&&d<f||t&&d>t)return false;if(a&&String(o.agency||o.invoice?.agency||'')!==a)return false;if(i&&!(o.invoice?.lines||[]).some(l=>String(l.itemId)===i))return false;return true})}function routeNames(){const r=load(ROUTE,[]);if(Array.isArray(r))return r.map(x=>x.name||x.customer||x.customerName).filter(Boolean);if(Array.isArray(r.customers))return r.customers.map(x=>x.name||x.customer||x.customerName).filter(Boolean);return[]}function initFilters(){const agencies=[...new Set(raw.map(o=>o.agency||o.invoice?.agency).filter(Boolean))].sort();agency.innerHTML='<option value="">كل الوكالات</option>'+agencies.map(x=>'<option>'+x+'</option>').join('');const its=(w.items||[]).map((x,k)=>({id:String(x.id??x.code??k),name:x.name||x.description||'مادة'}));item.innerHTML='<option value="">كل الأصناف</option>'+its.map(x=>'<option value="'+x.id+'">'+x.name+'</option>').join('')}function render(){const os=orders(),lines=os.flatMap(o=>(o.invoice?.lines||[]).map(l=>({...l,customer:o.invoice?.customer||'',agency:o.agency||o.invoice?.agency||''}))),buyers=[...new Set(lines.filter(l=>Number(l.quantity)>0).map(l=>l.customer))],all=routeNames(),notBought=all.filter(n=>!buyers.includes(n)),sales=lines.reduce((s,l)=>s+Number(l.quantity||0)*Number(l.price||0),0);summary.innerHTML='<div>بايع لهم<b class="good">'+buyers.length+'</b></div><div>ما بايع لهم<b class="bad">'+notBought.length+'</b></div><div>قيمة البيع<b>'+money(sales)+'</b></div>';customersList.innerHTML=(buyers.map(n=>{const ls=lines.filter(l=>l.customer===n),v=ls.reduce((s,l)=>s+Number(l.quantity||0)*Number(l.price||0),0);return '<div class="row line"><div><b>'+n+'</b><div class="muted">تم البيع</div></div><b class="good">'+money(v)+'</b></div>'}).join('')+notBought.map(n=>'<div class="row line"><div><b>'+n+'</b><div class="muted">ما بايع له ضمن الفترة</div></div><b class="bad">—</b></div>').join(''))||'<div class="empty">ماكو بيانات ضمن الفترة</div>';const map=new Map();lines.forEach(l=>{const k=String(l.itemId),x=map.get(k)||{name:l.itemName||k,paid:0,free:0,customers:new Set(),agency:l.agency};x.paid+=Number(l.quantity||0);x.free+=Number(l.freeQuantity||0);if(Number(l.quantity)>0)x.customers.add(l.customer);map.set(k,x)});itemsList.innerHTML=[...map.values()].filter(x=>x.paid>0).map(x=>'<div class="row"><div class="line"><b>'+x.name+'</b><span class="muted">'+(x.agency||'')+'</span></div><div class="line" style="margin-top:7px"><span>الكمية المباعة: <b>'+num(x.paid)+'</b></span><span>الزبائن: <b>'+x.customers.size+'</b></span></div></div>').join('')||'<div class="empty">ماكو أصناف مباعة</div>';freeList.innerHTML=[...map.values()].filter(x=>x.free>0).map(x=>'<div class="row line"><div><b>'+x.name+'</b><div class="muted">FTF مجاني · لا يدخل بقيمة المبيعات</div></div><b class="good">'+num(x.free)+'</b></div>').join('')||'<div class="empty">ماكو كميات FTF ضمن الفترة</div>'}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.page').forEach(x=>x.classList.toggle('on',x.id===b.dataset.tab))});[from,to,agency,item].forEach(x=>x.onchange=render);initFilters();render();</script><script src="rep-reports-upgrade.js?v=20260911-1"></script></body></html>
