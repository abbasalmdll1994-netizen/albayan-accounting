<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b63"><title>لوحة الإدارة والمحاسب | مكتب القرية</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Tahoma,Arial,sans-serif;background:#f3f6fa;color:#172b40}.top{height:64px;background:#123b63;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px}.top h1{font-size:20px;margin:0}.top a{color:#fff;text-decoration:none;border:1px solid #ffffff55;border-radius:9px;padding:8px 11px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:9px;background:#f3f6fa;border-bottom:1px solid #d9e3ed}.sum{background:#fff;border:1px solid #d9e3ed;border-radius:10px;padding:9px 12px}.sum span{display:block;color:#627387;font-size:11px}.sum b{display:block;color:#123b63;font-size:18px;margin-top:3px}.tabs{display:flex;gap:8px;overflow:auto;padding:9px;background:#fff;border-bottom:1px solid #d9e3ed}.tab{border:1px solid #d9e3ed;background:#fff;color:#123b63;border-radius:9px;min-height:42px;padding:8px 13px;font:inherit;font-weight:bold;white-space:nowrap;display:flex;align-items:center;gap:7px}.tab.on{background:#123b63;color:#fff;border-color:#123b63}.count{min-width:22px;height:22px;border-radius:999px;background:#b83232;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;padding:0 6px}.count.zero{background:#aab5c0}.frame{width:100%;height:calc(100% - 189px);border:0;background:#fff;display:none}.frame.on{display:block}@media(max-width:600px){.top h1{font-size:17px}.top{height:58px}.frame{height:calc(100% - 183px)}.sum b{font-size:16px}}</style></head><body><header class="top"><h1>لوحة الإدارة والمحاسب</h1><a href="start.html">رجوع</a></header><div class="summary"><div class="sum"><span>فواتير بانتظار الموافقة</span><b id="pendingInvoiceSummary">0</b></div><div class="sum"><span>مبالغ بانتظار استلام المحاسب</span><b id="pendingCashSummary">0 د.ع</b></div></div><nav class="tabs"><button class="tab on" data-frame="adminFrame">⚙️ الجولات والموافقات <span id="invoiceBadge" class="count zero">0</span></button><button class="tab" data-frame="cashFrame">💵 استلام تحصيل المندوب <span id="cashBadge" class="count zero">0</span></button></nav><iframe id="adminFrame" class="frame on" src="admin-control.html?v=20260902-2055" title="إدارة الجولات والموافقات"></iframe><iframe id="cashFrame" class="frame" src="cash-handover.html?mode=accountant&v=20260902-2055" title="استلام تحصيل المندوب"></iframe><script>const PENDING='albayanPendingInvoicesV1',HANDOVERS='albayanCashHandoversV1';function load(k,f){try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}}function money(n){return new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:2}).format(Number(n)||0)}function refreshSummary(){const inv=load(PENDING,[]),hs=load(HANDOVERS,[]),pendingInv=Array.isArray(inv)?inv.length:0,pendingCash=Array.isArray(hs)?hs.filter(x=>x.status==='pending'):[],cashTotal=pendingCash.reduce((s,x)=>s+Number(x.amount||0),0);document.getElementById('pendingInvoiceSummary').textContent=pendingInv;document.getElementById('pendingCashSummary').textContent=money(cashTotal)+' د.ع';const ib=document.getElementById('invoiceBadge'),cb=document.getElementById('cashBadge');ib.textContent=pendingInv;cb.textContent=pendingCash.length;ib.classList.toggle('zero',pendingInv===0);cb.classList.toggle('zero',pendingCash.length===0)}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.frame').forEach(f=>f.classList.toggle('on',f.id===b.dataset.frame));refreshSummary()});window.addEventListener('storage',refreshSummary);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshSummary()});setInterval(refreshSummary,1500);refreshSummary();</script></body></html>
