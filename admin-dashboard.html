<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b63"><title>لوحة الإدارة والمحاسب | مكتب القرية</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Tahoma,Arial,sans-serif;background:#f3f6fa;color:#172b40}.top{height:64px;background:#123b63;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px}.top h1{font-size:20px;margin:0}.top a{color:#fff;text-decoration:none;border:1px solid #ffffff55;border-radius:9px;padding:8px 11px}.tabs{display:flex;gap:8px;overflow:auto;padding:9px;background:#fff;border-bottom:1px solid #d9e3ed}.tab{border:1px solid #d9e3ed;background:#fff;color:#123b63;border-radius:9px;min-height:42px;padding:8px 13px;font:inherit;font-weight:bold;white-space:nowrap}.tab.on{background:#123b63;color:#fff;border-color:#123b63}.frame{width:100%;height:calc(100% - 116px);border:0;background:#fff;display:none}.frame.on{display:block}@media(max-width:600px){.top h1{font-size:17px}.top{height:58px}.frame{height:calc(100% - 110px)}}</style></head><body><header class="top"><h1>لوحة الإدارة والمحاسب</h1><a href="start.html">رجوع</a></header><nav class="tabs"><button class="tab on" data-frame="adminFrame">⚙️ الجولات والموافقات</button><button class="tab" data-frame="cashFrame">💵 استلام تحصيل المندوب</button></nav><iframe id="adminFrame" class="frame on" src="admin-control.html?v=20260902-2045" title="إدارة الجولات والموافقات"></iframe><iframe id="cashFrame" class="frame" src="cash-handover.html?mode=accountant&v=20260902-2045" title="استلام تحصيل المندوب"></iframe><script>document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.frame').forEach(f=>f.classList.toggle('on',f.id===b.dataset.frame))});</script></body></html>
