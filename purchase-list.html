<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قائمة المشتريات | مكتب القرية</title><style>body{margin:0;background:#f5f8fc;color:#17304d;font-family:Tahoma,Arial,sans-serif}.top{background:#123b63;color:#fff;padding:18px;text-align:center}.wrap{max-width:900px;margin:auto;padding:22px 16px}.box{background:#fff;border:1px solid #d9e3ed;border-radius:16px;padding:20px}.back{display:inline-block;margin-bottom:18px;color:#123b63;text-decoration:none;font-weight:bold}h2{margin-top:0;color:#123b63}.empty{padding:30px;text-align:center;color:#65788c;border:1px dashed #cbd8e5;border-radius:12px}</style></head><body><header class="top"><h1>قائمة المشتريات</h1></header><main class="wrap"><a class="back" href="purchases.html">‹ رجوع إلى المشتريات</a><section class="box"><h2>قائمة المشتريات</h2><div id="list" class="empty">لا توجد مشتريات مسجلة حالياً</div></section></main><script>const keys=['albayanPurchaseOrders','albayanPurchaseOrdersV1'];let rows=[];for(const k of keys){try{const x=JSON.parse(localStorage.getItem(k)||'[]');if(Array.isArray(x)&&x.length){rows=x;break}}catch{}}if(rows.length){document.getElementById('list').className='';document.getElementById('list').innerHTML=rows.map((x,i)=>'<div style="padding:12px;border-bottom:1px solid #e2e8f0"><b>شراء رقم '+(i+1)+'</b><br><small>'+(x.supplier||x.date||'')+'</small></div>').join('')}</script></body></html>
