<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b63"><title>قائمة المشتريات | مكتب القرية</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#17304d;font-family:Tahoma,Arial,sans-serif}.top{background:#123b63;color:#fff;padding:18px;text-align:center}.top h1{margin:0;font-size:25px}.wrap{max-width:920px;margin:auto;padding:20px 14px 35px}.back{display:inline-block;margin-bottom:15px;color:#123b63;text-decoration:none;font-weight:bold}.tools{display:flex;gap:10px;margin-bottom:14px}.tools input{flex:1;border:1px solid #cbd8e5;border-radius:10px;padding:11px;font:inherit}.new{background:#147343;color:#fff;text-decoration:none;border-radius:10px;padding:11px 15px;font-weight:bold}.card{background:#fff;border:1px solid #d9e3ed;border-radius:15px;padding:16px;margin-bottom:12px}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.supplier{font-size:19px;font-weight:bold;color:#123b63}.date{color:#65788c;font-size:13px}.badge{background:#fff3d9;color:#8a5a00;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:bold}.items{margin-top:12px;border-top:1px solid #e3eaf1}.item{display:grid;grid-template-columns:1fr 80px 120px;gap:8px;padding:9px 0;border-bottom:1px solid #edf1f5}.total{margin-top:11px;font-weight:bold;color:#147343}.note{margin-top:8px;color:#65788c;font-size:13px}.empty{background:#fff;padding:35px;text-align:center;color:#65788c;border:1px dashed #cbd8e5;border-radius:14px}@media(max-width:600px){.tools{flex-direction:column}.new{text-align:center}.item{grid-template-columns:1fr 65px}.item .cost{display:none}}</style></head><body><header class="top"><h1>قائمة المشتريات</h1></header><main class="wrap"><a class="back" href="purchases.html">‹ رجوع إلى المشتريات</a><div class="tools"><input id="search" placeholder="بحث باسم المورد أو الصنف"><a class="new" href="purchase-order.html">+ طلبية شراء جديدة</a></div><div id="list"></div></main><script>let rows=[];try{rows=JSON.parse(localStorage.getItem('albayanPurchaseOrdersV1')||'[]')}catch{}if(!Array.isArray(rows))rows=[];const list=document.getElementById('list');function money(n){return new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:2}).format(Number(n)||0)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function draw(q=''){q=q.trim().toLowerCase();const data=rows.filter(x=>!q||String(x.supplier||'').toLowerCase().includes(q)||(x.items||[]).some(i=>String(i.name||'').toLowerCase().includes(q)));if(!data.length){list.innerHTML='<div class="empty">'+(rows.length?'لا توجد نتائج مطابقة':'لا توجد مشتريات مسجلة حالياً')+'</div>';return}list.innerHTML=data.map((x,idx)=>{const total=(x.items||[]).reduce((s,i)=>s+Number(i.qty||0)*Number(i.price||0),0);return '<article class="card"><div class="head"><div><div class="supplier">'+esc(x.supplier||'بدون مورد')+'</div><div class="date">'+esc(x.date||'')+' · '+esc(x.id||('شراء '+(idx+1)))+'</div></div><span class="badge">'+(x.status==='received'?'مستلمة':'معلقة')+'</span></div><div class="items">'+(x.items||[]).map(i=>'<div class="item"><span>'+esc(i.name)+'</span><span>'+money(i.qty)+'</span><span class="cost">'+money(Number(i.qty||0)*Number(i.price||0))+' د.ع</span></div>').join('')+'</div><div class="total">المجموع: '+money(total)+' د.ع</div>'+(x.note?'<div class="note">ملاحظات: '+esc(x.note)+'</div>':'')+'</article>'}).join('')}document.getElementById('search').oninput=e=>draw(e.target.value);draw();</script></body></html>
