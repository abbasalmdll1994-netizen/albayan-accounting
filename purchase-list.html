<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b63"><title>قائمة المشتريات | مكتب القرية</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#17304d;font-family:Tahoma,Arial,sans-serif}.top{background:#123b63;color:#fff;padding:18px;text-align:center}.top h1{margin:0;font-size:25px}.wrap{max-width:920px;margin:auto;padding:20px 14px 35px}.back{display:inline-block;margin-bottom:15px;color:#123b63;text-decoration:none;font-weight:bold}.tools{display:flex;gap:10px;margin-bottom:14px}.tools input{flex:1;border:1px solid #cbd8e5;border-radius:10px;padding:11px;font:inherit}.new,.receive{border:0;background:#147343;color:#fff;text-decoration:none;border-radius:10px;padding:11px 15px;font-weight:bold;font:inherit}.receive[disabled]{opacity:.5}.card{background:#fff;border:1px solid #d9e3ed;border-radius:15px;padding:16px;margin-bottom:12px}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.supplier{font-size:19px;font-weight:bold;color:#123b63}.date{color:#65788c;font-size:13px}.badge{background:#fff3d9;color:#8a5a00;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:bold}.badge.done{background:#e9f7ef;color:#147343}.items{margin-top:12px;border-top:1px solid #e3eaf1}.item{display:grid;grid-template-columns:1fr 80px 120px;gap:8px;padding:9px 0;border-bottom:1px solid #edf1f5}.total{margin-top:11px;font-weight:bold;color:#147343}.note{margin-top:8px;color:#65788c;font-size:13px}.actions{margin-top:12px;display:flex;gap:8px;align-items:center}.empty{background:#fff;padding:35px;text-align:center;color:#65788c;border:1px dashed #cbd8e5;border-radius:14px}.msg{display:none;margin-bottom:12px;padding:11px;border-radius:10px;background:#e9f7ef;color:#147343;font-weight:bold}.msg.err{background:#fff0f0;color:#a32626}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:18px;z-index:99}.modal.show{display:grid}.dialog{width:min(420px,100%);background:#fff;border-radius:16px;padding:20px;text-align:center}.dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.yes,.no{min-height:45px;border-radius:10px;font:inherit;font-weight:bold}.yes{border:0;background:#147343;color:#fff}.no{border:1px solid #cbd8e5;background:#fff;color:#123b63}@media(max-width:600px){.tools{flex-direction:column}.new{text-align:center}.item{grid-template-columns:1fr 65px}.item .cost{display:none}}</style></head><body><header class="top"><h1>قائمة المشتريات</h1></header><main class="wrap"><a class="back" href="purchases.html">‹ رجوع إلى المشتريات</a><div class="tools"><input id="search" placeholder="بحث باسم المورد أو الصنف"><a class="new" href="purchase-order.html">+ طلبية شراء جديدة</a></div><div id="msg" class="msg"></div><div id="list"></div></main><div id="modal" class="modal"><div class="dialog"><h3>تأكيد استلام الطلبية</h3><p>سيتم إضافة الكميات إلى رصيد المخزون الفعلي. هل تريد الاستمرار؟</p><div class="dialog-actions"><button id="yes" class="yes">نعم</button><button id="no" class="no">لا</button></div></div></div><script>const ORD='albayanPurchaseOrdersV1',W='albayanWorkspaceV1';let rows=[];try{rows=JSON.parse(localStorage.getItem(ORD)||'[]')}catch{}if(!Array.isArray(rows))rows=[];const list=document.getElementById('list'),msg=document.getElementById('msg'),modal=document.getElementById('modal');let pendingIndex=-1;function money(n){return new Intl.NumberFormat('ar-IQ',{maximumFractionDigits:2}).format(Number(n)||0)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function tell(t,e=false){msg.textContent=t;msg.className='msg'+(e?' err':'');msg.style.display='block';setTimeout(()=>msg.style.display='none',4000)}function matchItem(items,line){const id=String(line.id??line.itemId??'');const code=String(line.code??line.itemCode??'');const name=String(line.name??line.itemName??'').trim();return items.find(x=>(id&&String(x.id??x.code??'')===id)||(code&&String(x.code??'')===code)||(name&&String(x.name??'').trim()===name))}function receive(idx){const order=rows[idx];if(!order||order.status==='received'||order.receivedAt){tell('هذه الطلبية مستلمة سابقاً',true);return}let w;try{w=JSON.parse(localStorage.getItem(W)||'{}')}catch{w={}};if(!w||!Array.isArray(w.items)){tell('تعذر قراءة مخزون برنامج البيان',true);return}const changes=[];for(const line of order.items||[]){const item=matchItem(w.items,line);const qty=Number(line.qty??line.quantity??0);if(!item||!Number.isFinite(qty)||qty<=0){tell('تعذر مطابقة أحد الأصناف مع المخزون. لم يتم الاستلام.',true);return}changes.push({item,qty})}if(!changes.length){tell('الطلبية لا تحتوي كميات قابلة للاستلام',true);return}for(const c of changes)c.item.quantity=Math.max(0,Number(c.item.quantity)||0)+c.qty;const now=new Date().toISOString();order.status='received';order.receivedAt=now;order.stockAppliedAt=now;order.receivedItems=changes.map(c=>({id:String(c.item.id??c.item.code??''),code:String(c.item.code??''),name:c.item.name,quantity:c.qty}));localStorage.setItem(W,JSON.stringify(w));localStorage.setItem(ORD,JSON.stringify(rows));window.dispatchEvent(new StorageEvent('storage',{key:W,newValue:JSON.stringify(w)}));tell('✓ تم استلام الطلبية وتعزيز رصيد المخزون');draw(document.getElementById('search').value)}function draw(q=''){q=q.trim().toLowerCase();const data=rows.map((x,idx)=>({x,idx})).filter(o=>!q||String(o.x.supplier||'').toLowerCase().includes(q)||(o.x.items||[]).some(i=>String(i.name||'').toLowerCase().includes(q)));if(!data.length){list.innerHTML='<div class="empty">'+(rows.length?'لا توجد نتائج مطابقة':'لا توجد مشتريات مسجلة حالياً')+'</div>';return}list.innerHTML=data.map(({x,idx})=>{const total=(x.items||[]).reduce((s,i)=>s+Number(i.qty||0)*Number(i.price||0),0),done=x.status==='received'||!!x.receivedAt;return '<article class="card"><div class="head"><div><div class="supplier">'+esc(x.supplier||'بدون مورد')+'</div><div class="date">'+esc(x.date||'')+' · '+esc(x.id||('شراء '+(idx+1)))+'</div></div><span class="badge '+(done?'done':'')+'">'+(done?'مستلمة':'معلقة')+'</span></div><div class="items">'+(x.items||[]).map(i=>'<div class="item"><span>'+esc(i.name)+'</span><span>'+money(i.qty)+'</span><span class="cost">'+money(Number(i.qty||0)*Number(i.price||0))+' د.ع</span></div>').join('')+'</div><div class="total">المجموع: '+money(total)+' د.ع</div>'+(x.note?'<div class="note">ملاحظات: '+esc(x.note)+'</div>':'')+'<div class="actions">'+(done?'<small>تم تعزيز المخزون '+esc(x.receivedAt?new Date(x.receivedAt).toLocaleString('ar-IQ'):'')+'</small>':'<button class="receive" data-receive="'+idx+'">استلام وتعزيز الرصيد</button>')+'</div></article>'}).join('');document.querySelectorAll('[data-receive]').forEach(b=>b.onclick=()=>{pendingIndex=Number(b.dataset.receive);modal.classList.add('show')})}document.getElementById('search').oninput=e=>draw(e.target.value);document.getElementById('no').onclick=()=>{pendingIndex=-1;modal.classList.remove('show')};document.getElementById('yes').onclick=()=>{const i=pendingIndex;pendingIndex=-1;modal.classList.remove('show');receive(i)};modal.onclick=e=>{if(e.target===modal){pendingIndex=-1;modal.classList.remove('show')}};draw();</script></body></html>
